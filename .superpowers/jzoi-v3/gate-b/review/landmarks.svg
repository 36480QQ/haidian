<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7f6f2"/>
  <rect x="0" y="0" width="1400" height="8" fill="#111111"/>
  <text x="72" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">LANDMARK SYSTEM</text>
  <text x="72" y="83" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start" letter-spacing="0">Safety Gantry / Open Bracket / Civic Switch</text>
  <text x="1328" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e6512e" text-anchor="end" letter-spacing="0">INTERNAL GATE B REVIEW</text>
  <text x="1328" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#555555" text-anchor="end" letter-spacing="0">DESIGN TARGET / CONCEPT</text>
  <line x1="72" y1="102" x2="1328" y2="102" stroke="#222222" stroke-width="1"/>
  <rect x="1035" y="126" width="293" height="694" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="1060" y="151" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">LEGEND</text>
  <line x1="1060" y1="176" x2="1105" y2="176" stroke="#008c99" stroke-width="4" /><text x="1120" y="181" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">public / access</text><line x1="1060" y1="207" x2="1105" y2="207" stroke="#ef6c3e" stroke-width="4" /><text x="1120" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">human review</text><line x1="1060" y1="238" x2="1105" y2="238" stroke="#e3bd25" stroke-width="5" /><text x="1120" y="243" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">bounded testing</text><line x1="1060" y1="269" x2="1105" y2="269" stroke="#4d9a72" stroke-width="5" /><text x="1120" y="274" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">commons / ecology</text><line x1="1060" y1="300" x2="1105" y2="300" stroke="#222222" stroke-width="4" /><text x="1120" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">fixed civic frame</text>
  <text x="1060" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">REVIEW NOTES</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">01  Three physically distinct forms correspond to endpoint identity.</text><text x="1060" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">02  All retain legible non-digital states after power or network loss.</text><text x="1060" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">03  Scale is relative design envelope, not statutory height.</text><text x="1060" y="522" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">04  Night states are low-glare and carry no tracking or advertising.</text><text x="1060" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">05  Forms use JZOI black, cyan, orange, green, and bounded-test yellow.</text>
  <text x="92" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">CONTROLLED TEST YARD</text><text x="92" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#e6512e" text-anchor="start" letter-spacing="0">LANDMARK-ZZY-SAFETY-GANTRY</text><path d="M 122 530 L 122 275 L 317 275 L 317 530" fill="none" stroke="#222" stroke-width="12"/><line x1="130" y1="410" x2="309" y2="410" stroke="#d52b2b" stroke-width="9"/><text x="92" y="574" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">marks the transition between ordinary city movement and controlled testing</text><text x="92" y="598" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">fixed sign, manual stop bar, and staffed explanation remain available</text><text x="92" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">low-glare white frame with red physical stop state; no dynamic advertising</text><text x="92" y="646" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">quarterly stop drill and replaceable rail/panel inspection</text><text x="392" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">POROUS COMMONS</text><text x="392" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#e6512e" text-anchor="start" letter-spacing="0">LANDMARK-ORG-OPEN-BRACKET</text><path d="M 467 285 L 417 285 L 417 520 L 467 520" fill="none" stroke="#222" stroke-width="13"/><path d="M 572 285 L 622 285 L 622 520 L 572 520" fill="none" stroke="#222" stroke-width="13"/><line x1="422" y1="402" x2="617" y2="402" stroke="#008c99" stroke-width="5"/><text x="392" y="574" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">makes the public commons and four-way permeability legible</text><text x="392" y="598" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">printed dependency board and staffed commons desk</text><text x="392" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">soft white task light and fixed green commons marker</text><text x="392" y="646" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">monthly fastener, surface, tactile-route, and notice-board check</text><text x="692" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">URBAN SWITCHBOARD</text><text x="692" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#e6512e" text-anchor="start" letter-spacing="0">LANDMARK-DZS-CIVIC-SWITCH</text><rect x="787" y="280" width="70" height="240" fill="#222"/><rect x="712" y="370" width="220" height="55" fill="#a7d8df" stroke="#222" stroke-width="3"/><line x1="822" y1="300" x2="822" y2="500" stroke="#ef6c3e" stroke-width="6"/><text x="692" y="574" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">marks consent, appeal, enterprise service, and culture as one civic interface</text><text x="692" y="598" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">paper directory, staffed HUMAN-DESK, and fixed arrows remain operational</text><text x="692" y="622" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">low-glare face lighting; service-open state shown without tracking</text><text x="692" y="646" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">weekly directory update and quarterly lighting/manual-mode inspection</text>
  <line x1="72" y1="850" x2="1328" y2="850" stroke="#222222" stroke-width="1"/>
  <text x="72" y="876" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">JINGZHANG OPEN INTERFACE / CIVIC PROTOCOL MODERNISM</text>
  <text x="1328" y="876" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="end" letter-spacing="0">Not a statutory plan. Alignments and envelopes require official evidence.</text>
</svg>
