<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#f7f6f2"/>
  <rect x="0" y="0" width="1400" height="8" fill="#111111"/>
  <text x="72" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">COMPONENT SYSTEM</text>
  <text x="72" y="83" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#555555" text-anchor="start" letter-spacing="0">Five spatial component families with clearance and operating logic</text>
  <text x="1328" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e6512e" text-anchor="end" letter-spacing="0">INTERNAL GATE B REVIEW</text>
  <text x="1328" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#555555" text-anchor="end" letter-spacing="0">DESIGN TARGET / CONCEPT</text>
  <line x1="72" y1="102" x2="1328" y2="102" stroke="#222222" stroke-width="1"/>
  <rect x="1035" y="126" width="293" height="694" fill="#ffffff" stroke="#222222" stroke-width="1"/>
  <text x="1060" y="151" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">LEGEND</text>
  <line x1="1060" y1="176" x2="1105" y2="176" stroke="#008c99" stroke-width="4" /><text x="1120" y="181" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">public / access</text><line x1="1060" y1="207" x2="1105" y2="207" stroke="#ef6c3e" stroke-width="4" /><text x="1120" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">human review</text><line x1="1060" y1="238" x2="1105" y2="238" stroke="#e3bd25" stroke-width="5" /><text x="1120" y="243" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">bounded testing</text><line x1="1060" y1="269" x2="1105" y2="269" stroke="#4d9a72" stroke-width="5" /><text x="1120" y="274" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">commons / ecology</text><line x1="1060" y1="300" x2="1105" y2="300" stroke="#222222" stroke-width="4" /><text x="1120" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="start" letter-spacing="0">fixed civic frame</text>
  <text x="1060" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">REVIEW NOTES</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">01  Dimensions are conceptual and require detailed accessibility review.</text><text x="1060" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">02  Components sit beside clear paths and cannot become ticketed choke points.</text><text x="1060" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">03  Operational states remain legible without mandatory screens.</text><text x="1060" y="522" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">04  Information hierarchy starts with purpose, stop/refusal, and human help.</text><text x="1060" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">05  Scenario references are encoded in components.geojson.</text>
  <text x="92" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">IF-MARK</text><text x="92" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">900 mm wide x 2200 mm high marker; concept dimension</text><line x1="360" y1="205" x2="970" y2="205" stroke="#222" stroke-width="2"/><rect x="590" y="128" width="72" height="76" fill="#f7f6f2" stroke="#222" stroke-width="5"/><line x1="603" y1="155" x2="649" y2="155" stroke="#008c99" stroke-width="4"/><text x="760" y="155" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e6512e" text-anchor="start" letter-spacing="0">DZS / ORG / ZZY</text><text x="760" y="180" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">placed at gateways beside, never within, the clear public path</text><text x="92" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">CONSENT-POST</text><text x="92" y="319" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">450 mm wide x 1100 mm high post; concept dimension</text><line x1="360" y1="330" x2="970" y2="330" stroke="#222" stroke-width="2"/><rect x="590" y="253" width="72" height="76" fill="#f7f6f2" stroke="#222" stroke-width="5"/><line x1="603" y1="280" x2="649" y2="280" stroke="#008c99" stroke-width="4"/><text x="760" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e6512e" text-anchor="start" letter-spacing="0">ZZY / ORG / DZS</text><text x="760" y="305" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">aligned with service threshold but set back from walking desire line</text><text x="92" y="420" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">HUMAN-DESK</text><text x="92" y="444" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">1800 mm desk module with 760 mm and 900 mm work surfaces; concept dimension</text><line x1="360" y1="455" x2="970" y2="455" stroke="#222" stroke-width="2"/><path d="M 510 452 L 510 395 L 740 395 L 740 452" fill="none" stroke="#ef6c3e" stroke-width="7"/><text x="760" y="405" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e6512e" text-anchor="start" letter-spacing="0">DZS / ORG / ZZY / OVERALL</text><text x="760" y="430" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">visible from PARALLEL-HUMAN with no controlled threshold before help</text><text x="92" y="545" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">TEST-RAIL</text><text x="92" y="569" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">1000 mm high modular rail; bay length set by test safety case</text><line x1="360" y1="580" x2="970" y2="580" stroke="#222" stroke-width="2"/><line x1="430" y1="545" x2="850" y2="545" stroke="#d52b2b" stroke-width="9"/><line x1="450" y1="515" x2="450" y2="579" stroke="#222" stroke-width="5"/><line x1="830" y1="515" x2="830" y2="579" stroke="#222" stroke-width="5"/><text x="760" y="530" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e6512e" text-anchor="start" letter-spacing="0">ZZY</text><text x="760" y="555" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">defines controlled yard edge while preserving the separate ordinary path</text><text x="92" y="670" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">QUIET-BEACON</text><text x="92" y="694" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">300 mm wide x 1400 mm high non-audio marker; concept dimension</text><line x1="360" y1="705" x2="970" y2="705" stroke="#222" stroke-width="2"/><rect x="590" y="628" width="72" height="76" fill="#f7f6f2" stroke="#222" stroke-width="5"/><line x1="603" y1="655" x2="649" y2="655" stroke="#008c99" stroke-width="4"/><text x="760" y="655" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e6512e" text-anchor="start" letter-spacing="0">DZS / ORG / ZZY</text><text x="760" y="680" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#555" text-anchor="start" letter-spacing="0">marks quiet waiting/route branches without narrowing the main path</text>
  <line x1="72" y1="850" x2="1328" y2="850" stroke="#222222" stroke-width="1"/>
  <text x="72" y="876" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">JINGZHANG OPEN INTERFACE / CIVIC PROTOCOL MODERNISM</text>
  <text x="1328" y="876" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#555555" text-anchor="end" letter-spacing="0">Not a statutory plan. Alignments and envelopes require official evidence.</text>
</svg>
