ze="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">research</text><rect x="268" y="409" width="166" height="78" fill="#c8d9dc" stroke="#222" stroke-width="1.5"/><text x="351" y="513" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">translation</text><rect x="444" y="447" width="166" height="40" fill="#8fc99d" stroke="#222" stroke-width="1.5"/><text x="527" y="513" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">public commons</text><rect x="620" y="397" width="166" height="90" fill="#e8a06f" stroke="#222" stroke-width="1.5"/><text x="703" y="513" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">prototype</text><rect x="796" y="425" width="166" height="62" fill="#b8d79e" stroke="#222" stroke-width="1.5"/><text x="879" y="513" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">neighborhood</text><line x1="92" y1="453" x2="970" y2="453" stroke="#008c99" stroke-width="4" stroke-dasharray="14 7"/><text x="92" y="590" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">DZS / URBAN SWITCHBOARD</text><line x1="92" y1="692" x2="970" y2="692" stroke="#222" stroke-width="2"/><rect x="92" y="638" width="166" height="54" fill="#efb7a2" stroke="#222" stroke-width="1.5"/><text x="175" y="718" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">appeal</text><rect x="268" y="614" width="166" height="78" fill="#ef6c3e" stroke="#222" stroke-width="1.5"/><text x="351" y="718" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#222" text-anchor="middle" letter-spacing="0">consent</text><rect x="444" y="652" width="166" height="40" fill="#a7d8df"