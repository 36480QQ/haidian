  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">01  Relative envelopes only; no statutory height claim.</text><text x="1060" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">02  Sections prove path, frontage, gradient, and fail-safe relationships.</text><text x="1060" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">03  Existing ground levels and buildings require survey.</text><text x="1060" y="522" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">04  All ordinary paths remain outside controlled test thresholds.</text><text x="1060" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">05  DZS station relation is not represented as a physical section link.</text>
