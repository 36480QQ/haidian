ine><polygon points="370.1,334.0 724.6,334.0 724.6,284.9 715.5,275.8 361.0,275.8 361.0,324.9 370.1,334.0" fill="#e2e1dc" stroke="#333333" stroke-width="1.5" opacity="0.7" vector-effect="non-scaling-stroke"><title>ZZY-QINGHE-RAIN-GARDEN</title></polygon><polyline points="481.0,632.2 615.5,632.2" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-TEST-RAIL-STOP</title></polyline><polyline points="615.5,632.2 615.5,450.4" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-TEST-RAIL-STOP</title></polyline><polyline points="615.5,450.4 481.0,450.4" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-TEST-RAIL-STOP</title></polyline><polyline points="481.0,450.4 481.0,632.2" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-TEST-RAIL-STOP</title></polyline><polygon points="635.5,774.0 706.5,774.0 706.5,684.9 697.4,675.8 626.5,675.8 626.5,764.9 635.5,774.0" fill="#e2e1dc" stroke="#333333" stroke-width="1.5" opacity="0.7" vector-effect="non-scaling-stroke"><title>ZZY-ENTERPRISE-TEST-BAY</title></polygon><polyline points="459.2,654.0 637.4,654.0 637.4,428.5" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-PUBLIC-TEST-BOUNDARY</title></polyline><polygon points="391.9,770.4 451.9,770.4 451.9,684.9 442.8,675.8 382.8,675.8 382.8,761.3 391.9,770.4" fill="#e2e1dc" stroke="#333333" stroke-width="1.5" opacity="0.7" vector-effect="non-scaling-stroke"><title>ZZY-MASSING-FRAME</title></polygon><polyline points="357.4,544.9 724.6,544.9" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><title>ZZY-SECTION-A</title></polyline><circle cx="568.3" cy="668.5" r="6" fill="none" stroke="#303030" stroke-width="2.0" opacity="0.9" vector-effect="non-scaling-stroke"><ti