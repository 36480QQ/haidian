  <text x="1060" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#222222" text-anchor="start" letter-spacing="0">REVIEW NOTES</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">01  Ordinary pedestrian movement bypasses controlled testing.</text><text x="1060" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">02  Cycle test loop is geometrically closed.</text><text x="1060" y="468" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">03  Observation and Human Review Gate face the test boundary.</text><text x="1060" y="522" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">04  TEST-RAIL provides a power-independent emergency stop.</text><text x="1060" y="576" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#343434" text-anchor="start" letter-spacing="0">05  Qinghe relation is background only; rain garden is proposed.</text>
