<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案正文 — 百年京张 AI 创新带</title>
<link rel="shortcut icon" href="/favicon.ico?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3">
<style>
:root{
  --bg:#05070a;--panel:#090c11;--paper:#f5f7fa;--ink:#162033;--muted:#707887;
  --line:#ffffff1c;--paper-line:#dbe1e9;--accent:#ffc46b;--blue:#65b7ff;
  --purple:#9d8cff;--green:#62d6a8;--danger:#e08b78;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#eef1f5;font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.topbar{
  position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:space-between;
  min-height:62px;padding:10px 24px;border-bottom:1px solid var(--line);
  background:#05070aeb;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)
}
.back{display:flex;align-items:center;gap:10px;color:#a2a9b4;font-size:12px}
.back:hover{color:var(--accent)}
.top-title{min-width:0;margin:0 20px;color:#c9ced6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.action{
  display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;
  border:1px solid var(--line);background:#090c11;color:#adb4bf;font-size:11px;letter-spacing:.03em;
  cursor:pointer;transition:.18s
}
.action:hover{border-color:var(--accent);color:var(--accent)}
.action.primary{border-color:#ffc46b80;background:#ffc46b12;color:var(--accent)}
.progress{position:fixed;z-index:100;top:61px;left:0;width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--blue))}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;max-width:1500px;margin:0 auto}
.report-wrap{min-width:0;padding:34px 28px 90px}
.report{
  max-width:980px;min-height:75vh;margin:0 auto;padding:50px 58px 80px;background:var(--paper);
  color:var(--ink);box-shadow:0 0 0 1px #ffffff10,0 28px 80px #0008
}
.report-status{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:-50px -58px 42px;
  border-bottom:1px solid var(--paper-line);background:#edf2f7
}
.status-cell{padding:13px 14px;border-right:1px solid var(--paper-line)}
.status-cell:last-child{border-right:0}
.status-value{display:block;color:#244e75;font:600 15px var(--mono)}
.status-label{display:block;margin-top:3px;color:#7d8794;font-size:9px;letter-spacing:.08em}
.report .hero{padding:0 0 28px;margin:0 0 28px;border-bottom:3px solid #245b8f}
.report h1{margin:0 0 12px;font-size:clamp(30px,4vw,46px);line-height:1.15;letter-spacing:-.04em}
.report h2{margin:48px 0 18px;padding-top:26px;border-top:1px solid var(--paper-line);font-size:27px;line-height:1.35;letter-spacing:-.025em}
.report h3{margin:32px 0 12px;font-size:21px;line-height:1.4}
.report h4{margin:24px 0 10px;font-size:17px}
.report p,.report li{font-size:16px;line-height:1.92}
.report p{margin:0 0 19px}
.report ul{padding-left:22px}
.report code{padding:.08em .32em;border-radius:4px;background:#e9eef4;color:#20527c;font-family:var(--mono);font-size:.92em}
.report pre{max-width:100%;padding:16px;overflow:auto;background:#e9eef4;color:#24384d;font:12px/1.65 var(--mono)}
.report blockquote{margin:22px 0;padding:12px 18px;border-left:3px solid #7997b4;background:#eaf0f6;color:#4f6073}
.report table{width:100%;margin:24px 0;border-collapse:collapse;font-size:13px}
.report th,.report td{padding:10px 12px;border:1px solid var(--paper-line);text-align:left;vertical-align:top}
.report th{background:#eaf0f6}
.report .summary{color:#667085;font-size:17px}
.report figure{margin:30px 0;border:1px solid var(--paper-line);background:#fff;overflow:hidden}
.report figure img{display:block;width:100%;height:auto}
.report figcaption{padding:10px 14px;border-top:1px solid var(--paper-line);color:#717b89;font-size:13px}
.evidence-ref{
  display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;margin:0 .08em;padding:0 .35em;
  border:1px solid #aebdcd;border-radius:999px;background:#edf3f8;color:#245b8f;
  font:600 10px var(--mono);vertical-align:.18em;cursor:pointer;transition:.16s
}
.evidence-ref:hover,.evidence-ref.active{border-color:#245b8f;background:#245b8f;color:#fff;transform:translateY(-1px)}
.evidence-ref.unresolved{border-style:dashed;color:#8a6670;background:#f8eef0}
.panel{
  position:sticky;top:62px;height:calc(100vh - 62px);border-left:1px solid var(--line);
  background:linear-gradient(180deg,#090c11,#06080c);overflow:hidden
}
.panel-inner{height:100%;display:flex;flex-direction:column}
.panel-head{padding:23px 22px 18px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--accent);font:9px var(--mono);letter-spacing:.18em;text-transform:uppercase}
.panel-title{display:flex;justify-content:space-between;align-items:end;margin-top:8px}
.panel-title h2{margin:0;font-size:20px;font-weight:400}
.coverage{color:var(--green);font:14px var(--mono)}
.coverage-note{margin-top:8px;color:#7f8792;font-size:11px;line-height:1.6}
.filters{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);overflow:auto}
.filter{
  flex:none;padding:7px 9px;border:1px solid var(--line);background:transparent;color:#87909d;
  font:9px var(--mono);cursor:pointer
}
.filter.active{border-color:#ffc46b75;background:#ffc46b0f;color:var(--accent)}
.detail{padding:19px 20px;border-bottom:1px solid var(--line);max-height:43%;overflow:auto}
.detail-placeholder{color:#707986;font-size:12px;line-height:1.8}
.detail-type{display:inline-block;margin-bottom:9px;color:var(--blue);font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.detail h3{margin:0 0 9px;font-size:15px;font-weight:500;line-height:1.5}
.detail-summary{color:#a3aab4;font-size:12px;line-height:1.75}
.detail-grid{display:grid;gap:8px;margin-top:14px}
.detail-row{padding-top:8px;border-top:1px solid #ffffff10}
.detail-key{display:block;color:#646d79;font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.detail-value{display:block;margin-top:4px;color:#a8afb9;font-size:11px;line-height:1.6;word-break:break-word}
.detail-link{display:inline-flex;margin-top:14px;color:var(--accent);font-size:11px;border-bottom:1px solid #ffc46b55}
.evidence-list{flex:1;overflow:auto;padding:8px 10px 20px}
.evidence-item{
  width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;padding:11px 10px;
  border:0;border-bottom:1px solid #ffffff0c;background:transparent;cursor:pointer
}
.evidence-item:hover,.evidence-item.active{background:#ffffff08}
.evidence-n{display:grid;place-items:center;width:25px;height:25px;border:1px solid #ffffff26;color:#8fbce5;font:9px var(--mono)}
.evidence-item.active .evidence-n{border-color:var(--accent);color:var(--accent)}
.evidence-name{display:block;color:#b8bec7;font-size:11px;line-height:1.45}
.evidence-meta{display:block;margin-top:4px;color:#626b77;font:8px var(--mono);text-transform:uppercase}
.loading{display:grid;place-items:center;min-height:60vh;color:#7d8590;font:11px var(--mono);letter-spacing:.12em}
.error{max-width:680px;margin:80px auto;padding:28px;border:1px solid #e08b7855;background:#e08b780b;color:#d4a093}
.mobile-toggle{display:none}
@media(max-width:1050px){
  .shell{grid-template-columns:minmax(0,1fr) 320px}
  .report{padding-left:40px;padding-right:40px}.report-status{margin-left:-40px;margin-right:-40px}
}
@media(max-width:820px){
  .topbar{padding:9px 14px}.top-title{display:none}.action.secondary{display:none}
  .shell{display:block}.report-wrap{padding:20px 12px 90px}.report{padding:34px 20px 60px}
  .report-status{grid-template-columns:repeat(3,1fr);margin:-34px -20px 30px}
  .status-cell:nth-child(3){border-right:0}.status-cell:nth-child(n+4){border-top:1px solid var(--paper-line)}
  .report p,.report li{font-size:15px;line-height:1.85}.report h2{font-size:23px}
  .panel{position:fixed;z-index:90;inset:112px 0 0;height:auto;border-left:0;border-top:1px solid var(--line);transform:translateY(105%);transition:.25s}
  .panel.open{transform:translateY(0)}
  .mobile-toggle{display:inline-flex}.panel-head{padding-top:16px}.detail{max-height:35%}
}
@media print{
  body{background:#fff}.topbar,.panel,.progress{display:none}.shell{display:block}.report-wrap{padding:0}.report{box-shadow:none;max-width:none}
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="topbar">
  <a class="back" href="submissions.html">← 返回方案展示</a>
  <div class="top-title" id="topTitle">正在载入方案</div>
  <div class="top-actions">
    <button class="action mobile-toggle" id="evidenceToggle" type="button">证据索引 <span id="mobileCount">0</span></button>
    <a class="action secondary" id="sourceLink" href="#">源文件</a>
    <a class="action secondary" id="a3Link" href="#">A3 图册</a>
    <a class="action primary" id="visualLink" href="#">交互可视化 ↗</a>
  </div>
</header>
<div class="shell">
  <div class="report-wrap">
    <article class="report" id="report"><div class="loading">LOADING PROPOSAL PACKAGE</div></article>
  </div>
  <aside class="panel" id="panel">
    <div class="panel-inner">
      <div class="panel-head">
        <div class="eyebrow">Structured Evidence</div>
        <div class="panel-title"><h2>证据索引</h2><span class="coverage" id="coverage">0 / 0</span></div>
        <div class="coverage-note">正文中的编号不是缺失内容。点击编号，可查看对应来源、指标、空间要素或专业深度记录。</div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="detail" id="detail"><div class="detail-placeholder">选择正文中的证据编号，查看结构化资料</div></div>
      <div class="evidence-list" id="evidenceList"></div>
    </div>
  </aside>
</div>
<script>
const KIND_META={
  source:{zh:'来源',en:'Source',color:'#65b7ff'},
  metric:{zh:'指标',en:'Metric',color:'#62d6a8'},
  data:{zh:'空间数据',en:'Spatial data',color:'#9d8cff'},
  standard:{zh:'专业依据',en:'Standard',color:'#ffc46b'},
  depth:{zh:'专业深度',en:'Design depth',color:'#e19a72'}
};
const state={refs:[],filter:'all',selected:null,packagePath:'',data:new Map()};
const $=selector=>document.querySelector(selector);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const asArray=value=>Array.isArray(value)?value:[];
const compact=value=>Array.isArray(value)?value.filter(Boolean).join('、'):value===null||value===undefined?'':String(value);
function safeHttpUrl(value,base=location.href){
  try{
    const url=new URL(value,base);
    return url.protocol==='http:'||url.protocol==='https:'?url.href:'';
  }catch(error){return ''}
}

function validPackagePath(value){
  return /^submissions\/[A-Za-z0-9-]{1,39}\/[A-Za-z0-9._-]+$/.test(value||'');
}
function packageUrl(path=''){return `${state.packagePath}/${path}`.replace(/\/+$/,'')}
async function fetchText(path){
  const response=await fetch(path,{cache:'no-store'});
  if(!response.ok)throw new Error(`${path} · HTTP ${response.status}`);
  return response.text();
}
async function fetchJSON(path){
  try{return JSON.parse(await fetchText(path))}catch(error){return null}
}
function sanitizeReport(root,reportUrl){
  root.querySelectorAll('script,style,link,meta,base,iframe,object,embed,form,input,textarea,select,button').forEach(node=>node.remove());
  root.querySelectorAll('*').forEach(node=>{
    [...node.attributes].forEach(attr=>{
      const name=attr.name.toLowerCase();
      if(name.startsWith('on')||name==='srcdoc')node.removeAttribute(attr.name);
    });
  });
  root.querySelectorAll('img').forEach(img=>{
    const raw=img.getAttribute('src')||'';
    const resolved=new URL(raw,reportUrl);
    if(resolved.origin!==location.origin||!resolved.pathname.includes(`/${state.packagePath}/`)){img.remove();return}
    img.src=resolved.href;img.loading='lazy';
  });
  root.querySelectorAll('a[href]').forEach(link=>{
    const raw=link.getAttribute('href')||'';
    const resolved=safeHttpUrl(raw,reportUrl);
    if(!resolved){link.removeAttribute('href');return}
    link.href=resolved;
    if(link.origin!==location.origin){link.target='_blank';link.rel='noopener'}
  });
}
function buildMaps(payload){
  const maps={
    source:new Map(asArray(payload.sources?.sources).map(item=>[String(item.id),item])),
    metric:new Map(Object.entries(payload.metrics?.metrics||{})),
    standard:new Map(asArray(payload.standards?.standards).map(item=>[String(item.standard_id),item])),
    depth:new Map(asArray(payload.depth?.items).map(item=>[String(item.item_id),item]))
  };
  return maps;
}
async function resolveDataRefs(refs){
  const paths=[...new Set(refs.filter(ref=>ref.kind==='data').map(ref=>ref.value.split('#')[0]).filter(path=>/^[A-Za-z0-9._/-]+$/.test(path)&&!path.includes('..')&&!path.includes('...')))];
  await Promise.all(paths.map(async path=>state.data.set(path,await fetchJSON(packageUrl(path)))));
}
function findFeature(data,id){
  if(!data||!id)return null;
  return asArray(data.features).find(feature=>String(feature?.id||'')===id||String(feature?.properties?.id||'')===id)||null;
}
function summarizeProperties(properties){
  if(!properties||typeof properties!=='object')return [];
  const preferred=['name_zh','name','title_zh','title','land_use_code','building_type','road_class','phase','area_sqm','length_m','official_boundary','geometry_role'];
  const keys=[...preferred.filter(key=>key in properties),...Object.keys(properties).filter(key=>!preferred.includes(key))].slice(0,10);
  return keys.map(key=>[key,compact(properties[key])]).filter(([,value])=>value!=='');
}
function resolveRef(ref,maps){
  const meta=KIND_META[ref.kind];
  let item=maps[ref.kind]?.get(ref.value)||null;
  let result={...ref,type:meta.zh,label:ref.value,summary:'',rows:[],href:'',resolved:Boolean(item)};
  if(ref.kind==='source'&&item){
    result.label=item.title||ref.value;
    result.summary=item.used_for_zh||item.note_zh||'';
    result.rows=[['发布者',item.publisher],['发布日期',item.published_date],['资料等级',item.authority_level],['正式用途',item.usable_for_formal],['使用边界',item.not_usable_for_zh]];
    const raw=item.url||'';
    result.href=safeHttpUrl(raw,location.origin+'/');
  }else if(ref.kind==='metric'&&item){
    result.label=ref.value.replaceAll('_',' ');
    result.summary=item.note_zh||item.formula||'结构化方案指标';
    result.rows=[['数值',`${compact(item.value)} ${compact(item.unit)}`.trim()],['状态',item.status],['置信度',item.confidence],['计算方法',item.formula],['来源文件',compact(item.source_files)]];
    result.href=packageUrl('metrics.json');
  }else if(ref.kind==='standard'&&item){
    result.label=item.requirement_zh||item.professional_dimension||ref.value;
    result.summary=item.evidence_summary_zh||'';
    result.rows=[['依据编号',item.standard_id],['专业维度',item.professional_dimension],['完成状态',item.review_status],['对应章节',compact(item.proposal_sections)],['图层',compact(item.geometry_refs)]];
    result.href=packageUrl('standard_matrix.json');
  }else if(ref.kind==='depth'&&item){
    result.label=item.title_zh||ref.value;
    result.summary=item.evidence_summary_zh||'';
    result.rows=[['专业维度',item.professional_dimension],['完成状态',item.status],['对应章节',compact(item.proposal_sections)],['图纸',compact(item.drawing_refs)],['空间数据',compact(item.geometry_refs)]];
    result.href=packageUrl('design_depth_matrix.json');
  }else if(ref.kind==='data'){
    const [path,id='']=ref.value.split('#');
    const data=state.data.get(path);
    const feature=findFeature(data,id);
    if(feature){
      const props=feature.properties||{};
      result.resolved=true;
      result.label=props.name_zh||props.name||props.title_zh||props.title||id||path;
      result.summary=`${feature.geometry?.type||'GeoJSON'} · ${path}`;
      result.rows=[['要素编号',id],['几何类型',feature.geometry?.type],...summarizeProperties(props)];
    }else if(data&&!id){
      result.resolved=true;
      result.label=path;
      result.summary=`GeoJSON · ${asArray(data.features).length} 个空间要素`;
      result.rows=[['文件',path],['要素数量',asArray(data.features).length]];
    }
    result.href=packageUrl(path);
  }
  if(!result.resolved){
    result.summary=ref.value.includes('...')?'这是正文中的格式示例，不对应具体数据':'正文包含该引用，但方案包中没有找到同名结构化条目';
    result.rows=[['原始引用',`${ref.kind}:${ref.value}`],['状态','未解析；保留供复核']];
  }
  result.rows=result.rows.filter(([,value])=>value!==undefined&&value!==null&&String(value)!=='');
  return result;
}
function renderStatus(refs){
  const counts=Object.fromEntries(Object.keys(KIND_META).map(kind=>[kind,refs.filter(ref=>ref.kind===kind).length]));
  const resolved=refs.filter(ref=>ref.resolved).length;
  return `<div class="report-status">
    <div class="status-cell"><span class="status-value">${resolved}/${refs.length}</span><span class="status-label">已解析证据</span></div>
    <div class="status-cell"><span class="status-value">${counts.source}</span><span class="status-label">资料来源</span></div>
    <div class="status-cell"><span class="status-value">${counts.metric}</span><span class="status-label">方案指标</span></div>
    <div class="status-cell"><span class="status-value">${counts.data}</span><span class="status-label">空间要素</span></div>
    <div class="status-cell"><span class="status-value">${counts.standard+counts.depth}</span><span class="status-label">专业依据</span></div>
  </div>`;
}
function renderFilters(){
  const kinds=['all',...Object.keys(KIND_META)];
  $('#filters').innerHTML=kinds.map(kind=>{
    const count=kind==='all'?state.refs.length:state.refs.filter(ref=>ref.kind===kind).length;
    const label=kind==='all'?'全部':KIND_META[kind].zh;
    return `<button class="filter ${state.filter===kind?'active':''}" data-filter="${kind}" type="button">${label} ${count}</button>`;
  }).join('');
  $('#filters').querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{state.filter=button.dataset.filter;renderFilters();renderList()}));
}
function renderList(){
  const refs=state.filter==='all'?state.refs:state.refs.filter(ref=>ref.kind===state.filter);
  $('#evidenceList').innerHTML=refs.map(ref=>`<button class="evidence-item ${state.selected===ref.key?'active':''}" data-key="${escapeHTML(ref.key)}" type="button">
    <span class="evidence-n">${ref.number}</span><span><span class="evidence-name">${escapeHTML(ref.label)}</span><span class="evidence-meta">${KIND_META[ref.kind].en} · ${ref.resolved?'resolved':'unresolved'}</span></span>
  </button>`).join('');
  $('#evidenceList').querySelectorAll('.evidence-item').forEach(button=>button.addEventListener('click',()=>selectRef(button.dataset.key,true,true)));
}
function selectRef(key,scrollToText=false,openPanel=false){
  const ref=state.refs.find(item=>item.key===key);if(!ref)return;
  state.selected=key;
  document.querySelectorAll('.evidence-ref').forEach(node=>node.classList.toggle('active',node.dataset.key===key));
  const rows=ref.rows.map(([key,value])=>`<div class="detail-row"><span class="detail-key">${escapeHTML(key)}</span><span class="detail-value">${escapeHTML(value)}</span></div>`).join('');
  $('#detail').innerHTML=`<span class="detail-type">${KIND_META[ref.kind].zh} · ${ref.resolved?'已载入':'未解析'}</span><h3>${escapeHTML(ref.label)}</h3><div class="detail-summary">${escapeHTML(ref.summary)}</div><div class="detail-grid">${rows}</div>${ref.href?`<a class="detail-link" href="${escapeHTML(ref.href)}" target="_blank" rel="noopener">打开原始数据 ↗</a>`:''}`;
  renderList();
  if(openPanel)$('#panel').classList.add('open');
  if(scrollToText){document.querySelector(`.evidence-ref[data-key="${CSS.escape(key)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})}
}
function normalizeEvidenceMarkers(report){
  const walker=document.createTreeWalker(report,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(node.parentElement?.closest('.evidence,code,pre,script,style'))continue;
    if(/\[(source|standard|depth|data|metric):[^\]\s]+\]/.test(node.nodeValue||''))nodes.push(node);
  }
  nodes.forEach(node=>{
    const text=node.nodeValue||'';
    const pattern=/\[(source|standard|depth|data|metric):[^\]\s]+\]/g;
    const fragment=document.createDocumentFragment();
    let cursor=0;
    for(const match of text.matchAll(pattern)){
      fragment.append(text.slice(cursor,match.index));
      const marker=document.createElement('span');
      marker.className='evidence';
      marker.textContent=match[0];
      fragment.append(marker);
      cursor=match.index+match[0].length;
    }
    fragment.append(text.slice(cursor));
    node.replaceWith(fragment);
  });
}
function attachEvidence(report,maps){
  const unique=new Map();
  report.querySelectorAll('.evidence').forEach(node=>{
    const match=node.textContent.trim().match(/^\[(source|standard|depth|data|metric):([^\]\s]+)\]$/);
    if(!match)return;
    const key=`${match[1]}:${match[2]}`;
    if(!unique.has(key))unique.set(key,{key,kind:match[1],value:match[2],nodes:[]});
    unique.get(key).nodes.push(node);
  });
  state.refs=[...unique.values()].map((ref,index)=>resolveRef({...ref,number:index+1},maps));
  state.refs.forEach(ref=>ref.nodes.forEach(node=>{
    const button=document.createElement('button');
    button.type='button';button.className=`evidence-ref ${ref.resolved?'':'unresolved'}`;
    button.dataset.key=ref.key;button.textContent=ref.number;button.title=`${KIND_META[ref.kind].zh}：${ref.label}`;
    node.replaceWith(button);
  }));
}
async function load(){
  const path=new URLSearchParams(location.search).get('proposal');
  if(!validPackagePath(path))throw new Error('方案地址无效或缺失');
  state.packagePath=path;
  const reportUrl=new URL(packageUrl('report/proposal.html'),location.href);
  const [reportText,sources,metrics,standards,depth]=await Promise.all([
    fetchText(reportUrl.href),fetchJSON(packageUrl('sources.json')),fetchJSON(packageUrl('metrics.json')),
    fetchJSON(packageUrl('standard_matrix.json')),fetchJSON(packageUrl('design_depth_matrix.json'))
  ]);
  const parsed=new DOMParser().parseFromString(reportText,'text/html');
  const imported=(parsed.querySelector('main')||parsed.body).cloneNode(true);
  sanitizeReport(imported,reportUrl);
  normalizeEvidenceMarkers(imported);
  await resolveDataRefs([...imported.querySelectorAll('.evidence')].map(node=>{
    const match=node.textContent.trim().match(/^\[(source|standard|depth|data|metric):([^\]\s]+)\]$/);
    return match?{kind:match[1],value:match[2]}:null;
  }).filter(Boolean));
  const maps=buildMaps({sources,metrics,standards,depth});
  attachEvidence(imported,maps);
  const title=parsed.querySelector('.hero h1,h1')?.textContent?.trim()||path.split('/').pop();
  document.title=`${title} — 方案正文`;
  $('#topTitle').textContent=title;
  $('#sourceLink').href=packageUrl('proposal.md');
  $('#a3Link').href=packageUrl('drawings/a3-booklet.pdf');
  $('#visualLink').href=packageUrl('visual/index.html');
  $('#visualLink').target='_blank';$('#visualLink').rel='noopener';
  $('#report').innerHTML=renderStatus(state.refs)+imported.innerHTML;
  $('#report').querySelectorAll('.evidence-ref').forEach(button=>{
    button.addEventListener('click',()=>selectRef(button.dataset.key,false,true));
  });
  $('#coverage').textContent=`${state.refs.filter(ref=>ref.resolved).length} / ${state.refs.length}`;
  $('#mobileCount').textContent=state.refs.length;
  renderFilters();renderList();
  if(state.refs.length)selectRef(state.refs.find(ref=>ref.resolved)?.key||state.refs[0].key);
}
$('#evidenceToggle').addEventListener('click',()=>$('#panel').classList.toggle('open'));
window.addEventListener('scroll',()=>{
  const max=document.documentElement.scrollHeight-innerHeight;
  $('#progress').style.width=`${max>0?Math.min(100,scrollY/max*100):0}%`;
},{passive:true});
load().catch(error=>{
  $('#report').innerHTML=`<div class="error"><strong>方案没有完整载入</strong><p>${escapeHTML(error.message)}</p><p>请返回方案展示页重新打开，或在 GitHub 查看原始方案包。</p></div>`;
  console.error(error);
});
</script>
