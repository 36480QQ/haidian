*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"NotoSansCJKsc",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB",Arial,sans-serif;letter-spacing:0}body{overflow-x:hidden}header{min-height:92px;padding:22px clamp(18px,4vw,64px) 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:24px;background:var(--paper)}h1{font-size:clamp(20px,2.6vw,36px);line-height:1.05;margin:0 0 8px;font-weight:760;letter-spacing:0}header p{margin:0;color:var(--muted);font-size:14px;max-width:680px;line-height:1.5}.status{align-self:flex-start;color:var(--coral);font-size:12px;font-weight:700;border-left:4px solid var(--coral);padding-left:10px;max-width:260px;line-height:1.45}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);min-height:calc(100vh - 92px)}.stage{position:relative;min-height:620px;background:#e9efea;border-right:1px solid var(--line)}canvas{width:100%;height:100%;min-height:620px;display:block;outline:none}.fallback{position:absolute;inset:16px;display:none;object-fit:contain;max-width:calc(100% - 32px);max-height:calc(100% - 32px);margin:auto;background:#eef2ef;border:1px solid var(--line)}.fallback.show{display:block}.panel{padding:24px 24px 28px;background:var(--panel);display:flex;flex-direction:column;gap:18px}.modebar{display:flex;gap:8px;flex-wrap:wrap}.coverage{border-top:3px solid var(--green);padding-top:12px}.coverage-title{font-size:13px;font-weight:760;margin-bottom:8px}.coverage-line{font-size:11px;line-height:1.55;color:var(--muted)}.coverage-metrics{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}.coverage-metrics span{display:block;padding:6px;background:#f0f5f1;color:var(--ink);font-size:10px;line-height:1.2}button,a.button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:hover,a.button:hover{border-color:var(--ink)}button:focus-visible,a.button:focus-visible{outline:3px solid #9ed4d8;outline-offset:2px}button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.metric-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:12px;border-top:3px solid var(--green);background:#f0f5f1;min-height:76px}.metric:nth-child(2n){border-color:var(--cyan);background:#eef6f7}.metric strong{display:block;font-size:17px;line-height:1.15}.metric span{display:block;color:var(--muted);font-size:12px;margin-top:5px;line-height:1.3}.node-title{font-size:18px;font-weight:700;min-height:24px}.node-copy{font-size:13px;line-height:1.65;color:var(--muted);min-height:110px}.note{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px;line-height:1.6}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}.kbd{font-size:11px;color:var(--muted)}@media (max-width:900px){header{display:block}.status{margin-top:12px}main{display:block}.stage{min-height:58vh;border-right:0;border-bottom:1px solid var(--line)}canvas{min-height:58vh}.panel{padding:18px}}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
const payload=JSON.parse(document.getElementById('payload').textContent), labels=JSON.parse(document.getElementById('labels').textContent); const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'); const fallback=document.getElementById('fallback'); let mode='structure', selected=-1, t=0, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

(h-52,q[1]+78));ctx.textAlign='start'})} if(!reduced){t+=.02;for(let i=0;i<10;i++){const p=publics[(Math.floor(t*2)+i)%publics.length].geometry.coordinates[0][0];const q=xy(p,w,h);ctx.fillStyle='rgba(219,101,85,.38)';ctx.beginPath();ctx.arc(q[0]+Math.sin(t+i)*12,q[1]-Math.cos(t+i)*8,2.5,0,Math.PI*2);ctx.fill()}} requestAnimationFrame(render)}
