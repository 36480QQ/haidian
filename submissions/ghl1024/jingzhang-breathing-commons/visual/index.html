<script>
const payload=JSON.parse(document.getElementById('payload').textContent), labels=JSON.parse(document.getElementById('labels').textContent); const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'); const fallback=document.getElementById('fallback'); let mode='structure', selected=-1, t=0, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const site=payload.geometry['site_boundary.geojson'].features[0], keys=payload.geometry['key_areas.geojson'].features, roads=payload.geometry['roads.geojson'].features, greens=payload.geometry['green_space.geojson'].features, publics=payload.geometry['public_space.geojson'].features, phases=payload.geometry['phasing.geojson'].features; const all=[]; function collect(g){if(!g)return;if(g.type==='Point')all.push(g.coordinates);else if(g.coordinates){if(g.type==='LineString'||g.type==='MultiPoint')g.coordinates.forEach(p=>all.push(p));else g.coordinates.flat(Infinity).forEach((v,i,a)=>{if(i%2===0&&typeof v==='number'&&typeof a[i+1]==='number')all.push([v,a[i+1]])})}} collect(site.geometry); keys.forEach(f=>collect(f.geometry)); const b=[Math.min(...all.map(p=>p[0])),Math.min(...all.map(p=>p[1])),Math.max(...all.map(p=>p[0])),Math.max(...all.map(p=>p[1]))], rb=[b[1],-b[2],b[3],-b[0]];
function fit(){const d=devicePixelRatio||1, r=canvas.getBoundingClientRect();canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);return [r.width,r.height]} function xy(p,w,h){const pad=44,rx=p[1],ry=-p[0],s=Math.min((w-pad*2)/(rb[2]-rb[0]),(h-pad*2)/(rb[3]-rb[1]));return [pad+(rx-rb[0])*s+(w-pad*2-(rb[2]-rb[0])*s)/2,h-pad-(ry-rb[1])*s-(h-pad*2-(rb[3]-rb[1])*s)/2]} function path(g,w,h){ctx.beginPath();const ring=(c)=>{c.forEach((p,i)=>{const q=xy(p,w,h);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath()};if(g.type==='Polygon')ring(g.coordinates[0]);else if(g.type==='MultiPolygon')g.coordinates.forEach(p=>ring(p[0]));else if(g.type==='LineString')g.coordinates.forEach((p,i)=>{const q=xy(p,w,h);i?ctx.lineTo(...q):ctx.moveTo(...q)});else if(g.type==='MultiLineString')g.coordinates.forEach(l=>l.forEach((p,i)=>{const q=xy(p,w,h);i?ctx.lineTo(...q):ctx.moveTo(...q)}));}
function drawFeature(f,w,h,fill,stroke,lw=1){path(f.geometry,w,h);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}} function render(){const [w,h]=fit();ctx.fillStyle='#e9efea';ctx.fillRect(0,0,w,h);ctx.fillStyle='#f7f8f5';ctx.fillRect(18,18,w-36,h-36);drawFeature(site,w,h,'#e3ebe5','#61706c',2); keys.forEach((f,i)=>drawFeature(f,w,h,['#f2c1b8','#f3dfab','#b9dfe3'][i], '#182321',1.5)); greens.forEach(f=>drawFeature(f,w,h,'rgba(31,122,97,.18)','#1f7a61',1.3)); if(mode!=='governance') roads.forEach(f=>drawFeature(f,w,h,null,f.id==='ROAD-BREATH-001'?'#1f7a61':f.id==='ROAD-FALLBACK-001'?'#db6555':'#182321',f.id==='ROAD-BREATH-001'?6:2)); if(mode==='scenarios'||mode==='governance'||mode==='acceptance') publics.forEach((f,i)=>{const c=f.geometry.type==='Polygon'?f.geometry.coordinates[0][0]:null;if(!c)return;const q=xy(c,w,h);ctx.fillStyle=i===selected?'#182321':'#2b8c9e';ctx.beginPath();ctx.arc(q[0],q[1],i===selected?9:5,0,Math.PI*2);ctx.fill()}); if(mode==='governance') phases.forEach((f,i)=>drawFeature(f,w,h,null,['#db6555','#e6b84d','#2b8c9e'][i],2)); if(w>700){ctx.font='600 13px system-ui';ctx.fillStyle='#61706c';ctx.fillText(labels.axis,48,54);const gap=14,bw=(w-96-gap*2)/3;labels.protocol.forEach((item,i)=>{const x=48+i*(bw+gap),y=78;ctx.fillStyle=['#e5f0e9','#f3dfab','#f2c1b8'][i];ctx.beginPath();ctx.roundRect(x,y,bw,76,5);ctx.fill();ctx.fillStyle=['#1f7a61','#9a6d00','#b64c3d'][i];ctx.fillRect(x,y,8,76);ctx.fillStyle='#182321';ctx.font='700 13px system-ui';ctx.fillText(item[0],x+22,y+26);ctx.fillStyle='#61706c';ctx.font='12px system-ui';ctx.fillText(item[1],x+22,y+51)});keys.forEach((f,i)=>{const ring=f.geometry.coordinates[0],cx=ring.reduce((s,p)=>s+p[0],0)/ring.length,cy=ring.reduce((s,p)=>s+p[1],0)/ring.length,q=xy([cx,cy],w,h);ctx.fillStyle='#182321';ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.fillText(labels.keyNames[i],q[0],Math.min(h-52,q[1]+78));ctx.textAlign='start'})} if(!reduced){t+=.02 function updatePanel(){const m=payload.metrics;const metricKeys=['site_area_sqm','land_use_zone_count','concept_building_count','green_ratio','public_space_ratio','breathing_spine_length_m','scenario_card_count','human_fallback_route_count']; document.getElementById('metrics').innerHTML=metricKeys.map(k=>{const x=m[k],v=x.status==='unknown'?'unknown':x.unit==='ratio'?(x.value*100).toFixed(1)+'%':x.unit==='sqm'?Math.round(x.value).toLocaleString()+' sqm':x.unit==='m'?Math.round(x.value).toLocaleString()+' m':x.value;return `<div class="metric"><strong>${v}</strong><span>${labels.metricLabels[k]}</span></div>`}).join(''); if(mode==='acceptance'){document.getElementById('node-title').textContent='六道公共价值验收门 / 尚未执行';document.getElementById('node-copy').textContent=payload.review.gates.map(g=>g.gate_id+' · '+g['name_zh']).join('  /  ')}else if(selected>=0){const s=publics[selected].properties,owner=s['review_owner_zh']||s.review_owner||s.human_review;document.getElementById('node-title').textContent=s['name_zh'];document.getElementById('node-copy').textContent=(mode==='governance'?('人工接管路径始终可用。 '+owner):s['name_zh']+' · '+s.scenario_category+' · '+owner)}else{document.getElementById('node-title').textContent='选择一个节点';document.getElementById('node-copy').textContent='几何为临时粗略范围；不代表官方红线或精确面积。'}}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;updatePanel()})); canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=9999,idx=-1;publics.forEach((f,i)=>{const p=f.geometry.coordinates[0][0],q=xy(p,r.width,r.height),d=Math.hypot(q[0]-x,q[1]-y);if(d<best){best=d;idx=i}});if(best<22){selected=idx;updatePanel()}});window.addEventListener('resize',fit);updatePanel();render();
