<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="twlTitle twlDesc">
  <title id="twlTitle">京张对开 THE TWO-WAY LINE</title>
  <desc id="twlDesc">双箭同轨：两条平行轨线，上端北向箭头、下端南向箭头，中部以两道轨枕横杠连接；轨线与横杠围出的负空间隐含「开」字骨架。绿电绿代表上行的绿电与算力，隧道深蓝代表清华园隧道暗线，站房砖红代表百年站房与轨枕。</desc>

  <!-- 轨枕横杠（站房砖红），画在轨线之下，露出三段红色 -->
  <g fill="#A34432">
    <rect x="52" y="84" width="136" height="14" rx="2"/>
    <rect x="52" y="118" width="136" height="14" rx="2"/>
  </g>

  <!-- 上行轨线：绿电与算力进京（绿电绿），上端北向箭头 -->
  <path fill="#1E8E52" d="M92 14 L116 46 L100 46 L100 200 L84 200 L84 46 L68 46 Z"/>

  <!-- 下行轨线：模型、人才与场景出塞（隧道深蓝），下端南向箭头 -->
  <path fill="#163C5B" d="M148 226 L124 194 L140 194 L140 40 L156 40 L156 194 L172 194 Z"/>
</svg>
