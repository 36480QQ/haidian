<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Human continuity and maintenance receipt</title>
  <desc id="desc">An offline conceptual receipt for four operating states, six handoff seams, three key areas, seven maintenance roles, and twelve review windows.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#315a86"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102a43}.subtitle{font:400 17px Arial,sans-serif;fill:#526579}.stage{font:700 20px Arial,sans-serif;fill:#102a43}.small{font:400 16px Arial,sans-serif;fill:#334e68}.tiny{font:400 13px Arial,sans-serif;fill:#627d98}.label{font:700 14px Arial,sans-serif;fill:#fff;letter-spacing:1px}.card{fill:#fff;stroke:#d9e2ec;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fa"/><rect width="1600" height="116" fill="#eaf2f8"/>
  <text x="64" y="56" class="title">Human continuity and maintenance receipt</text>
  <text x="64" y="88" class="subtitle">Ordinary routes come first. AI stays reversible. Public service and responsibility survive shutdown.</text>
  <rect x="1260" y="32" width="270" height="52" rx="26" fill="#173f5f"/><text x="1395" y="65" text-anchor="middle" class="label">G0 · HOLD · NOT RUN</text>
  <text x="64" y="158" class="stage">Four states for a reviewer to replay</text>
  <rect x="60" y="180" width="330" height="248" rx="16" class="card"/><rect x="60" y="180" width="330" height="48" rx="16" fill="#2f80ed"/><text x="84" y="211" class="label">BASE · ORDINARY ROUTE</text><text x="84" y="263" class="stage">Give the task to people first</text><text x="84" y="294" class="small">Staffed entry / screen-free alternative / exit log</text><text x="84" y="334" class="tiny">Entry gate</text><text x="84" y="360" class="small">Ordinary service and choice are visible</text><text x="84" y="397" class="tiny">Retained assets</text><text x="84" y="418" class="small">Access · service · redress</text>
  <rect x="440" y="180" width="330" height="248" rx="16" class="card"/><rect x="440" y="180" width="330" height="48" rx="16" fill="#27ae60"/><text x="464" y="211" class="label">BOOST · OPTIONAL GAIN</text><text x="464" y="263" class="stage">AI supplies a bounded prompt</text><text x="464" y="294" class="small">Purpose bound / human review / reversible</text><text x="464" y="334" class="tiny">Entry gate</text><text x="464" y="360" class="small">The ordinary route remains open</text><text x="464" y="397" class="tiny">Retained assets</text><text x="464" y="418" class="small">Paper rule · version card · human option</text>
  <rect x="820" y="180" width="330" height="248" rx="16" class="card"/><rect x="820" y="180" width="330" height="48" rx="16" fill="#f2994a"/><text x="844" y="211" class="label">BLACKOUT · STOP</text><text x="844" y="263" class="stage">Return to a human handoff</text><text x="844" y="294" class="small">Takeover / safe retreat / incident log</text><text x="844" y="334" class="tiny">Trigger</text><text x="844" y="360" class="small">Role, rights, or night safety is unclear</text><text x="844" y="397" class="tiny">Retained assets</text><text x="844" y="418" class="small">Staffed service · exit · redress record</text>
  <rect x="1200" y="180" width="330" height="248" rx="16" class="card"/><rect x="1200" y="180" width="330" height="48" rx="16" fill="#9b51e0"/><text x="1224" y="211" class="label">BEQUEST · RETAIN</text><text x="1224" y="263" class="stage">The public asset keeps working</text><text x="1224" y="294" class="small">Handoff / release note / independent replay</text><text x="1224" y="334" class="tiny">Decision gate</text><text x="1224" y="360" class="small">Access, exit, and records remain usable</text><text x="1224" y="397" class="tiny">Next move</text><text x="1224" y="418" class="small">Repair · extend · withdraw</text>
  <path d="M390 304 H432" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/><path d="M770 304 H812" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/><path d="M1150 304 H1192" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/><path d="M1365 438 C1365 478 225 478 225 438" fill="none" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="800" y="495" text-anchor="middle" class="tiny">Maintenance handoff returns BEQUEST to BASE. The digital layer cannot be the only service entrance.</text>
  <text x="64" y="550" class="stage">Three key areas, one continuity receipt</text>
  <rect x="60" y="570" width="480" height="112" rx="12" class="card"/><text x="84" y="602" class="stage">Zhongzhiyuan</text><text x="84" y="632" class="small">Problem station · human explanation · consent and withdrawal</text><text x="84" y="659" class="tiny">PUBLIC-01 · SCN-06</text>
  <rect x="560" y="570" width="480" height="112" rx="12" class="card"/><text x="584" y="602" class="stage">AI Origin Community</text><text x="584" y="632" class="small">Paper advice · intergenerational learning · night handoff</text><text x="584" y="659" class="tiny">PUBLIC-02 · PUBLIC-03 · SCN-04</text>
  <rect x="1060" y="570" width="470" height="112" rx="12" class="card"/><text x="1084" y="602" class="stage">Dazhongsi</text><text x="1084" y="632" class="small">Cultural explanation · ordinary passage · version review</text><text x="1084" y="659" class="tiny">PUBLIC-05 · SCN-05</text>
  <rect x="60" y="720" width="710" height="180" rx="14" fill="#102a43"/><text x="86" y="754" class="label">7 MAINTENANCE ROLES</text><text x="86" y="790" class="small" fill="#d9e2ec">Public-service desk · accessibility and fairness review · data and consent owner</text><text x="86" y="820" class="small" fill="#d9e2ec">Night safety and incident handoff · space and facility maintenance</text><text x="86" y="850" class="small" fill="#d9e2ec">Culture and rights review · independent public replay</text><text x="86" y="880" class="tiny" fill="#9fb3c8">Roles are proposed responsibility interfaces, not confirmed institutions or operating commitments.</text>
  <rect x="800" y="720" width="730" height="180" rx="14" fill="#fff" stroke="#d9e2ec" stroke-width="2"/><text x="826" y="754" class="stage">W01 → W12 conceptual review windows</text><text x="826" y="790" class="small">Sources and entry · paper replay · screen-free check · consent review · AI boundary · stop replay</text><text x="826" y="820" class="small">Maintenance handoff · appeal and exit · spatial replay · public replay · withdrawal note · stage decision</text><text x="826" y="860" class="tiny">Every window is a design target. Without authorization, field data, or professional sign-off, the result stays at G0.</text>
  <rect x="60" y="934" width="1470" height="36" rx="18" fill="#eaf2f8"/><text x="795" y="958" text-anchor="middle" class="tiny">Concept contract · 0 authorizations · 0 field observations · baseline unknown · performance not_run · provisional boundary · not an official score</text>
</svg>
