<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Figure 09 | Five project families: G0/G1 gates and exit actions</title>
<desc id="desc">Project families express responsibility, evidence and exit order only; no institution, budget, permit, procurement or implementation commitment The board is generated from local JSON contracts; it is not field performance, authorization, or an official score.</desc>
<rect width="1600" height="1000" fill="#f5f7fb"/>
<rect x="0" y="0" width="1600" height="124" rx="0" fill="#152442" stroke="none" stroke-width="2"/>
<text x="64" y="61" fill="#ffffff" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Figure 09 | Five project families: G0/G1 gates and exit actions</tspan></text>
<text x="66" y="99" fill="#c8d5ec" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="66" dy="0">Project families express responsibility, evidence and exit order only; no institution, budget, permit, procurement or implementation commitment</tspan></text>
<rect x="60" y="150" width="1480" height="62" rx="10" fill="#eaf2ff" stroke="#c9d8ed" stroke-width="2"/>
<text x="84" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="84" dy="0">Project family</tspan></text>
<text x="444" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="444" dy="0">G0 / G1 gate</tspan></text>
<text x="794" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="794" dy="0">Acceptance focus</tspan></text>
<text x="1134" y="188" fill="#172033" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="1134" dy="0">Exit action</tspan></text>
<rect x="60" y="224" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="254" fill="#172033" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-01 Human buffer and</tspan><tspan x="84" dy="26">community retention</tspan></text>
<text x="444" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="444" dy="0">G0: publish rules and</tspan><tspan x="444" dy="21">co-create samples; G1:</tspan><tspan x="444" dy="21">professional review</tspan></text>
<text x="794" y="254" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Human service access,</tspan><tspan x="794" dy="21">exit protocol,</tspan><tspan x="794" dy="21">community seat</tspan></text>
<text x="1134" y="254" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1134" dy="0">Pause and publicly revise</tspan><tspan x="1134" dy="21">on complaint or</tspan><tspan x="1134" dy="21">inequality risk</tspan></text>
<rect x="60" y="340" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="370" fill="#172033" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-02 Reskilling and night</tspan><tspan x="84" dy="26">wellbeing</tspan></text>
<text x="444" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="444" dy="0">G0: navigation</tspan><tspan x="444" dy="21">prototype; G1:</tspan><tspan x="444" dy="21">accessibility and</tspan><tspan x="444" dy="21">night-safety review</tspan></text>
<text x="794" y="370" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Human consultation,</tspan><tspan x="794" dy="21">explainable path,</tspan><tspan x="794" dy="21">night feedback</tspan></text>
<text x="1134" y="370" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1134" dy="0">Exit if no human fallback</tspan><tspan x="1134" dy="21">or risk cannot be</tspan><tspan x="1134" dy="21">explained</tspan></text>
<rect x="60" y="456" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="486" fill="#172033" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-03 City API and data</tspan><tspan x="84" dy="26">governance</tspan></text>
<text x="444" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="444" dy="0">G0: paper protocol;</tspan><tspan x="444" dy="21">G1: authorization and</tspan><tspan x="444" dy="21">safety review</tspan></text>
<text x="794" y="486" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Purpose limitation,</tspan><tspan x="794" dy="21">revoke button, audit</tspan><tspan x="794" dy="21">log</tspan></text>
<text x="1134" y="486" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1134" dy="0">Freeze on authorization</tspan><tspan x="1134" dy="21">lapse or bias complaint</tspan></text>
<rect x="60" y="572" width="1480" height="98" rx="10" fill="#ffffff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="602" fill="#172033" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-04 Xiaoyue River</tspan><tspan x="84" dy="26">blue-green and</tspan><tspan x="84" dy="26">human-machine test</tspan></text>
<text x="444" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="444" dy="0">G0: map rule; G1:</tspan><tspan x="444" dy="21">special safety review</tspan></text>
<text x="794" y="602" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="794" dy="0">People first, stop</tspan><tspan x="794" dy="21">control, incident</tspan><tspan x="794" dy="21">record, ecological</tspan><tspan x="794" dy="21">boundary</tspan></text>
<text x="1134" y="602" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1134" dy="0">Do not enter field work</tspan><tspan x="1134" dy="21">without permit, safety</tspan><tspan x="1134" dy="21">threshold, hydrology data</tspan></text>
<rect x="60" y="688" width="1480" height="98" rx="10" fill="#f8fbff" stroke="#d0d9e8" stroke-width="2"/>
<text x="84" y="718" fill="#172033" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start"><tspan x="84" dy="0">PF-05 Culture, landmarks</tspan><tspan x="84" dy="26">and global co-creation loop</tspan></text>
<text x="444" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="444" dy="0">G0: narrative and</tspan><tspan x="444" dy="21">event prototype; G1:</tspan><tspan x="444" dy="21">rights and venue</tspan><tspan x="444" dy="21">review</tspan></text>
<text x="794" y="718" fill="#36506f" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="794" dy="0">Traceable sources,</tspan><tspan x="794" dy="21">cultural review,</tspan><tspan x="794" dy="21">post-event release</tspan><tspan x="794" dy="21">note</tspan></text>
<text x="1134" y="718" fill="#7f3f32" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="1134" dy="0">Withdraw or revise if</tspan><tspan x="1134" dy="21">source unproven or</tspan><tspan x="1134" dy="21">misleading risk appears</tspan></text>
<rect x="60" y="850" width="1480" height="78" rx="10" fill="#fff6dc" stroke="#e4a735" stroke-width="2"/>
<text x="82" y="884" fill="#6a4b00" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="82" dy="0">Public-service order: publish the problem and human route first, then authorize and review professionally; any missing</tspan><tspan x="82" dy="27">responsibility, evidence, rights or safety gate keeps G0, freezes or exits.</tspan></text>
</svg>
