<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">人本连续性与维护回执</title>
  <desc id="desc">四个运行状态、六个交接缝、三个重点区、七个维护角色和十二个概念复核窗口的离线概念回执。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#315a86"/></marker>
    <style>
      .title{font:700 34px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#102a43}
      .subtitle{font:400 17px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#526579}
      .stage{font:700 20px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#102a43}
      .small{font:400 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#334e68}
      .tiny{font:400 13px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#627d98}
      .label{font:700 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff;letter-spacing:1px}
      .card{fill:#fff;stroke:#d9e2ec;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f5f7fa"/>
  <rect x="0" y="0" width="1600" height="116" fill="#eaf2f8"/>
  <text x="64" y="56" class="title">人本连续性与维护回执</text>
  <text x="64" y="88" class="subtitle">普通路径先行，AI 可撤回，停用后保留公共服务与责任记录</text>
  <rect x="1260" y="32" width="270" height="52" rx="26" fill="#173f5f"/>
  <text x="1395" y="65" text-anchor="middle" class="label">G0 · HOLD · NOT RUN</text>

  <text x="64" y="158" class="stage">四个状态，评审沿箭头回读</text>
  <rect x="60" y="180" width="330" height="248" rx="16" class="card"/>
  <rect x="60" y="180" width="330" height="48" rx="16" fill="#2f80ed"/>
  <text x="84" y="211" class="label">BASE · 普通路径</text>
  <text x="84" y="263" class="stage">先把任务交给人</text>
  <text x="84" y="294" class="small">人工入口 / 无屏替代 / 退出登记</text>
  <text x="84" y="334" class="tiny">进入条件</text>
  <text x="84" y="360" class="small">普通服务可用，选择状态可见</text>
  <text x="84" y="397" class="tiny">保留资产</text>
  <text x="84" y="418" class="small">通行 · 服务 · 申诉</text>

  <rect x="440" y="180" width="330" height="248" rx="16" class="card"/>
  <rect x="440" y="180" width="330" height="48" rx="16" fill="#27ae60"/>
  <text x="464" y="211" class="label">BOOST · 可选增益</text>
  <text x="464" y="263" class="stage">AI 只做有限提示</text>
  <text x="464" y="294" class="small">目的限定 / 人工复核 / 可撤回</text>
  <text x="464" y="334" class="tiny">进入条件</text>
  <text x="464" y="360" class="small">普通路线仍然可用</text>
  <text x="464" y="397" class="tiny">保留资产</text>
  <text x="464" y="418" class="small">纸面规则 · 版本牌 · 人工选项</text>

  <rect x="820" y="180" width="330" height="248" rx="16" class="card"/>
  <rect x="820" y="180" width="330" height="48" rx="16" fill="#f2994a"/>
  <text x="844" y="211" class="label">BLACKOUT · 停用</text>
  <text x="844" y="263" class="stage">触发后回到人工</text>
  <text x="844" y="294" class="small">接管 / 安全退避 / 事件记录</text>
  <text x="844" y="334" class="tiny">触发条件</text>
  <text x="844" y="360" class="small">责任、权利或夜间安全不清</text>
  <text x="844" y="397" class="tiny">保留资产</text>
  <text x="844" y="418" class="small">人工服务 · 退出 · 申诉记录</text>

  <rect x="1200" y="180" width="330" height="248" rx="16" class="card"/>
  <rect x="1200" y="180" width="330" height="48" rx="16" fill="#9b51e0"/>
  <text x="1224" y="211" class="label">BEQUEST · 保留</text>
  <text x="1224" y="263" class="stage">公共资产继续工作</text>
  <text x="1224" y="294" class="small">维护交接 / 版本说明 / 独立复演</text>
  <text x="1224" y="334" class="tiny">决定条件</text>
  <text x="1224" y="360" class="small">普通服务、退出和记录仍可用</text>
  <text x="1224" y="397" class="tiny">下一步</text>
  <text x="1224" y="418" class="small">修订 · 扩展 · 退出</text>

  <path d="M390 304 H432" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M770 304 H812" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1150 304 H1192" stroke="#315a86" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1365 438 C1365 478 225 478 225 438" fill="none" stroke="#9fb3c8" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="800" y="495" text-anchor="middle" class="tiny">维护交接把 BEQUEST 接回 BASE，不能让数字层成为唯一服务入口</text>

  <text x="64" y="550" class="stage">三个重点区，把同一套回执落到不同日常</text>
  <rect x="60" y="570" width="480" height="112" rx="12" class="card"/>
  <text x="84" y="602" class="stage">众智园</text><text x="84" y="632" class="small">问题站 · 人工解释 · 授权与展示撤回</text><text x="84" y="659" class="tiny">PUBLIC-01 · SCN-06</text>
  <rect x="560" y="570" width="480" height="112" rx="12" class="card"/>
  <text x="584" y="602" class="stage">AI 原点社区</text><text x="584" y="632" class="small">纸面咨询 · 代际共学 · 夜间交接</text><text x="584" y="659" class="tiny">PUBLIC-02 · PUBLIC-03 · SCN-04</text>
  <rect x="1060" y="570" width="470" height="112" rx="12" class="card"/>
  <text x="1084" y="602" class="stage">大钟寺</text><text x="1084" y="632" class="small">文化解释 · 普通通行 · 版本审校</text><text x="1084" y="659" class="tiny">PUBLIC-05 · SCN-05</text>

  <rect x="60" y="720" width="710" height="180" rx="14" fill="#102a43"/>
  <text x="86" y="754" class="label">7 个维护角色</text>
  <text x="86" y="790" class="small" fill="#d9e2ec">公共服务前台 · 无障碍与公平复核 · 数据与授权责任人</text>
  <text x="86" y="820" class="small" fill="#d9e2ec">夜间安全与事件交接 · 空间与设施维护</text>
  <text x="86" y="850" class="small" fill="#d9e2ec">文化与权利审校 · 独立公众复演人</text>
  <text x="86" y="880" class="tiny" fill="#9fb3c8">角色是待专业团队确认的责任接口，不是已确认机构或运营承诺</text>

  <rect x="800" y="720" width="730" height="180" rx="14" fill="#fff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="826" y="754" class="stage">W01 → W12 概念复核窗口</text>
  <text x="826" y="790" class="small">来源与入口 · 纸面回放 · 无屏检查 · 授权审阅 · AI 边界 · 停用回放</text>
  <text x="826" y="820" class="small">维护交接 · 申诉退出 · 空间复演 · 公众复演 · 撤回说明 · 阶段决定</text>
  <text x="826" y="860" class="tiny">每一窗口都是 design_target。没有授权、现场数据或专业签字，结果停在 G0。</text>

  <rect x="60" y="934" width="1470" height="36" rx="18" fill="#eaf2f8"/>
  <text x="795" y="958" text-anchor="middle" class="tiny">概念合约 · 0 授权 · 0 现场观察 · baseline unknown · performance not_run · provisional boundary · 不代表官方评分</text>
</svg>
