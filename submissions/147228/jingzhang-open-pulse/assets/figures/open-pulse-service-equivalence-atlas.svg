<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>京张开源脉冲 普通服务与 AI 增益等价回执</title>
  <desc>三处重点区的普通服务路径、AI 可选增益、停止条件和恢复回执</desc>
  <style>
    .bg{fill:#101820}.panel{fill:#182630;stroke:#38505b;stroke-width:2}.panel2{fill:#132129;stroke:#2e4650;stroke-width:2}.white{fill:#eef5f2}.muted{fill:#a9bebc}.cyan{fill:#6be2d3}.amber{fill:#f4c56b}.red{fill:#ff8775}.blue{fill:#7bb5ff}.line{stroke:#6be2d3;stroke-width:5;fill:none}.thin{stroke:#46616a;stroke-width:2;fill:none}.t1{font:700 36px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.t2{font:700 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.t3{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.small{font:500 15px -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif}.id{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text x="80" y="82" class="t1 white">京张开源脉冲</text>
  <text x="80" y="126" class="t2 cyan">普通服务与 AI 增益等价回执</text>
  <text x="80" y="158" class="t3 muted">三处重点区共用五步回执。先读普通路径，再读可选增益，失败时回到日常服务。</text>
  <rect x="1050" y="55" width="110" height="42" rx="21" fill="#294c57"/><text x="1084" y="83" class="t3 cyan">G0</text>
  <rect x="1175" y="55" width="120" height="42" rx="21" fill="#5b3f2f"/><text x="1202" y="83" class="t3 amber">HOLD</text>
  <rect x="1310" y="55" width="120" height="42" rx="21" fill="#294c57"/><text x="1330" y="83" class="small cyan">0 授权</text>
  <rect x="1445" y="55" width="100" height="42" rx="21" fill="#294c57"/><text x="1470" y="83" class="small cyan">0 现场</text>

  <text x="80" y="210" class="id cyan">ROUTE CARDS</text>
  <rect x="80" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="112" y="278" class="id amber">R-01 · NODE-01</text>
  <text x="112" y="314" class="t2 white">众智园可信研发花园</text>
  <text x="112" y="347" class="small muted">S02 低速配送机器人验证</text>
  <text x="112" y="386" class="t3 cyan">普通路径</text>
  <text x="112" y="416" class="small white">普通步行、纸面导视、人工配送</text>
  <text x="112" y="455" class="t3 blue">可选增益</text>
  <text x="112" y="485" class="small white">封闭或低速窗口内辅助配送</text>
  <text x="112" y="522" class="small red">急停或接管失败时退出窗口</text>

  <rect x="570" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="602" y="278" class="id amber">R-02 · NODE-02</text>
  <text x="602" y="314" class="t2 white">AI 原点开源转化街区</text>
  <text x="602" y="347" class="small muted">S08 企业服务协同柜台</text>
  <text x="602" y="386" class="t3 cyan">普通路径</text>
  <text x="602" y="416" class="small white">人工柜台、纸面材料、公开规则</text>
  <text x="602" y="455" class="t3 blue">可选增益</text>
  <text x="602" y="485" class="small white">检索公开流程并生成可读回执</text>
  <text x="602" y="522" class="small red">材料来源不清时转人工</text>

  <rect x="1060" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="1092" y="278" class="id amber">R-03 · NODE-03</text>
  <text x="1092" y="314" class="t2 white">大钟寺城市级会客厅</text>
  <text x="1092" y="347" class="small muted">S10 智能原生零售街</text>
  <text x="1092" y="386" class="t3 cyan">普通路径</text>
  <text x="1092" y="416" class="small white">居民归家、普通商业、人工问询</text>
  <text x="1092" y="455" class="t3 blue">可选增益</text>
  <text x="1092" y="485" class="small white">聚合状态提示容量和恢复进度</text>
  <text x="1092" y="522" class="small red">消防或居民路径受压时降容</text>

  <text x="80" y="603" class="id cyan">FIVE RECEIPT STEPS</text>
  <path d="M150 690 H1450" class="line"/>
  <circle cx="180" cy="690" r="21" fill="#6be2d3"/><circle cx="500" cy="690" r="21" fill="#6be2d3"/><circle cx="820" cy="690" r="21" fill="#6be2d3"/><circle cx="1140" cy="690" r="21" fill="#ff8775"/><circle cx="1420" cy="690" r="21" fill="#f4c56b"/>
  <text x="153" y="650" class="t3 white">01 看见普通入口</text><text x="465" y="650" class="t3 white">02 知道 AI 做什么</text><text x="790" y="650" class="t3 white">03 人工可以接管</text><text x="1085" y="650" class="t3 white">04 失败立即停用</text><text x="1360" y="650" class="t3 white">05 回到日常并留回执</text>
  <text x="171" y="698" class="id" fill="#101820">1</text><text x="491" y="698" class="id" fill="#101820">2</text><text x="811" y="698" class="id" fill="#101820">3</text><text x="1131" y="698" class="id" fill="#101820">4</text><text x="1411" y="698" class="id" fill="#101820">5</text>

  <rect x="80" y="760" width="1440" height="155" rx="18" class="panel2"/>
  <text x="112" y="803" class="t2 amber">回放边界</text>
  <text x="112" y="840" class="t3 white">4 个负向夹具均回到 HOLD。字段来源为方案包内 14 条场景、8 项运营动作、3 处节点和 8 类画像。</text>
  <text x="112" y="875" class="t3 muted">当前没有现场数据、授权或服务绩效。图板只证明结构连接和停止逻辑，不证明居民体验、许可、人员值守或官方评分。</text>
  <text x="112" y="903" class="small muted">source contracts  ·  scenario-operation-matrix  ·  operations-matrix  ·  key-area-node-plans  ·  GATE-29  ·  S02 tabletop</text>
</svg>
