<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <title>Jing-Zhang Open Pulse ordinary service and AI gain equivalence receipt</title>
  <desc>Three key areas show ordinary routes, optional AI gains, stop conditions and restoration receipts</desc>
  <style>
    .bg{fill:#101820}.panel{fill:#182630;stroke:#38505b;stroke-width:2}.panel2{fill:#132129;stroke:#2e4650;stroke-width:2}.white{fill:#eef5f2}.muted{fill:#a9bebc}.cyan{fill:#6be2d3}.amber{fill:#f4c56b}.red{fill:#ff8775}.blue{fill:#7bb5ff}.line{stroke:#6be2d3;stroke-width:5;fill:none}.t1{font:700 36px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.t2{font:700 22px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.t3{font:500 18px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.small{font:500 15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.id{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
  </style>
  <rect class="bg" width="1600" height="1000"/>
  <text x="80" y="82" class="t1 white">JING-ZHANG OPEN PULSE</text>
  <text x="80" y="126" class="t2 cyan">Ordinary Service and AI Gain Equivalence Receipt</text>
  <text x="80" y="158" class="t3 muted">Three key areas share five receipt steps. Read the ordinary route first, then the optional gain.</text>
  <rect x="1050" y="55" width="110" height="42" rx="21" fill="#294c57"/><text x="1084" y="83" class="t3 cyan">G0</text>
  <rect x="1175" y="55" width="120" height="42" rx="21" fill="#5b3f2f"/><text x="1202" y="83" class="t3 amber">HOLD</text>
  <rect x="1310" y="55" width="120" height="42" rx="21" fill="#294c57"/><text x="1330" y="83" class="small cyan">0 AUTH</text>
  <rect x="1445" y="55" width="100" height="42" rx="21" fill="#294c57"/><text x="1466" y="83" class="small cyan">0 FIELD</text>

  <text x="80" y="210" class="id cyan">ROUTE CARDS</text>
  <rect x="80" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="112" y="278" class="id amber">R-01 · NODE-01</text><text x="112" y="314" class="t2 white">Trusted Research Garden</text><text x="112" y="347" class="small muted">S02 low-speed delivery robot validation</text><text x="112" y="386" class="t3 cyan">ORDINARY ROUTE</text><text x="112" y="416" class="small white">Walking, paper wayfinding, human delivery</text><text x="112" y="455" class="t3 blue">OPTIONAL GAIN</text><text x="112" y="485" class="small white">Bounded low-speed delivery window</text><text x="112" y="522" class="small red">Exit on failed stop or takeover</text>
  <rect x="570" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="602" y="278" class="id amber">R-02 · NODE-02</text><text x="602" y="314" class="t2 white">Open Conversion Quarter</text><text x="602" y="347" class="small muted">S08 enterprise service counter</text><text x="602" y="386" class="t3 cyan">ORDINARY ROUTE</text><text x="602" y="416" class="small white">Staffed counter, paper materials, public rules</text><text x="602" y="455" class="t3 blue">OPTIONAL GAIN</text><text x="602" y="485" class="small white">Retrieve public process and issue a receipt</text><text x="602" y="522" class="small red">Switch to staff when sources are unclear</text>
  <rect x="1060" y="235" width="460" height="310" rx="18" class="panel"/>
  <text x="1092" y="278" class="id amber">R-03 · NODE-03</text><text x="1092" y="314" class="t2 white">Dazhongsi Civic Salon</text><text x="1092" y="347" class="small muted">S10 intelligent retail street</text><text x="1092" y="386" class="t3 cyan">ORDINARY ROUTE</text><text x="1092" y="416" class="small white">Resident return, ordinary retail, staff help</text><text x="1092" y="455" class="t3 blue">OPTIONAL GAIN</text><text x="1092" y="485" class="small white">Aggregate capacity and recovery status</text><text x="1092" y="522" class="small red">Reduce capacity if routes are pressured</text>

  <text x="80" y="603" class="id cyan">FIVE RECEIPT STEPS</text><path d="M150 690 H1450" class="line"/>
  <circle cx="180" cy="690" r="21" fill="#6be2d3"/><circle cx="500" cy="690" r="21" fill="#6be2d3"/><circle cx="820" cy="690" r="21" fill="#6be2d3"/><circle cx="1140" cy="690" r="21" fill="#ff8775"/><circle cx="1420" cy="690" r="21" fill="#f4c56b"/>
  <text x="153" y="650" class="t3 white">01 See ordinary entry</text><text x="465" y="650" class="t3 white">02 Know the AI role</text><text x="790" y="650" class="t3 white">03 Human takeover</text><text x="1085" y="650" class="t3 white">04 Stop on failure</text><text x="1360" y="650" class="t3 white">05 Restore and receipt</text>
  <text x="171" y="698" class="id" fill="#101820">1</text><text x="491" y="698" class="id" fill="#101820">2</text><text x="811" y="698" class="id" fill="#101820">3</text><text x="1131" y="698" class="id" fill="#101820">4</text><text x="1411" y="698" class="id" fill="#101820">5</text>
  <rect x="80" y="760" width="1440" height="155" rx="18" class="panel2"/><text x="112" y="803" class="t2 amber">REPLAY BOUNDARY</text><text x="112" y="840" class="t3 white">Four negative fixtures return to HOLD. Sources are 14 scenario rows, 8 operating actions, 3 nodes and 8 personas.</text><text x="112" y="875" class="t3 muted">There is no field data, authorisation or service performance. The board proves structural linkage and stop logic only.</text><text x="112" y="903" class="small muted">source contracts  ·  scenario-operation-matrix  ·  operations-matrix  ·  key-area-node-plans  ·  GATE-29  ·  S02 tabletop</text>
</svg>
