<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #102846; }
      .title { font-size: 52px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 21px; fill: #60728b; }
      .card-title { font-size: 29px; font-weight: 700; }
      .card-sub { font-size: 17px; font-weight: 600; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
      .small { font-size: 15px; fill: #43536a; }
      .tiny { font-size: 13px; fill: #60728b; }
      .contract { font-size: 16px; }
      .card-title-light { font-size: 29px; font-weight: 700; fill: #ffffff; }
      .card-sub-light { font-size: 17px; font-weight: 600; fill: #ffffff; }
      .label-light { font-size: 16px; font-weight: 700; letter-spacing: .5px; fill: #ffffff; }
      .small-light { font-size: 15px; fill: #ffffff; }
      .tiny-light { font-size: 13px; fill: #ffffff; }
      .footer-item { font-size: 13px; fill: #ffffff; }
      .footer-note { font-size: 13px; fill: #b9c7d7; }
      .muted { fill: #60728b; }
      .warning { fill: #dc5a3c; font-weight: 700; }
      .route { fill: none; stroke: #1e9b91; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .walk { fill: none; stroke: #102846; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 4 12; }
      .curb { fill: none; stroke: #ee704f; stroke-width: 11; stroke-linecap: round; }
      .thin { fill: none; stroke: #8ea0b8; stroke-width: 2; }
    </style>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#dbe2e9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1800" height="1200" fill="#f4f1eb"/>
  <text x="60" y="76" class="title">三处重点区｜三种空间原型</text>
  <text x="60" y="112" class="subtitle">每处都把企业请求、居民回报、空间动作、停止条件和待补证据放在同一张图上</text>
  <rect x="1530" y="38" width="210" height="46" rx="23" fill="#e5f2ef"/>
  <text x="1635" y="68" text-anchor="middle" class="card-sub" style="fill:#16887f">V2.2 / PROVISIONAL</text>

  <!-- 01 Zhongzhiyuan -->
  <g transform="translate(60,145)">
    <rect width="540" height="842" rx="28" fill="#ffffff"/>
    <rect width="540" height="92" rx="28" fill="#eb704d"/>
    <rect y="64" width="540" height="28" fill="#eb704d"/>
    <text x="26" y="42" class="card-title-light" fill="#ffffff">01 众智园｜清河前厅</text>
    <text x="26" y="70" class="card-sub-light" fill="#ffffff">企业到岗 × 河岸公共通行</text>

    <text x="24" y="126" class="label">概念平面 / CONCEPT PLAN</text>
    <rect x="24" y="142" width="492" height="276" rx="16" fill="#f7f9f9" stroke="#dbe2e9"/>
    <path d="M24 180 Q125 152 232 180 T516 174" fill="none" stroke="#75b8d0" stroke-width="26" opacity=".72"/>
    <text x="38" y="168" class="tiny">清河步行带 + 雨水花园</text>
    <rect x="62" y="220" width="120" height="76" rx="8" fill="#d9e5e7"/>
    <rect x="202" y="220" width="120" height="76" rx="8" fill="#d9e5e7"/>
    <rect x="342" y="220" width="120" height="76" rx="8" fill="#d9e5e7"/>
    <text x="262" y="260" text-anchor="middle" class="small">研发庭院 / R&amp;D COURTS</text>
    <path d="M48 320 H492" class="route"/>
    <circle cx="270" cy="320" r="27" fill="#102846"/>
    <text x="270" y="326" text-anchor="middle" class="tiny-light" fill="#ffffff">共享前厅</text>
    <path d="M48 366 H492" stroke="#4b5e76" stroke-width="32"/>
    <path d="M78 347 V385 M166 347 V385 M254 347 V385 M342 347 V385 M430 347 V385" stroke="#ffffff" stroke-width="3"/>
    <path d="M78 394 H235" class="curb"/>
    <path d="M318 394 H470" class="curb"/>
    <text x="78" y="412" class="tiny">高峰班车</text>
    <text x="367" y="412" class="tiny">午间装卸</text>

    <text x="24" y="454" class="label">指示断面 / INDICATIVE SECTION</text>
    <rect x="24" y="470" width="492" height="142" rx="14" fill="url(#grid)" stroke="#dbe2e9"/>
    <rect x="42" y="536" width="96" height="36" fill="#83bccc"/>
    <rect x="138" y="520" width="78" height="52" fill="#dce9d7"/>
    <rect x="216" y="530" width="74" height="42" fill="#f5d9aa"/>
    <rect x="290" y="510" width="134" height="62" fill="#73839a"/>
    <rect x="424" y="520" width="74" height="52" fill="#f2b09e"/>
    <text x="90" y="592" text-anchor="middle" class="tiny">河岸步行</text>
    <text x="177" y="592" text-anchor="middle" class="tiny">雨水花园</text>
    <text x="253" y="592" text-anchor="middle" class="tiny">骑行</text>
    <text x="357" y="592" text-anchor="middle" class="tiny">接驳道路</text>
    <text x="461" y="592" text-anchor="middle" class="tiny">时段路缘</text>

    <text x="24" y="650" class="contract"><tspan font-weight="700">企业请求：</tspan>高峰合并接驳、午间装卸</text>
    <text x="24" y="682" class="contract"><tspan font-weight="700">居民回报：</tspan>河岸步行不断、路缘按时归还</text>
    <text x="24" y="714" class="contract warning" style="fill:#dc5a3c">停止：公共穿行被切断，或无人清场</text>
    <line x1="24" y1="738" x2="516" y2="738" stroke="#e3e8ed"/>
    <text x="24" y="770" class="label">放行前补证</text>
    <text x="24" y="799" class="small">入口｜权属｜断面｜峰值流量｜责任回执</text>
  </g>

  <!-- 02 AI Origin -->
  <g transform="translate(630,145)">
    <rect width="540" height="842" rx="28" fill="#ffffff"/>
    <rect width="540" height="92" rx="28" fill="#249c91"/>
    <rect y="64" width="540" height="28" fill="#249c91"/>
    <text x="26" y="42" class="card-title-light" fill="#ffffff">02 AI 原点｜照护环</text>
    <text x="26" y="70" class="card-sub-light" fill="#ffffff">社区日常 × 人工等价入口</text>

    <text x="24" y="126" class="label">概念平面 / CONCEPT PLAN</text>
    <rect x="24" y="142" width="492" height="276" rx="16" fill="#f7f9f9" stroke="#dbe2e9"/>
    <rect x="54" y="176" width="118" height="82" rx="10" fill="#d9e5e7"/>
    <rect x="366" y="176" width="118" height="82" rx="10" fill="#d9e5e7"/>
    <rect x="54" y="320" width="118" height="62" rx="10" fill="#d9e5e7"/>
    <rect x="366" y="320" width="118" height="62" rx="10" fill="#d9e5e7"/>
    <path d="M112 278 C112 232 162 206 270 206 C378 206 426 234 426 278 V318 C426 362 378 388 270 388 C162 388 112 360 112 318 Z" class="route"/>
    <path d="M74 280 H466" class="walk"/>
    <circle cx="270" cy="280" r="46" fill="#102846"/>
    <text x="270" y="275" text-anchor="middle" class="small-light" fill="#ffffff">人工前厅</text>
    <text x="270" y="296" text-anchor="middle" class="tiny-light" fill="#ffffff">电话 / 纸面</text>
    <circle cx="112" cy="280" r="15" fill="#eb704d"/>
    <circle cx="426" cy="280" r="15" fill="#eb704d"/>
    <text x="42" y="404" class="tiny">轨道/公交接口</text>
    <text x="362" y="404" class="tiny">社区服务台</text>

    <text x="24" y="454" class="label">指示断面 / INDICATIVE SECTION</text>
    <rect x="24" y="470" width="492" height="142" rx="14" fill="url(#grid)" stroke="#dbe2e9"/>
    <rect x="42" y="520" width="116" height="52" fill="#dce9d7"/>
    <rect x="158" y="532" width="72" height="40" fill="#f5d9aa"/>
    <rect x="230" y="510" width="106" height="62" fill="#f1cfd0"/>
    <rect x="336" y="522" width="86" height="50" fill="#73839a"/>
    <rect x="422" y="512" width="76" height="60" fill="#b5ddd6"/>
    <text x="100" y="592" text-anchor="middle" class="tiny">宽人行</text>
    <text x="194" y="592" text-anchor="middle" class="tiny">骑行</text>
    <text x="283" y="592" text-anchor="middle" class="tiny">照护/休息</text>
    <text x="379" y="592" text-anchor="middle" class="tiny">公交接驳</text>
    <text x="460" y="592" text-anchor="middle" class="tiny">人工台</text>

    <text x="24" y="650" class="contract"><tspan font-weight="700">企业请求：</tspan>访客预约、园区服务对接</text>
    <text x="24" y="682" class="contract"><tspan font-weight="700">居民回报：</tspan>连续照护环、安静休息、人工入口</text>
    <text x="24" y="714" class="contract warning" style="fill:#dc5a3c">停止：必须用 App，或轮椅/照护链断裂</text>
    <line x1="24" y1="738" x2="516" y2="738" stroke="#e3e8ed"/>
    <text x="24" y="770" class="label">放行前补证</text>
    <text x="24" y="799" class="small">逐段走查｜夜间照明｜值守｜替代路线｜申诉</text>
  </g>

  <!-- 03 Dazhongsi -->
  <g transform="translate(1200,145)">
    <rect width="540" height="842" rx="28" fill="#ffffff"/>
    <rect width="540" height="92" rx="28" fill="#6e75ee"/>
    <rect y="64" width="540" height="28" fill="#6e75ee"/>
    <text x="26" y="42" class="card-title-light" fill="#ffffff">03 大钟寺｜四象限换乘厅</text>
    <text x="26" y="70" class="card-sub-light" fill="#ffffff">公告任务锚点 × 站城公共界面</text>

    <text x="24" y="126" class="label">概念平面 / CONCEPT PLAN</text>
    <rect x="24" y="142" width="492" height="276" rx="16" fill="#f7f9f9" stroke="#dbe2e9"/>
    <rect x="44" y="160" width="174" height="92" rx="10" fill="#d9e5e7"/>
    <rect x="322" y="160" width="174" height="92" rx="10" fill="#d9e5e7"/>
    <rect x="44" y="308" width="174" height="88" rx="10" fill="#d9e5e7"/>
    <rect x="322" y="308" width="174" height="88" rx="10" fill="#d9e5e7"/>
    <path d="M246 150 V408" stroke="#4b5e76" stroke-width="46"/>
    <path d="M24 280 H516" stroke="#4b5e76" stroke-width="46"/>
    <path d="M270 150 V408 M24 304 H516" class="walk"/>
    <circle cx="258" cy="292" r="54" fill="#102846" stroke="#ffffff" stroke-width="5"/>
    <text x="258" y="286" text-anchor="middle" class="small-light" fill="#ffffff">站点任务锚点</text>
    <text x="258" y="308" text-anchor="middle" class="tiny-light" fill="#ffffff">四象限穿越</text>
    <rect x="52" y="232" width="98" height="18" rx="9" fill="#f5c76b"/>
    <rect x="390" y="310" width="98" height="18" rx="9" fill="#eb704d"/>
    <text x="48" y="412" class="tiny">骑行停放 / 夜间人工前厅</text>
    <text x="314" y="412" class="tiny">活动疏散 / 时段装卸</text>

    <text x="24" y="454" class="label">指示断面 / INDICATIVE SECTION</text>
    <rect x="24" y="470" width="492" height="142" rx="14" fill="url(#grid)" stroke="#dbe2e9"/>
    <rect x="42" y="520" width="106" height="52" fill="#dce9d7"/>
    <rect x="148" y="532" width="72" height="40" fill="#f5d9aa"/>
    <rect x="220" y="508" width="110" height="64" fill="#f1cfd0"/>
    <rect x="330" y="510" width="96" height="62" fill="#73839a"/>
    <rect x="426" y="520" width="72" height="52" fill="#f2b09e"/>
    <text x="95" y="592" text-anchor="middle" class="tiny">站口步行</text>
    <text x="184" y="592" text-anchor="middle" class="tiny">骑行</text>
    <text x="275" y="592" text-anchor="middle" class="tiny">等候/活动</text>
    <text x="378" y="592" text-anchor="middle" class="tiny">公共交通</text>
    <text x="462" y="592" text-anchor="middle" class="tiny">工作路缘</text>

    <text x="24" y="650" class="contract"><tspan font-weight="700">企业请求：</tspan>访客到达、活动疏散、限时装卸</text>
    <text x="24" y="682" class="contract"><tspan font-weight="700">居民回报：</tspan>四象限连续穿越、夜间人工回退</text>
    <text x="24" y="714" class="contract warning" style="fill:#dc5a3c">停止：PROV-KEY-003 尚未完成站点锚定</text>
    <line x1="24" y1="738" x2="516" y2="738" stroke="#e3e8ed"/>
    <text x="24" y="770" class="label">放行前补证</text>
    <text x="24" y="799" class="small">正式锚点｜四象限断面｜流量｜权属｜疏散责任</text>
  </g>

  <g transform="translate(60,1015)">
    <rect width="1680" height="126" rx="24" fill="#102846"/>
    <text x="28" y="35" class="label-light" fill="#ffffff">共同发布门 / COMMON RELEASE GATE</text>
    <text x="28" y="69" class="footer-item" fill="#ffffff">企业得到：到岗、接驳、访客或装卸窗口</text>
    <text x="430" y="69" class="footer-item" fill="#ffffff">居民得到：连续通行、人工路线和申诉权</text>
    <text x="860" y="69" class="footer-item" fill="#ffffff">缺现场证据：只登记，不预约、不扩容</text>
    <text x="1280" y="69" class="footer-item" fill="#ffffff">最慢群体变差：停止，退回公共交通 + 人工</text>
    <text x="28" y="102" class="footer-note" fill="#b9c7d7">概念原型，不是实测现状或工程线位。来源：公开任务书、geometry/key_areas.geojson、Issue #1029；正式边界、站点锚点、路权、断面、流量和责任回执到位后整体复算。</text>
  </g>
</svg>
