<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc"><title id="title">京张流线公地｜企业资源回到居民日常的互惠发布门</title><desc id="desc">企业少占一段公共资源，不自动等于居民多得到一段服务；两边必须在同一条证据链上验收。</desc>
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071A2C"/><stop offset="1" stop-color="#123E4B"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00111F" flood-opacity=".22"/></filter><style>
      .sans{font-family:"PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.title{font:900 43px "PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.sub{font:600 19px "PingFang SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif}.eyebrow{font:900 17px Arial,sans-serif;letter-spacing:3px}.caseId{font:900 16px Arial,sans-serif}.caseTitle{font:900 22px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.label{font:900 14px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.body{font:650 15px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.status{font:900 16px Arial,sans-serif}.siteNo{font:900 18px Arial,sans-serif}.siteTitle{font:900 23px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.siteBody{font:650 16px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.small{font:650 14px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}.metric{font:900 29px Arial,sans-serif}.metricLabel{font:800 14px "PingFang SC","Noto Sans CJK SC",Arial,sans-serif}</style></defs>
    <rect width="1800" height="1200" fill="url(#bg)"/><circle cx="1700" cy="70" r="300" fill="#2AA593" opacity=".12"/><text x="70" y="55" class="eyebrow" fill="#71E1C2">FLOW COMMONS / RECIPROCITY REVIEW / v2.1</text><text x="70" y="120" class="title" fill="#F4FBFD">京张流线公地｜企业资源回到居民日常的互惠发布门</text><text x="70" y="160" class="sub" fill="#ACCAD2">企业少占一段公共资源，不自动等于居民多得到一段服务；两边必须在同一条证据链上验收。</text>
    <rect x="70" y="215" width="500" height="765" rx="30" fill="#0C293A" stroke="#28576A" filter="url(#shadow)"/><text x="110" y="270" class="eyebrow" fill="#71E1C2">三处接口 / 一条双向契约</text><path d="M180 350 L180 810" stroke="#5D7F8D" stroke-width="9" stroke-linecap="round"/><path d="M180 350 C390 340 390 535 180 592 C390 605 390 780 180 810" fill="none" stroke="#71E1C2" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/><circle cx="180" cy="408" r="33" fill="#EF7254"/><text x="180" y="416" text-anchor="middle" class="siteNo" fill="#fff">01</text><text x="240" y="403" class="siteTitle" fill="#F1F8FA">众智园</text><text x="240" y="438" class="siteBody" fill="#9FC0CA">企业到岗 / 班车 / 装卸</text><circle cx="180" cy="592" r="33" fill="#27A694"/><text x="180" y="600" text-anchor="middle" class="siteNo" fill="#fff">02</text><text x="240" y="587" class="siteTitle" fill="#F1F8FA">AI 原点社区</text><text x="240" y="622" class="siteBody" fill="#9FC0CA">上学 / 照护 / 就医 / 回家</text><circle cx="180" cy="776" r="33" fill="#7180F6"/><text x="180" y="784" text-anchor="middle" class="siteNo" fill="#fff">03</text><text x="240" y="771" class="siteTitle" fill="#F1F8FA">大钟寺</text><text x="240" y="806" class="siteBody" fill="#9FC0CA">轨道换乘 / 路缘 / 访客</text>
    <rect x="105" y="855" width="430" height="84" rx="18" fill="#153B4B"/><text x="125" y="887" class="small" fill="#9FC0CA">规则</text><text x="125" y="916" class="small" fill="#F3FAFB">企业侧节省只有在居民最慢路径不变差时才可进入人工复</text><text x="125" y="936" class="small" fill="#F3FAFB">核。</text>
    <g><rect x="620" y="354" width="1090" height="138" rx="22" fill="#F7FAFC" stroke="#D9E3EA"/>
      <rect x="640" y="372" width="82" height="36" rx="18" fill="#143F52"/><text x="681" y="397" text-anchor="middle" class="caseId" fill="#7DE5C8">R-01</text>
      <text x="744" y="396" class="caseTitle" fill="#112B40">早高峰</text>
      <text x="744" y="429" class="label" fill="#D65F49">企业请求</text><text x="890" y="429" class="body" fill="#30495A">班车合并、员工到岗与访客落客窗口</text>
      <text x="744" y="466" class="label" fill="#188A7A">居民回报</text><text x="890" y="466" class="body" fill="#30495A">上学、照护与无障碍站口路线不被企业优先级切断</text></g><g><rect x="620" y="518" width="1090" height="138" rx="22" fill="#F7FAFC" stroke="#D9E3EA"/>
      <rect x="640" y="536" width="82" height="36" rx="18" fill="#143F52"/><text x="681" y="561" text-anchor="middle" class="caseId" fill="#7DE5C8">R-02</text>
      <text x="744" y="560" class="caseTitle" fill="#112B40">午间路缘</text>
      <text x="744" y="593" class="label" fill="#D65F49">企业请求</text><text x="890" y="593" class="body" fill="#30495A">装卸、充电与维修短时窗口</text>
      <text x="744" y="630" class="label" fill="#188A7A">居民回报</text><text x="890" y="630" class="body" fill="#30495A">消防、轮椅、步行和社区服务通道保持连续</text></g><g><rect x="620" y="682" width="1090" height="138" rx="22" fill="#F7FAFC" stroke="#D9E3EA"/>
      <rect x="640" y="700" width="82" height="36" rx="18" fill="#143F52"/><text x="681" y="725" text-anchor="middle" class="caseId" fill="#7DE5C8">R-03</text>
      <text x="744" y="724" class="caseTitle" fill="#112B40">雨雪与夜间返程</text>
      <text x="744" y="757" class="label" fill="#D65F49">企业请求</text><text x="890" y="757" class="body" fill="#30495A">夜班接驳、班次调整与数字调度</text>
      <text x="744" y="794" class="label" fill="#188A7A">居民回报</text><text x="890" y="794" class="body" fill="#30495A">断网或天气恶化时仍能靠公共交通、电话或人工回家</text></g><g><rect x="620" y="846" width="1090" height="138" rx="22" fill="#F7FAFC" stroke="#D9E3EA"/>
      <rect x="640" y="864" width="82" height="36" rx="18" fill="#143F52"/><text x="681" y="889" text-anchor="middle" class="caseId" fill="#7DE5C8">R-04</text>
      <text x="744" y="888" class="caseTitle" fill="#112B40">故障、维护与退出</text>
      <text x="744" y="921" class="label" fill="#D65F49">企业请求</text><text x="890" y="921" class="body" fill="#30495A">服务恢复、设备复用与重新开放</text>
      <text x="744" y="958" class="label" fill="#188A7A">居民回报</text><text x="890" y="958" class="body" fill="#30495A">原记录不被覆盖，申诉可暂停发布，公共路线先恢复</text></g>
    <rect x="70" y="1020" width="790" height="125" rx="26" fill="#123F49" stroke="#3EB69F"/><text x="105" y="1055" class="metricLabel" fill="#9DEAD6">G0 包内回放</text><text x="105" y="1097" class="metric" fill="#72E4C5">PASS</text><text x="250" y="1083" class="small" fill="#D6E8EA">4/4 fallback · 6/6 checks · 5/5 rollback</text><text x="250" y="1111" class="small" fill="#9FC0CA">只证明结构可重放，不推进 P1/P2</text>
    <rect x="890" y="1020" width="840" height="125" rx="26" fill="#392A31" stroke="#EF8A73"/><text x="925" y="1055" class="metricLabel" fill="#FFC0B2">G1 现场发布</text><text x="925" y="1097" class="metric" fill="#FF927D">HOLD</text><text x="1070" y="1083" class="small" fill="#F8DDD7">0 audit · 0 transfer · 0 locked denominator · 0 authorization</text><text x="1070" y="1111" class="small" fill="#DDBAB2">现场基线、责任接受与专业授权缺一项都不发布</text>
    <text x="70" y="1180" class="small" fill="#87AAB4">PROVISIONAL GEOMETRY · SYNTHETIC PACKAGE REPLAY · NO PERSONAL TRACES · AIR EXCLUDED · 147228</text></svg>
