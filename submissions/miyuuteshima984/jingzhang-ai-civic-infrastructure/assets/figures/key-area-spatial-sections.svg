<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img">
<style>
text{font-family:Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif;fill:#172033} .title{font-size:50px;font-weight:700} .sub{font-size:20px;fill:#64748b}
.h2{font-size:29px;font-weight:700} .h3{font-size:19px;font-weight:700} .b{font-size:17px} .s{font-size:14px;fill:#64748b}
.tag{font-size:15px;font-weight:700} .white{fill:#fff} .light{fill:#cbd5e1} .panel{fill:#fff;stroke:#d7dee8;stroke-width:2} .route{fill:none;stroke:#0f766e;stroke-width:9;stroke-linecap:round}
.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8} .exit{fill:none;stroke:#b91c1c;stroke-width:4;stroke-dasharray:8 7}
</style><rect width="1800" height="1350" fill="#f7f9fc"/><text x="70" y="75" class="title">v0.11｜三核 = 三条空间合同</text><text x="70" y="116" class="sub">同一套设计纪律，在三种不同城市剖面中接受检验：普通城市底座先成立；AI / 测试叠加层可停可撤，不能把城市一起带走。</text><g transform="translate(60,155)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#b45309"/><text x="42" y="48" class="h2">01 众智园｜TEST WITHOUT BLOCKING / 测试不阻断</text><text x="42" y="82" class="s">完整创新校园：研发、吃饭、休息、步行先连续；测试口袋与公众主路径物理分离。</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#dcecff"/><text x="203" y="185" text-anchor="middle" class="h3">研发</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="507" y="185" text-anchor="middle" class="h3">吃饭 / 休息</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">公共绿脊</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#edf2ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7"/><text x="1119" y="185" text-anchor="middle" class="h3">受控测试口袋</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="1425" y="185" text-anchor="middle" class="h3">人工停止 / 监护</text><path d="M1035 135 C1110 100 1245 100 1325 135" class="ai"/><path d="M1010 258 C1120 278 1235 278 1350 258" class="exit"/><text x="42" y="302" class="s">TEST-OFF：测试关闭/撤除后，普通通行、工作与休息不绕行、不改变。</text></g><g transform="translate(60,515)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#2563eb"/><text x="42" y="48" class="h2">02 AI 原点｜CARE WITHOUT ACCOUNT / 无账号也能照护</text><text x="42" y="82" class="s">完整长期社区：家门—照护—公共客厅保持实体、有人服务的短链，不以登录或授权数据为前提。</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#fde9d6"/><text x="203" y="185" text-anchor="middle" class="h3">长期住房</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="507" y="185" text-anchor="middle" class="h3">照护 / 人工服务</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">遮阴 / 坐凳</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="1119" y="185" text-anchor="middle" class="h3">普通商业</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="1425" y="185" text-anchor="middle" class="h3">公共客厅</text><path d="M405 130 C480 98 560 98 635 130" class="ai"/><path d="M390 258 C470 278 560 278 650 258" class="exit"/><text x="42" y="302" class="s">AI-OFF / 无账号：照护、求助、休息与公共生活保持同一条实体路径。</text></g><g transform="translate(60,875)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#0f766e"/><text x="42" y="48" class="h2">03 大钟寺｜ARRIVE WITHOUT APP / 不用 App 也能到达</text><text x="42" y="82" class="s">完整站城到达：固定双语导视、人工问询、无障碍换乘先让到达成立，动态信息只做增强。</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#dcecff"/><text x="203" y="185" text-anchor="middle" class="h3">到达 / 固定导视</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="507" y="185" text-anchor="middle" class="h3">人工问询</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">无障碍换乘</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="1119" y="185" text-anchor="middle" class="h3">普通商业 / 等候</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#dff2e4"/><text x="1425" y="185" text-anchor="middle" class="h3">遗产 / 公共绿脊</text><path d="M90 130 C170 95 255 95 330 130" class="ai"/><path d="M75 258 C170 278 270 278 345 258" class="exit"/><text x="42" y="302" class="s">APP / AI-OFF：实体导视 + 人工服务 + 普通路径仍完成到达与换乘。</text></g><text x="70" y="1245" class="b">绿色实线 = 普通公众路径 · 蓝色虚线 = 可选 AI / 测试叠加层 · 红色虚线 = 停止 / 退出路径</text><text x="70" y="1292" class="s">现实边界：concept-only；重点区 geometry 为 provisional；不声称测绘、法定红线、车站工程线位或已批准 FAR / 高度。</text></svg>