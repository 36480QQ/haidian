<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <style>
    text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}
    .title{font-weight:700;fill:#111827}.sub{fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    .name{font-weight:700;fill:#111827}.place{font-weight:700;fill:#475569}.label{font-weight:700;fill:#0f766e}.body{fill:#334155}.verify{font-weight:700;fill:#111827}
  </style>
  <text x="60" y="66" font-size="40" class="title">v0.11｜公共承诺 = 空间合同</text>
  <text x="60" y="105" font-size="19" class="sub">不是新增口号：每项承诺必须同时落到重点区、普通城市基线、空间规则、人工接管、退出与可核验条件</text>

  <rect x="60" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="60" y="150" width="477" height="12" rx="6" fill="#0f766e"/>
  <text x="88" y="205" font-size="26" class="name">ARRIVE WITHOUT APP</text>
  <text x="88" y="239" font-size="17" class="place">大钟寺｜站城到达</text>
  <text x="88" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="88" y="315" font-size="15" class="body">连续步行/无障碍 + 固定双语导视 + 人工换乘</text>
  <text x="88" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="88" y="391" font-size="15" class="body">实体主路径不可被设备占用；入口可读、可停留、有人可问</text>
  <text x="88" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="88" y="467" font-size="15" class="body">动态多语信息、拥挤提示、路径辅助只叠加在基线之上</text>
  <text x="88" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="88" y="543" font-size="15" class="body">断网/无手机/AI 停止时回到实体导视、人工服务和普通路径</text>
  <text x="88" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="88" y="619" font-size="15" class="body">检查：不用 App 能否从站点到达公共首层并完成换乘/求助</text>
  <path d="M88 665 H505" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="88" y="700" font-size="14" class="sub">Reality rule｜知春路/铁路道路节点按真实竖向条件分别判断，</text>
  <text x="88" y="724" font-size="14" class="sub">不把概念缝合线写成工程线位。</text>

  <rect x="562" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="562" y="150" width="477" height="12" rx="6" fill="#2563eb"/>
  <text x="590" y="205" font-size="26" class="name">CARE WITHOUT ACCOUNT</text>
  <text x="590" y="239" font-size="17" class="place">AI 原点｜长期社区</text>
  <text x="590" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="590" y="315" font-size="15" class="body">家门 → 遮阴坐凳 → 人工照护/服务 → 公共客厅</text>
  <text x="590" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="590" y="391" font-size="15" class="body">公共首层和基本服务入口不得以账号、手机或数据授权为前提</text>
  <text x="590" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="590" y="467" font-size="15" class="body">导航、服务匹配、多语辅助可以增强，但不能成为唯一入口</text>
  <text x="590" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="590" y="543" font-size="15" class="body">拒绝数据处理或系统失效时，人工窗口、电话/纸质流程继续工作</text>
  <text x="590" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="590" y="619" font-size="15" class="body">检查：无账号居民能否完成基本照护、求助、休息与公共生活</text>
  <path d="M590 665 H1007" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="590" y="700" font-size="14" class="sub">Reality rule｜京张绿廊侧连续步行、停留与公共首层优先，</text>
  <text x="590" y="724" font-size="14" class="sub">设备和物流退到普通城市任务之后。</text>

  <rect x="1064" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="1064" y="150" width="477" height="12" rx="6" fill="#b45309"/>
  <text x="1092" y="205" font-size="26" class="name">TEST WITHOUT BLOCKING</text>
  <text x="1092" y="239" font-size="17" class="place">众智园｜创新校园</text>
  <text x="1092" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="1092" y="315" font-size="15" class="body">研究、服务劳动、吃饭休息和普通步行路线先连续</text>
  <text x="1092" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="1092" y="391" font-size="15" class="body">测试口袋/物流路径与公共通行物理分离，边界可关闭可撤除</text>
  <text x="1092" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="1092" y="467" font-size="15" class="body">机器人、设备和算法测试仅进入受控区域，不占普通生活底座</text>
  <text x="1092" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="1092" y="543" font-size="15" class="body">暂停/失败/撤场时，公众通行、休息、工作和基本服务不改变</text>
  <text x="1092" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="1092" y="619" font-size="15" class="body">检查：测试完全停止后，普通城市链是否仍连续且不绕行测试区</text>
  <path d="M1092 665 H1509" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1092" y="700" font-size="14" class="sub">Reality rule｜公开 FAR/高度只作尺度参照，不成为扩大测试、</text>
  <text x="1092" y="724" font-size="14" class="sub">提高强度或突破正式控制的依据。</text>

  <rect x="60" y="824" width="1481" height="42" rx="10" fill="#111827"/>
  <text x="800" y="851" text-anchor="middle" font-size="16" fill="#fff">验收顺序：普通城市任务成立 → 空间合同成立 → AI 可选增强 → 人工接管可用 → AI-OFF / TEST-OFF 后城市仍完整</text>
</svg>
