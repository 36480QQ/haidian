<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img">
<style>
text{font-family:Noto Sans CJK SC, Noto Sans CJK JP, Arial, sans-serif;fill:#172033} .title{font-size:50px;font-weight:700} .sub{font-size:20px;fill:#64748b}
.h2{font-size:29px;font-weight:700} .h3{font-size:19px;font-weight:700} .b{font-size:17px} .s{font-size:14px;fill:#64748b}
.tag{font-size:15px;font-weight:700} .white{fill:#fff} .light{fill:#cbd5e1} .panel{fill:#fff;stroke:#d7dee8;stroke-width:2} .route{fill:none;stroke:#0f766e;stroke-width:9;stroke-linecap:round}
.ai{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8} .exit{fill:none;stroke:#b91c1c;stroke-width:4;stroke-dasharray:8 7}
</style><rect width="1800" height="1350" fill="#f7f9fc"/><text x="70" y="75" class="title">v0.11 | Three cores, three spatial contracts</text><text x="70" y="116" class="sub">The same design discipline is tested in three different urban sections: the baseline works first; AI/test overlays can be stopped without taking the city with them.</text><g transform="translate(60,155)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#b45309"/><text x="42" y="48" class="h2">01 Zhongzhiyuan | TEST WITHOUT BLOCKING</text><text x="42" y="82" class="s">Innovation campus: ordinary work, food, rest and walking stay continuous; test pocket is physically separate.</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#dcecff"/><text x="203" y="185" text-anchor="middle" class="h3">R&amp;D</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="507" y="185" text-anchor="middle" class="h3">FOOD / REST</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">CIVIC GREEN SPINE</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#edf2ff" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 7"/><text x="1119" y="185" text-anchor="middle" class="h3">CONTROLLED TEST</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="1425" y="185" text-anchor="middle" class="h3">STAFFED STOP</text><path d="M1035 135 C1110 100 1245 100 1325 135" class="ai"/><path d="M1010 258 C1120 278 1235 278 1350 258" class="exit"/><text x="42" y="302" class="s">TEST-OFF: test closes/removes; ordinary route, work and rest do not detour.</text></g><g transform="translate(60,515)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#2563eb"/><text x="42" y="48" class="h2">02 AI Origin | CARE WITHOUT ACCOUNT</text><text x="42" y="82" class="s">Long-term neighborhood: home-to-care-to-commons remains a physical, staffed chain without login or data consent.</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#fde9d6"/><text x="203" y="185" text-anchor="middle" class="h3">HOME</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="507" y="185" text-anchor="middle" class="h3">CARE / STAFF</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">SHADE / SEAT</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="1119" y="185" text-anchor="middle" class="h3">DAILY RETAIL</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="1425" y="185" text-anchor="middle" class="h3">COMMONS</text><path d="M405 130 C480 98 560 98 635 130" class="ai"/><path d="M390 258 C470 278 560 278 650 258" class="exit"/><text x="42" y="302" class="s">AI-OFF / NO ACCOUNT: care, help, rest and public life keep the same physical route.</text></g><g transform="translate(60,875)"><rect width="1680" height="320" rx="20" class="panel"/><rect width="16" height="320" rx="8" fill="#0f766e"/><text x="42" y="48" class="h2">03 Dazhongsi | ARRIVE WITHOUT APP</text><text x="42" y="82" class="s">Station-city arrival: fixed bilingual signs, staffed help and accessible interchange make arrival work before dynamic information.</text><rect x="42" y="225" width="1570" height="26" rx="13" fill="#d9dce1"/><path d="M62 220 H1590" class="route"/><rect x="78" y="140" width="250" height="80" rx="10" fill="#dcecff"/><text x="203" y="185" text-anchor="middle" class="h3">ARRIVAL / SIGNS</text><rect x="382" y="140" width="250" height="80" rx="10" fill="#efe5ff"/><text x="507" y="185" text-anchor="middle" class="h3">STAFFED HELP</text><rect x="688" y="158" width="250" height="62" rx="10" fill="#dff2e4"/><text x="813" y="203" text-anchor="middle" class="h3">ACCESSIBLE TRANSFER</text><rect x="994" y="140" width="250" height="80" rx="10" fill="#fff2b9"/><text x="1119" y="185" text-anchor="middle" class="h3">RETAIL / WAIT</text><rect x="1300" y="140" width="250" height="80" rx="10" fill="#dff2e4"/><text x="1425" y="185" text-anchor="middle" class="h3">HERITAGE / SPINE</text><path d="M90 130 C170 95 255 95 330 130" class="ai"/><path d="M75 258 C170 278 270 278 345 258" class="exit"/><text x="42" y="302" class="s">APP/AI-OFF: physical signs + staff + ordinary route still complete arrival and transfer.</text></g><text x="70" y="1245" class="b">Solid green = ordinary public route · Blue dashed = optional AI/test overlay · Red dashed = stop/exit path</text><text x="70" y="1292" class="s">Reality boundary: concept-only; provisional key-area geometry; no survey, regulatory boundary, station engineering line or approved FAR/height is claimed.</text></svg>