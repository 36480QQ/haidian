<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <style>
    text{font-family:"Noto Sans CJK SC","Noto Sans",Arial,sans-serif}
    .title{font-weight:700;fill:#111827}.sub{fill:#64748b}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    .name{font-weight:700;fill:#111827}.place{font-weight:700;fill:#475569}.label{font-weight:700;fill:#0f766e}.body{fill:#334155}.verify{font-weight:700;fill:#111827}
  </style>
  <text x="60" y="66" font-size="40" class="title">v0.11 | PUBLIC PROMISES = SPATIAL CONTRACTS</text>
  <text x="60" y="105" font-size="19" class="sub">Not another slogan layer: each promise must bind a key area, ordinary baseline, spatial rule, human takeover, exit and verification</text>

  <rect x="60" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="60" y="150" width="477" height="12" rx="6" fill="#0f766e"/>
  <text x="88" y="205" font-size="26" class="name">ARRIVE WITHOUT APP</text>
  <text x="88" y="239" font-size="17" class="place">Dazhongsi | station-city arrival</text>
  <text x="88" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="88" y="315" font-size="15" class="body">continuous walking/accessibility + fixed bilingual signs + staffed transfer</text>
  <text x="88" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="88" y="391" font-size="15" class="body">devices never occupy the primary path; entry is legible, stayable, staffed</text>
  <text x="88" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="88" y="467" font-size="15" class="body">dynamic multilingual, crowd and route assistance only layers onto baseline</text>
  <text x="88" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="88" y="543" font-size="15" class="body">offline/no-phone/AI-off returns to signs, staff and the ordinary path</text>
  <text x="88" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="88" y="619" font-size="15" class="body">Can a person reach public ground floor and transfer/ask for help without an app?</text>
  <path d="M88 665 H505" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="88" y="700" font-size="14" class="sub">Reality rule | Treat Zhichun / rail-road nodes by real vertical conditions;</text>
  <text x="88" y="724" font-size="14" class="sub">a conceptual stitch is not an engineering alignment.</text>

  <rect x="562" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="562" y="150" width="477" height="12" rx="6" fill="#2563eb"/>
  <text x="590" y="205" font-size="26" class="name">CARE WITHOUT ACCOUNT</text>
  <text x="590" y="239" font-size="17" class="place">AI Origin | long-term community</text>
  <text x="590" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="590" y="315" font-size="15" class="body">home → shade/seating → staffed care/service → civic commons</text>
  <text x="590" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="590" y="391" font-size="15" class="body">basic service and public ground floor cannot require account/phone/data consent</text>
  <text x="590" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="590" y="467" font-size="15" class="body">navigation, matching and multilingual help may enhance, never become sole entry</text>
  <text x="590" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="590" y="543" font-size="15" class="body">if data is refused or systems fail, staffed/phone/paper routes remain</text>
  <text x="590" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="590" y="619" font-size="15" class="body">Can a no-account resident complete care, help, rest and common-life tasks?</text>
  <path d="M590 665 H1007" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="590" y="700" font-size="14" class="sub">Reality rule | Jing-Zhang greenway walking, staying and public ground floor</text>
  <text x="590" y="724" font-size="14" class="sub">come before devices and logistics.</text>

  <rect x="1064" y="150" width="477" height="650" rx="24" class="card"/>
  <rect x="1064" y="150" width="477" height="12" rx="6" fill="#b45309"/>
  <text x="1092" y="205" font-size="26" class="name">TEST WITHOUT BLOCKING</text>
  <text x="1092" y="239" font-size="17" class="place">Zhongzhiyuan | innovation campus</text>
  <text x="1092" y="286" font-size="16" class="label">01 ORDINARY BASELINE</text>
  <text x="1092" y="315" font-size="15" class="body">research, service work, meals/rest and ordinary walking routes stay continuous</text>
  <text x="1092" y="362" font-size="16" class="label">02 SPATIAL CONTRACT</text>
  <text x="1092" y="391" font-size="15" class="body">test pockets/logistics are physically separate; boundaries can close/remove</text>
  <text x="1092" y="438" font-size="16" class="label">03 OPTIONAL AI</text>
  <text x="1092" y="467" font-size="15" class="body">robots/devices/algorithm tests stay inside controlled zones, not city baseline</text>
  <text x="1092" y="514" font-size="16" class="label">04 HUMAN TAKEOVER / EXIT</text>
  <text x="1092" y="543" font-size="15" class="body">pause/failure/removal leaves public passage, rest, work and services unchanged</text>
  <text x="1092" y="590" font-size="16" class="verify">05 VERIFY</text>
  <text x="1092" y="619" font-size="15" class="body">When testing stops completely, does the ordinary city chain remain continuous?</text>
  <path d="M1092 665 H1509" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="1092" y="700" font-size="14" class="sub">Reality rule | Public FAR/height are scale references only, never grounds to</text>
  <text x="1092" y="724" font-size="14" class="sub">expand tests, intensify the scheme or override formal controls.</text>

  <rect x="60" y="824" width="1481" height="42" rx="10" fill="#111827"/>
  <text x="800" y="851" text-anchor="middle" font-size="16" fill="#fff">Acceptance order: ordinary task works → spatial contract holds → AI optional → human takeover available → city remains complete with AI-OFF / TEST-OFF</text>
</svg>
