<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- two rails converging (JZ / infinity) -->
  <line x1="40" y1="20" x2="100" y2="100" stroke="#16324F" stroke-width="10" stroke-linecap="round"/>
  <line x1="160" y1="20" x2="100" y2="100" stroke="#16324F" stroke-width="10" stroke-linecap="round"/>
  <line x1="40" y1="180" x2="100" y2="100" stroke="#16324F" stroke-width="10" stroke-linecap="round"/>
  <line x1="160" y1="180" x2="100" y2="100" stroke="#16324F" stroke-width="10" stroke-linecap="round"/>
  <!-- coupler ring (interlock) -->
  <circle cx="100" cy="100" r="34" fill="none" stroke="#E8A13D" stroke-width="8"/>
  <circle cx="100" cy="100" r="12" fill="#E8A13D"/>
  <!-- rail sleepers hint -->
  <line x1="86" y1="40" x2="114" y2="40" stroke="#8A94A0" stroke-width="3" opacity="0.6"/>
  <line x1="70" y1="160" x2="130" y2="160" stroke="#8A94A0" stroke-width="3" opacity="0.6"/>
</svg>