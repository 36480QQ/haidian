<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">空间缝合与京张文化公共体验路径</title>
  <desc id="desc">东西服务缝合、南北连续序列，以及京张遗产到 AI 文化和公共体验的概念路径。</desc>
  <style>text{font-family:"Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#17211b} .small{font-size:25px}.label{font-size:30px;font-weight:700}.body{font-size:25px}.muted{fill:#697168}.white{fill:#f3efe4}.lime{fill:#b8f34a}.ink{fill:#17211b}.orange{fill:#ff5d35}.blue{fill:#4b8dff}.green{fill:#3f8664}</style>
  <rect width="2000" height="1400" fill="#f3efe4"/>
  <rect width="2000" height="112" fill="#17211b"/><rect y="112" width="28" height="1288" fill="#ff5d35"/>
  <text x="72" y="62" class="lime small">ALL SHIFTS JING-ZHANG · PHASE 06</text>
  <text x="72" y="205" font-size="58">空间缝合 + 京张文化公共体验路径</text>
  <text x="74" y="258" class="muted body">仅表达概念接口：不预设线位、地块、工程形式或文保控制结论。</text>
  <rect x="70" y="300" width="1860" height="270" rx="28" fill="#fffdf7" stroke="#4b8dff" stroke-width="5"/>
  <text x="100" y="352" class="blue label">01  东西服务缝合</text>
  <g stroke="#17211b" stroke-width="7" fill="none"><path d="M615 465h100"/><path d="M1235 465h100"/></g>
  <g fill="#17211b"><path d="M715 465l-28-16v32z"/><path d="M1335 465l-28-16v32z"/></g>
  <g stroke="#17211b" stroke-width="3">
    <rect x="115" y="410" width="500" height="110" rx="20" fill="#4b8dff"/>
    <rect x="735" y="410" width="500" height="110" rx="20" fill="#ff5d35"/>
    <rect x="1355" y="410" width="500" height="110" rx="20" fill="#3f8664"/>
  </g>
  <g class="white"><text x="140" y="447" class="small">WEST / 服务翼</text><text x="140" y="490" class="body">中关村科技服务翼</text><text x="760" y="447" class="small">SPINE / 公共接口</text><text x="760" y="490" class="body">同班主脊</text><text x="1380" y="447" class="small">EAST / 场景翼</text><text x="1380" y="490" class="body">小月河场景赋能翼</text></g>
  <rect x="70" y="610" width="870" height="580" rx="28" fill="#fffdf7" stroke="#ff5d35" stroke-width="5"/>
  <text x="100" y="662" class="orange label">02  南北连续序列</text>
  <path d="M485 720v365" stroke="#17211b" stroke-width="12"/>
  <g stroke="#17211b" stroke-width="4"><circle cx="485" cy="780" r="60" fill="#4b8dff"/><circle cx="485" cy="905" r="60" fill="#ff5d35"/><circle cx="485" cy="1030" r="60" fill="#3f8664"/></g>
  <g class="body"><text x="600" y="768" class="blue">NORTH</text><text x="600" y="802">众智园</text><text x="600" y="893" class="orange">MIDDLE</text><text x="600" y="927">AI 原点社区</text><text x="600" y="1018" class="green">SOUTH</text><text x="600" y="1052">大钟寺</text></g>
  <text x="105" y="1115" class="muted body">公共体验序列；不等于新增道路、轨道线位或法定边界。</text>
  <rect x="995" y="610" width="935" height="580" rx="28" fill="#fffdf7" stroke="#3f8664" stroke-width="5"/>
  <text x="1025" y="662" class="green label">03  京张遗产 → AI 文化 → 公共体验</text>
  <g stroke="#17211b" stroke-width="5"><path d="M1061 777v28M1061 859v28M1061 941v28M1061 1023v28"/></g>
  <g fill="#17211b"><path d="M1061 805l-10-14h20z"/><path d="M1061 887l-10-14h20z"/><path d="M1061 969l-10-14h20z"/><path d="M1061 1051l-10-14h20z"/></g>
  <g stroke="#17211b" stroke-width="3"><circle cx="1061" cy="750" r="26" fill="#ff5d35"/><circle cx="1061" cy="832" r="26" fill="#4b8dff"/><circle cx="1061" cy="914" r="26" fill="#4b8dff"/><circle cx="1061" cy="996" r="26" fill="#b8f34a"/><circle cx="1061" cy="1078" r="26" fill="#3f8664"/></g>
  <g font-size="22"><text x="1120" y="744">H1  清华园车站旧址</text><text x="1120" y="772" class="muted">待核验</text><text x="1120" y="826">H2  京张遗址公园公共体验</text><text x="1120" y="908">H3  中关村创新文化</text><text x="1120" y="990">H4  AI 新文化：维护 · 交接 · 公共服务</text><text x="1120" y="1072">H5  导视 · 地标 · 活动</text></g>
  <text x="1025" y="1138" class="muted small">叙事由公开来源引导；节点、文保等级、开放条件和活动许可仍待核验。</text>
  <rect x="70" y="1240" width="1860" height="95" rx="18" fill="#17211b"/>
  <text x="100" y="1297" class="lime body">公开来源引导的概念路径 · 不构成实施授权 · 需官方数据与专业复核</text>
