<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" role="img" aria-labelledby="title desc">
  <title id="title">Spatial stitching and Jing-Zhang heritage public-experience route</title>
  <desc id="desc">Conceptual east-west service stitching, north-south continuity and a heritage-to-AI-culture public route.</desc>
  <style>text{font-family:"Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif;fill:#17211b}.small{font-size:25px}.label{font-size:30px;font-weight:700}.body{font-size:25px}.muted{fill:#697168}.white{fill:#f3efe4}.lime{fill:#b8f34a}.ink{fill:#17211b}.orange{fill:#ff5d35}.blue{fill:#4b8dff}.green{fill:#3f8664}</style>
  <rect width="2000" height="1400" fill="#f3efe4"/>
  <rect width="2000" height="112" fill="#17211b"/><rect y="112" width="28" height="1288" fill="#ff5d35"/>
  <text x="72" y="62" class="lime small">ALL SHIFTS JING-ZHANG · PHASE 06</text>
  <text x="72" y="205" font-size="58">SPATIAL STITCHING + HERITAGE EXPERIENCE ROUTE</text>
  <text x="74" y="258" class="muted body">Conceptual interfaces only: no fixed line, parcel, engineering or heritage-control claim.</text>
