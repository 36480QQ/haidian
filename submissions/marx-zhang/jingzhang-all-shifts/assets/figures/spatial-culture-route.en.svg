  <path d="M485 720v365" stroke="#17211b" stroke-width="12"/><g stroke="#17211b" stroke-width="4"><circle cx="485" cy="780" r="60" fill="#4b8dff"/><circle cx="485" cy="905" r="60" fill="#ff5d35"/><circle cx="485" cy="1030" r="60" fill="#3f8664"/></g>
  <g class="body"><text x="600" y="768" class="blue">NORTH</text><text x="600" y="802">Zhongzhiyuan</text><text x="600" y="893" class="orange">MIDDLE</text><text x="600" y="927">AI Origin Community</text><text x="600" y="1018" class="green">SOUTH</text><text x="600" y="1052">Dazhongsi</text></g>
  <text x="105" y="1115" class="muted body">Public experience sequence; not a new road, rail alignment or statutory boundary.</text>
  <rect x="995" y="610" width="935" height="580" rx="28" fill="#fffdf7" stroke="#3f8664" stroke-width="5"/>
  <text x="1025" y="662" class="green label">03  HERITAGE → AI CULTURE → PUBLIC EXPERIENCE</text>
  <g stroke="#17211b" stroke-width="5"><path d="M1061 777v28M1061 859v28M1061 941v28M1061 1023v28"/></g><g fill="#17211b"><path d="M1061 805l-10-14h20z"/><path d="M1061 887l-10-14h20z"/><path d="M1061 969l-10-14h20z"/><path d="M1061 1051l-10-14h20z"/></g>
