  <g stroke="#17211b" stroke-width="7" fill="none"><path d="M615 465h100"/><path d="M1235 465h100"/></g>
  <g fill="#17211b"><path d="M715 465l-28-16v32z"/><path d="M1335 465l-28-16v32z"/></g>
  <g stroke="#17211b" stroke-width="3"><rect x="115" y="410" width="500" height="110" rx="20" fill="#4b8dff"/><rect x="735" y="410" width="500" height="110" rx="20" fill="#ff5d35"/><rect x="1355" y="410" width="500" height="110" rx="20" fill="#3f8664"/></g>
  <g class="white"><text x="140" y="447" class="small">WEST / SERVICE WING</text><text x="140" y="490" class="body">Zhongguancun Tech-Service Wing</text><text x="760" y="447" class="small">SPINE / PUBLIC INTERFACE</text><text x="760" y="490" class="body">Shift Commons Spine</text><text x="1380" y="447" class="small">EAST / SCENARIO WING</text><text x="1380" y="490" class="body">Xiaoyuehe Scenario Wing</text></g>
  <rect x="70" y="610" width="870" height="580" rx="28" fill="#fffdf7" stroke="#ff5d35" stroke-width="5"/>
