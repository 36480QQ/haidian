Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1"><tspan x="88" dy="0">Every public AI scenario binds minimum data, visible human authority, stop/rollback and account-free equivalence; 72 hours remains an</tspan><tspan x="88" dy="22.95">unverified target.</tspan></text><rect x="55" y="545" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="79" y="599" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="79" dy="0">11.41 km²</tspan></text><text x="79" y="636" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="79" dy="0">provisional site</tspan></text><rect x="520" y="545" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="544" y="599" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="544" dy="0">29.6%</tspan></text><text x="544" y="636" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="544" dy="0">green concept</tspan></text><rect x="985" y="545" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="1009" y="599" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="1009" dy="0">17.7%</tspan></text><text x="1009" y="636" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="1009" dy="0">public-space concept</tspan></text><rect x="55" y="695" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="79" y="749" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="79" dy="0">5</tspan></text><text x="79" y="786" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="79" dy="0">regional interfaces</tspan></text><rect x="520" y="695" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="544" y="749" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="544" dy="0">3</tspan></text><text x="544" y="786" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="544" dy="0">first-year pilots</tspan></text><rect x="985" y="695" width="430" height="125" rx="18" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="1009" y="749" fill="#0B1F33" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start" opacity="1"><tspan x="1009" dy="0">7</tspan></text><text x="1009" y="786" fill="#17324D" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" opacity="1"><tspan x="1009" dy="0">responsibility seats</tspan></text><rect x="55" y="875" width="1390" height="300" rx="20" fill="#0F3549" stroke="#315C6B" stroke-width="2" opacity="1"/><text x="82" y="925" fill="#31C6D4" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" opacity="1"><tspan x="82" dy="0">THREE FORMAL REPAIRS</tspan></text><circle cx="106" cy="985" r="24" fill="#31C6D4" stroke="#31C6D4" stroke-width="1" opacity="1"/><text x="96" y="992" fill="#0B1F33" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" opacity="1"><tspan x="96" dy="0">01</tspan></text><text x="142" y="982" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1"><tspan x="142" dy="0">NO-FONT CHINESE</tspan></text><text x="142" y="1016" fill="#CDE7EA" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1"><tspan x="142" dy="0">Build-time glyph outlines; no font</tspan><tspan x="142" dy="18.9">distribution; co-located</tspan><tspan x="142" dy="18.9">searchable/copyable semantics.</tspan></text><circle cx="551" cy="985" r="24" fill="#72E3B2" stroke="#72E3B2" stroke-width="1" opacity="1"/><text x="541" y="992" fill="#0B1F33" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" opacity="1"><tspan x="541" dy="0">02</tspan></text><text x="587" y="982" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1"><tspan x="587" dy="0">REGIONAL INTERFACE MATRIX</tspan></text><text x="587" y="1016" fill="#CDE7EA" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1"><tspan x="587" dy="0">Five interfaces specify exchange,</tspan><tspan x="587" dy="18.9">evidence, responsibility, stop and</tspan><tspan x="587" dy="18.9">non-commitment boundaries.</tspan></text><circle cx="996" cy="985" r="24" fill="#F6BE5C" stroke="#F6BE5C" stroke-width="1" opacity="1"/><text x="986" y="992" fill="#0B1F33" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" opacity="1"><tspan x="986" dy="0">03</tspan></text><text x="1032" y="982" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1"><tspan x="1032" dy="0">IMPLEMENTATION-LEVEL STATIONS</tspan></text><text x="1032" y="1016" fill="#CDE7EA" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" opacity="1"><tspan x="1032" dy="0">Named gates, handover, public/logistics</tspan><tspan x="1032" dy="18.9">flows, accessibility, isolation/e-stop,</tspan><tspan x="1032" dy="18.9">components and S01-S12.</tspan></text><rect x="55" y="1215" width="1390" height="365" rx="20" fill="#FFFFFF" stroke="#CBD7DF" stroke-width="2" opacity="1"/><text x="82" y="1260" fill="#0