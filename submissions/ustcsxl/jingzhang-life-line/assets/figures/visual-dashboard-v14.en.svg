<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1700" viewBox="0 0 1500 1700" role="img"><title>Jingzhang Life-Line v1.4</title><desc>Visible bilingual dashboard</desc><defs><marker id="arrowC" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#31C6D4"/></marker><marker id="arrowM" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#72E3B2"/></marker><marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F6BE5C"/></marker><marker id="arrowR" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF7A6E"/></marker></defs><rect width="100%" height="100%" fill="#071523"/><text x="55" y="80" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="48" font-weight="700" text-anchor="start" opacity="1"><tspan x="55" dy="0">JINGZHANG LIFE-LINE v1.4</tspan></text><text x="55" y="132" fill="#31C6D4" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" opacity="1"><tspan x="55" dy="0">ONE GRACEFUL-DEGRADATION LIFE-LINE | FIVE REGIONAL INTERFACES | THREE STATIONS | THREE FIRST-YEAR PILOTS</tspan></text><rect x="55" y="185" width="180" height="42" rx="12" fill="#0E2A42" stroke="#315C6B" stroke-width="1" opacity="1"/><text x="67" y="212" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1"><tspan x="67" dy="0">Overview Map</tspan></text><rect x="253" y="185" width="180" height="42" rx="12" fill="#0E2A42" stroke="#315C6B" stroke-width="1" opacity="1"/><text x="265" y="212" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" opacity="1"><tspan x="265" dy="0">Three-Level Scope</tspan></text><rect x="451" y="185" width="180" height="42" rx="12" fill="#0E2A42" stroke="#315C6B" stroke-width="1" opacity="1"/><text x="463