 + EXIT</text><text x="254" y="231" text-anchor="middle" font-size="10" fill="#667b8e">recover / remove / close</text><rect x="20" y="272" width="304" height="36" rx="9" fill="#0b263b"/><text x="36" y="295" font-size="10" font-weight="700" fill="#72e3b2">NORMAL</text><text x="104" y="295" font-size="10" font-weight="700" fill="#f6be5c">DEGRADED</text><text x="193" y="295" font-size="10" font-weight="700" fill="#ff7a6e">HUMAN</text><text x="258" y="295" font-size="9" fill="#fff">assist → bay → receipt</text></g></g>
<text x="48" y="466" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">12-WEEK CADENCE · BASELINE → OFFLINE DRILL → FAILURE → REPAIR → PUBLIC REVIEW → GO / CHANGE / STOP</text><g font-family="Arial,sans-serif" font-size="10"><rect x="48" y="488" width="172" height="54" rx="10" fill="#fff" stroke="#31c6d4" stroke-width="2"/><text x="62" y="511" fill="#31c6d4" font-weight="700">W1-2</text><text x="62" y="530" fill="#17324d">baseline + authority</text><rect x="234" y="488" width="172" height="54" rx="10" fill="#fff" stroke="#72e3b2" stroke-width="2"/><text x="248" y="511" fill="#72e3b2" font-weight="700">W3-4</text><text x="248" y="530" fill="#17324d">offline + human drill</text><rect x="420" y="488" width="172" height="54" rx="10" fill="#fff" stroke="#f6be5c" stroke-width="2"/><text x="434" y="511" fill="#f6be5c" font-weight="700">W5-7</text><text x="434" y="530" fill="#17324d">failure injection</text><rect x="606" y="488" width="172" height="54" rx="10" fill="#fff" stroke="#ff7a6e" stroke-width="2"/><text x="620" y="511" fill="#ff7a6e" font-weight="700">W8-9</text><text x="620" y="530" fill="#17324d">repair + retest</text><rect x="792" y="488" width="172" height="54" rx="10" fill="#fff" stroke="#5f8fd6" stroke-width="2"/><text x="806" y="511" fill="#5f8fd6" font-weight="700">W10-11</text><text x="806" y="530" fill="#17324d">public + independent review</text><rect x="978" y="488" width="174" height="54" rx="10" fill="#fff" stroke="#071a2b" stroke-width="2"/><text x="992" y="511" fill="#071a2b" font-weight="700">W12</text><text x="992" y="530" fill="#17324d">decision + exit receipt</text></g>
<g font-family="Arial,sans-serif"><rect x="48" y="574" width="522" height="130" rx="15" fill="#0b263b" stroke="#31c6d4" stroke-width="2"/><text x="68" y="604" fill="#fff" font-size="16" font-weight="700">SEVEN-SEAT SIGN-OFF CHAIN</text><text x="68" y="632" fill="#b9dce0" font-size="11">authorise · site / asset · service operations · independent safety</text><text x="68" y="653" fill="#b9dce0" font-size="11">tech / data custody · access / community · independent evaluation</text><text x="68" y="682" fill="#ff7a6e" font-size="10" font-weight="700">missing critical seat / supplier conflict → NO-GO</text><rect x="594" y="574" width="558" height="130" rx="15" fill="#f4f7f5" stroke="#f6be5c" stroke-width="2"/><text x="614" y="604" fill="#17324d" font-size="16" font-weight="700">12-ITEM PRE-OPENING FIELD AUDIT</text><text x="614" y="632" fill="#667b8e" font-size="11">site authority · ownership / operation · structure / fire · accessibility</text><text x="614" y="653" fill="#667b8e" font-size="11">crossing / traffic · rail protection · heritage · power / communications</text><text x="614" y="674" fill="#667b8e" font-size="11">drainage / heat · data / privacy · insurance / complaint · removal / reinstatement</text><text x="614" y="694" fill="#ff7a6e" font-size="9" font-weight="700">any missing statutory / safety review → desktop or isolated test only</text></g><text x="48" y="738" fill="#72e3b2" font-family="Arial,sans-serif" font-size="12" font-weight="700">NO-GO: missing site authority · failed E-stop · no staffed equivalent · no rollback / deletion / exit evidence</text></svg>
