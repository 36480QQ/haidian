<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">JZ-LIFE v1.4 station components and twelve-week evidence cadence</title><desc id="d">Named spatial components, normal-degraded-human handover states, a twelve-week cadence, seven-seat sign-off and twelve field audits.</desc><rect width="1200" height="760" fill="#071523"/><text x="48" y="49" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">THREE STATIONS · NAMED COMPONENTS · 12-WEEK EVIDENCE SPRINT</text><text x="48" y="76" fill="#8bcfd5" font-family="Arial,sans-serif" font-size="14">Normal → degraded → human handover · missing evidence keeps public functions closed</text><text x="1150" y="59" text-anchor="end" fill="#f6be5c" font-family="Arial,sans-serif" font-size="14" font-weight="700">JZ-LIFE / v1.4</text>
