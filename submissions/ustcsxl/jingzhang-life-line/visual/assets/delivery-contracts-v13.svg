<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">JZ-LIFE regional and implementation contracts</title>
  <desc id="desc">Five regional handover interfaces, three first-year pilots, seven responsibility seats and eight lifecycle cost gates.</desc>
  <rect width="1200" height="760" fill="#F4F7F5"/>
  <text x="54" y="62" fill="#0B1F33" font-family="sans-serif" font-size="34" font-weight="700">FROM REGIONAL SYNERGY TO A YEAR-ONE GO / NO-GO DECISION</text>
  <text x="54" y="94" fill="#647789" font-family="sans-serif" font-size="16">Concept contracts only · no institutional partnership, funding or approval is claimed</text>
  <g transform="translate(54 126)">
    <text x="0" y="0" fill="#0B1F33" font-family="sans-serif" font-size="20" font-weight="700">5 AUDITABLE HANDOVER INTERFACES</text>
    <g transform="translate(0 22)">
      <rect width="208" height="110" rx="14" fill="#DFF7F4" stroke="#31C6D4" stroke-width="2"/><text x="18" y="30" fill="#17324D" font-family="sans-serif" font-size="15" font-weight="700">BEIWEI COMMUNITY</text><text x="18" y="56" fill="#647789" font-family="sans-serif" font-size="12">account-free service kit</text><text x="18" y="77" fill="#647789" font-family="sans-serif" font-size="12">access audit register</text><text x="18" y="98" fill="#647789" font-family="sans-serif" font-size="12">human handover record</text>
      <rect x="222" width="208" height="110" rx="14" fill="#E6F0FF" stroke="#4B86D8" stroke-width="2"/><text x="240" y="30" fill="#17324D" font-family="sans-serif" font-size="15" font-weight="700">FUTURE SCIENCE CITY</text><text x="240" y="56" fill="#647789" font-family="sans-serif" font-size="12">heat / energy protocol</text><text x="240" y="77" fill="#647789" font-family="sans-serif" font-size="12">non-sensitive data dictionary</text><text x="240" y="98" fill="#647789" font-family="sans-serif" font-size="12">method version</text>
      <rect x="444" width="208" height="110" rx="14" fill="#F0E9FF" stroke="#8A69C7" stroke-width="2"/><text x="462" y="30" fill="#17324D" font-family="sans-serif" font-size="15" font-weight="700">HUAIROU SCIENCE CITY</text><text x="462" y="56" fill="#647789" font-family="sans-serif" font-size="12">calibration protocol</text><text x="462" y="77" fill="#647789" font-family="sans-serif" font-size="12">uncertainty template</text><text x="462" y="98" fill="#647789" font-family="sans-serif" font-size="12">independent retest</text>
      <rect x="666" width="208" height="110" rx="14" fill="#FFF0D8" stroke="#F6BE5C" stroke-width="2"/><text x="684" y="30" fill="#17324D" font-family="sans-serif" font-size="15" font-weight="700">BEIJING E-TOWN</text><text x="684" y="56" fill="#647789" font-family="sans-serif" font-size="12">urban admission checklist</text><text x="684" y="77" fill="#647789" font-family="sans-serif" font-size="12">repair / recall / exit</text><text x="684" y="98" fill="#647789" font-family="sans-serif" font-size="12">bounded test record</text>
      <rect x="888" width="208" height="110" rx="14" fill="#FFE1DD" stroke="#FF7A6E" stroke-width="2"/><text x="906" y="30" fill="#17324D" font-family="sans-serif" font-size="15" font-weight="700">BTH / ZHANGJIAKOU</text><text x="906" y="56" fill="#647789" font-family="sans-serif" font-size="12">stress / recovery record</text><text x="906" y="77" fill="#647789" font-family="sans-serif" font-size="12">non-sensitive scheduling</text><text x="906" y="98" fill="#647789" font-family="sans-serif" font-size="12">receipt confirmation</text>
    </g>
  </g>
  <g transform="translate(54 314)">
    <text x="0" y="0" fill="#0B1F33" font-family="sans-serif" font-size="20" font-weight="700">3 REVERSIBLE FIRST-YEAR PILOTS · 12 WEEKS EACH</text>
    <rect y="24" width="344" height="138" rx="16" fill="#0B1F33"/><text x="22" y="56" fill="#72E3B2" font-family="sans-serif" font-size="18" font-weight="700">PILOT-A · AI ORIGIN</text><text x="22" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="14">climate care + offline public service</text><text x="22" y="108" fill="#B9DCE0" font-family="sans-serif" font-size="12">evidence: source / human path / complaint / repair</text><text x="22" y="136" fill="#FF7A6E" font-family="sans-serif" font-size="12">STOP: unstaffed desk or unverifiable high-risk advice</text>
    <rect x="376" y="24" width="344" height="138" rx="16" fill="#0B1F33"/><text x="398" y="56" fill="#31C6D4" font-family="sans-serif" font-size="18" font-weight="700">PILOT-B · ZHONGZHIYUAN</text><text x="398" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="14">failure injection + rollback laboratory</text><text x="398" y="108" fill="#B9DCE0" font-family="sans-serif" font-size="12">evidence: version / fault / handover / delete / retest</text><text x="398" y="136" fill="#FF7A6E" font-family="sans-serif" font-size="12">STOP: production connection or missing audit log</text>
    <rect x="752" y="24" width="344" height="138" rx="16" fill="#0B1F33"/><text x="774" y="56" fill="#F6BE5C" font-family="sans-serif" font-size="18" font-weight="700">PILOT-C · DAZHONGSI</text><text x="774" y="84" fill="#FFFFFF" font-family="sans-serif" font-size="14">continuity relay + manual receipt</text><text x="774" y="108" fill="#B9DCE0" font-family="sans-serif" font-size="12">evidence: route / E-stop / recovery / feedback / exit</text><text x="774" y="136" fill="#FF7A6E" font-family="sans-serif" font-size="12">STOP: unauthorised route or any failed E-stop</text>
  </g>
  <g transform="translate(54 548)">
    <rect width="520" height="134" rx="18" fill="#E8F7F6" stroke="#31C6D4" stroke-width="2"/><text x="22" y="34" fill="#17324D" font-family="sans-serif" font-size="19" font-weight="700">7 NON-SUBSTITUTABLE RESPONSIBILITY SEATS</text><text x="22" y="63" fill="#647789" font-family="sans-serif" font-size="13">decision · site / asset · service operations · independent safety</text><text x="22" y="87" fill="#647789" font-family="sans-serif" font-size="13">technical / data · accessibility / community · independent evaluation</text><text x="22" y="114" fill="#FF7A6E" font-family="sans-serif" font-size="13" font-weight="700">missing a critical seat keeps high-risk functions closed</text>
    <rect x="548" width="548" height="134" rx="18" fill="#FFF0D8" stroke="#F6BE5C" stroke-width="2"/><text x="570" y="34" fill="#17324D" font-family="sans-serif" font-size="19" font-weight="700">8 FIVE-YEAR LIFECYCLE COST GATES</text><text x="570" y="63" fill="#647789" font-family="sans-serif" font-size="13">space / equipment · staffing · energy / comms · software / licence</text><text x="570" y="87" fill="#647789" font-family="sans-serif" font-size="13">maintenance / spares · accessibility / communication · insurance / review</text><text x="570" y="111" fill="#647789" font-family="sans-serif" font-size="13">decommissioning + data exit</text><text x="570" y="130" fill="#FF7A6E" font-family="sans-serif" font-size="12" font-weight="700">no TCO, budget source and exit cost → no permanence</text>
  </g>
</svg>
