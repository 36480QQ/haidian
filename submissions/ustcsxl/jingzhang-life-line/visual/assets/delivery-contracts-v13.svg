nslate(714 145)"><rect width="204" height="118" rx="14" fill="#fff" stroke="#f6be5c" stroke-width="2"/><rect x="14" y="14" width="42" height="30" rx="8" fill="#f6be5c"/><text x="35" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#071a2b">R4</text><text x="68" y="34" font-size="14" font-weight="700" fill="#17324d">BEIJING E-TOWN</text><text x="16" y="67" font-size="11" fill="#667b8e">urban admission · bounded test</text><text x="16" y="88" font-size="11" fill="#667b8e">repair / recall / exit receipt</text><text x="188" y="107" text-anchor="end" font-size="9" font-weight="700" fill="#f6be5c">GO / NO-GO</text></g><g transform="translate(936 145)"><rect width="204" height="118" rx="14" fill="#fff" stroke="#ff7a6e" stroke-width="2"/><rect x="14" y="14" width="42" height="30" rx="8" fill="#ff7a6e"/><text x="35" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#071a2b">R5</text><text x="68" y="34" font-size="14" font-weight="700" fill="#17324d">BTH / ZHANGJIAKOU</text><text x="16" y="67" font-size="11" fill="#667b8e">stress-recovery · compatibility</text><text x="16" y="88" font-size="11" fill="#667b8e">handoff receipt</text><text x="188" y="107" text-anchor="end" font-size="9" font-weight="700" fill="#ff7a6e">GO / NO-GO</text></g></g>
