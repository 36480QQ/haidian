<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">JZ-LIFE v1.4 regional and delivery contracts</title><desc id="d">Five auditable regional interfaces, three first-year reversible pilots, seven responsibility seats, eight lifecycle cost gates and eight service targets.</desc><rect width="1200" height="760" fill="#f4f7f5"/><rect width="1200" height="94" fill="#071a2b"/><text x="48" y="48" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">5 HANDOFF INTERFACES × 3 PILOTS × 7 RESPONSIBILITY SEATS</text><text x="48" y="75" fill="#31c6d4" font-family="Arial,sans-serif" font-size="14">Evidence before partnership claims · acceptance before expansion · exit before permanence</text><text x="1150" y="60" text-anchor="end" fill="#f6be5c" font-family="Arial,sans-serif" font-size="14" font-weight="700">JZ-LIFE / v1.4</text>
<text x="48" y="126" fill="#17324d" font-family="Arial,sans-serif" font-size="18" font-weight="700">01 · FIVE REGIONAL HANDOFFS</text>
