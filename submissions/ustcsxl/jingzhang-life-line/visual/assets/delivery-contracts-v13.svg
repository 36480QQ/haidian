<text x="48" y="354" fill="#17324d" font-family="Arial,sans-serif" font-size="18" font-weight="700">02 · THREE REVERSIBLE FIRST-YEAR PILOTS · 12 WEEKS EACH</text><g font-family="Arial,sans-serif"><g transform="translate(48 374)"><rect width="346" height="148" rx="16" fill="#0b263b"/><text x="20" y="31" font-size="15" font-weight="700" fill="#72e3b2">PILOT-A · AI ORIGIN</text><text x="20" y="60" font-size="16" font-weight="700" fill="#fff">CARE + HUMAN HANDOVER</text><text x="20" y="88" font-size="11" fill="#b9dce0">timestamp · account-free path · access walk</text><text x="20" y="110" font-size="11" fill="#b9dce0">5-min acknowledgement · complaint / repair</text><rect x="16" y="119" width="314" height="20" rx="6" fill="#ff7a6e"/><text x="173" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#071a2b">NO STAFF / UNVERIFIABLE ADVICE → STOP</text></g><g transform="translate(427 374)"><rect width="346" height="148" rx="16" fill="#0b263b"/><text x="20" y="31" font-size="15" font-weight="700" fill="#31c6d4">PILOT-B · ZHONGZHIYUAN</text><text x="20" y="60" font-size="16" font-weight="700" fill="#fff">FAILURE INJECTION + ROLLBACK</text><text x="20" y="88" font-size="11" fill="#b9dce0">version · fault · handover · rollback · delete</text><text x="20" y="110" font-size="11" fill="#b9dce0">E-stop 100% · independent retest</text><rect x="16" y="119" width="314" height="20" rx="6" fill="#ff7a6e"/><text x="173" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#071a2b">PRODUCTION LINK / FAILED E-STOP / NO LOG → STOP</text></g><g transform="translate(806 374)"><rect width="346" height="148" rx="16" fill="#0b263b"/><text x="20" y="31" font-size="15" font-weight="700" fill="#f6be5c">PILOT-C · DAZHONGSI</text><text x="20" y="60" font-size="16" font-weight="700" fill="#fff">CONTINUITY RELAY + MANUAL RECEIPT</text><text x="20" y="88" font-size="11" fill="#b9dce0">authorised window · route · receipt · recovery</text><text x="20" y="110" font-size="11" fill="#b9dce0">public priority · reinstatement / exit</text><rect x="16" y="119" width="314" height="20" rx="6" fill="#ff7a6e"/><text x="173" y="134" text-anchor="middle" font-size="9" font-weight="700" fill="#071a2b">UNAUTHORISED ROUTE / FAILED E-STOP / BLOCKAGE → STOP</text></g></g>
<text x="48" y="558" fill="#17324d" font-family="Arial,sans-serif" font-size="18" font-weight="700">03 · RESPONSIBILITY, LIFECYCLE COST AND SERVICE ACCEPTANCE</text><g font-family="Arial,sans-serif"><rect x="48" y="578" width="350" height="142" rx="15" fill="#fff" stroke="#31c6d4" stroke-width="2"/><text x="68" y="607" font-size="16" font-weight="700" fill="#17324d">7 NON-SUBSTITUTABLE SEATS</text><text x="68" y="634" font-size="11" fill="#667b8e">authorise · site / asset · service operations</text><text x="68" y="655" font-size="11" fill="#667b8e">independent safety · tech / data custody</text><text x="68" y="676" font-size="11" fill="#667b8e">access / community · independent evaluation</text><text x="68" y="703" font-size="10" font-weight="700" fill="#ff7a6e">supplier ≠ independent safety / evaluation</text><rect x="425" y="578" width="350" height="142" rx="15" fill="#fff" stroke="#f6be5c" stroke-width="2"/><text x="445" y="607" font-size="16" font-weight="700" fill="#17324d">8 FIVE-YEAR COST GATES</text><text x="445" y="634" font-size="11" fill="#667b8e">space · equipment · staff · energy / comms</text><text x="445" y="655" font-size="11" fill="#667b8e">software / migration · accessibility / participation</text><text x="445" y="676" font-size="11" fill="#667b8e">insurance / review · decommission / exit</text><text x="445" y="703" font-size="10" font-weight="700" fill="#ff7a6e">no P50/P80 + budget owner + exit cost → no permanence</text><rect x="802" y="578" width="350" height="142" rx="15" fill="#0b263b" stroke="#ff7a6e" stroke-width="2"/><text x="822" y="607" font-size="16" font-weight="700" fill="#fff">8 CONCEPT SERVICE TARGETS</text><text x="822" y="634" font-size="11" fill="#fff">5-min acknowledgement · 15-min full handover</text><text x="822" y="655" font-size="11" fill="#fff">100% timestamps · E-stop / rollback · manual equivalent</text><text x="822" y="676" font-size="11" fill="#fff">24h incident log · 2-workday complaint acknowledgement</text><text x="822" y="697" font-size="11" fill="#fff">12-item pre-opening field audit</text><text x="822" y="714" font-size="9" font-weight="700" fill="#f6be5c">targets ≠ current performance / legal deadline</text></g><text x="48" y="746" fill="#667b8e" font-family="Arial,sans-serif" font-size="10" font-weight="700">CONCEPT / PROVISIONAL · NO INSTITUTIONAL COMMITMENT CLAIMED</text></svg>
