<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-labelledby="jzg-t jzg-d">
  <title id="jzg-t">京张公制标志 / The Jing-Zhang Gauge mark</title>
  <desc id="jzg-d">两条平行线与一道横向刻度标记：同时读作轨距断面、度量刻度与版本线。横向刻度使用版本色。Two parallel lines crossed by one horizontal measure tick: read at once as a track-gauge section, a measuring scale, and the version line. The tick carries the version colour.</desc>
  <rect width="120" height="120" fill="none"/>
  <!-- 两条平行线：轨距的两根轨 / the two rails of the gauge -->
  <rect x="41" y="12" width="7" height="96" fill="#17262E"/>
  <rect x="72" y="12" width="7" height="96" fill="#17262E"/>
  <!-- 横向刻度标记：量的动作，刷当前版本色 / the measure tick, painted in the current version colour -->
  <rect x="26" y="56" width="68" height="8" fill="#C2431F"/>
  <!-- 端点刻度：读数落点 / end ticks marking where the reading lands -->
  <rect x="26" y="46" width="3" height="28" fill="#C2431F"/>
  <rect x="91" y="46" width="3" height="28" fill="#C2431F"/>
</svg>
