<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640"
     role="img" aria-labelledby="idt idd">
  <title id="idt">京张公制视觉识别用法表 / The Jing-Zhang Gauge identity usage sheet</title>
  <desc id="idd">标志构成、双语组合、版本色延展、留白与最小尺寸、单色与反白变体的用法规定。Construction, bilingual lockup, version-colour extension, clear space and minimum size, monochrome and reversed variants.</desc>
  <style>
    .t{font-family:"Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
    .m{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK SC","Noto Sans CJK SC",monospace}
    .h{font-size:11px;font-weight:600;letter-spacing:.14em;fill:#64757C}
    .lbl{font-size:12.5px;fill:#17262E}
    .sub{font-size:10.5px;fill:#64757C}
    .rule{stroke:#C3C7C0;stroke-width:1}
  </style>
  <rect width="960" height="640" fill="#F2F3F0"/>
  <text class="m h" x="40" y="42">JZ-GAUGE VISUAL IDENTITY</text>
  <text class="t h" x="920" y="42" text-anchor="end">京张公制视觉识别系统</text>
  <line class="rule" x1="40" y1="56" x2="920" y2="56"/>

  <!-- 01 构成 -->
  <text class="m h" x="40" y="86">01 CONSTRUCTION</text>
  <text class="t h" x="500" y="86" text-anchor="end">构成</text>
  <g transform="translate(40,100)">
    <rect x="41" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="72" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="26" y="56" width="68" height="8" fill="#C2431F"/>
    <rect x="26" y="46" width="3" height="28" fill="#C2431F"/>
    <rect x="91" y="46" width="3" height="28" fill="#C2431F"/>
  </g>
  <text class="t lbl" x="180" y="128">两条平行线 = 轨距的两根轨</text>
  <text class="t sub" x="180" y="146">Two parallel lines: the two rails</text>
  <text class="t lbl" x="180" y="178">一道横向刻度 = 量的动作</text>
  <text class="t sub" x="180" y="196">One measure tick, in the version colour</text>

  <!-- 02 双语组合 -->
  <text class="m h" x="530" y="86">02 LOCKUP</text>
  <text class="t h" x="920" y="86" text-anchor="end">双语组合</text>
  <g transform="translate(530,104) scale(0.62)">
    <rect x="41" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="72" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="26" y="56" width="68" height="8" fill="#C2431F"/>
    <rect x="26" y="46" width="3" height="28" fill="#C2431F"/>
    <rect x="91" y="46" width="3" height="28" fill="#C2431F"/>
  </g>
  <text class="t" x="620" y="150" font-size="30" font-weight="700" fill="#17262E">京张公制</text>
  <text class="m" x="621" y="172" font-size="12" letter-spacing=".16em" fill="#64757C">THE JING-ZHANG GAUGE</text>
  <text class="t sub" x="620" y="198">标志可单独使用，文字不可单独充当标志</text>

  <text class="t sub" x="40" y="236">标志不含拟人化形象、神经网络球、发光大脑与渐变。横向组合用于页眉、图板与规格标牌。</text>
  <text class="t sub" x="40" y="254">No mascot, neural-net sphere, glowing brain, or gradient. The lockup is for headers, boards, and spec plates.</text>

  <line class="rule" x1="40" y1="276" x2="920" y2="276"/>

  <!-- 03 版本色延展 -->
  <text class="m h" x="40" y="306">03 VERSION-COLOUR EXTENSION</text>
  <text class="t h" x="920" y="306" text-anchor="end">版本色延展</text>
  <g>
    <rect x="40" y="320" width="118" height="52" fill="#C2431F"/>
    <text class="m" x="48" y="342" font-size="12" fill="#F2F3F0">v0.1</text>
    <text class="m" x="48" y="361" font-size="10" fill="#F2F3F0">#C2431F</text>
    <rect x="170" y="320" width="118" height="52" fill="#2C6B62"/>
    <text class="m" x="178" y="342" font-size="12" fill="#F2F3F0">v0.2</text>
    <text class="m" x="178" y="361" font-size="10" fill="#F2F3F0">#2C6B62</text>
    <rect x="300" y="320" width="118" height="52" fill="#8A6A16"/>
    <text class="m" x="308" y="342" font-size="12" fill="#F2F3F0">v0.3</text>
    <text class="m" x="308" y="361" font-size="10" fill="#F2F3F0">#8A6A16</text>
    <rect x="430" y="320" width="118" height="52" fill="none" stroke="#C3C7C0" stroke-dasharray="4 4"/>
    <text class="t" x="438" y="344" font-size="11" fill="#64757C">下一版待定</text>
    <text class="m" x="438" y="362" font-size="10" fill="#64757C">next TBD</text>
  </g>
  <text class="t sub" x="40" y="396">每个规范版本对应一个色号，横向刻度与实体标准件同时刷该色；版本色是唯一强调色，其余一律钢灰与道砟色。</text>
  <text class="t sub" x="40" y="414">One colour per specification version, carried by both the tick and the physical standard parts; it is the only accent in the system.</text>
  <text class="t sub" x="40" y="432">色号为本方案概念建议，不构成已确定的版本发布计划。Colour values are a conceptual proposal, not a confirmed release plan.</text>

  <line class="rule" x1="40" y1="456" x2="920" y2="456"/>

  <!-- 04 留白与最小尺寸 -->
  <text class="m h" x="40" y="486">04 CLEAR SPACE / MIN SIZE</text>
  <text class="t h" x="500" y="486" text-anchor="end">留白与最小尺寸</text>
  <g transform="translate(40,500)">
    <rect x="0" y="0" width="104" height="104" fill="none" stroke="#C3C7C0" stroke-dasharray="4 4"/>
    <g transform="translate(18,18) scale(0.57)">
      <rect x="41" y="12" width="7" height="96" fill="#17262E"/>
      <rect x="72" y="12" width="7" height="96" fill="#17262E"/>
      <rect x="26" y="56" width="68" height="8" fill="#C2431F"/>
      <rect x="26" y="46" width="3" height="28" fill="#C2431F"/>
      <rect x="91" y="46" width="3" height="28" fill="#C2431F"/>
    </g>
  </g>
  <text class="t sub" x="162" y="524">四周留白 ≥ 两轨间距</text>
  <text class="t sub" x="162" y="542">最小使用尺寸 16 px / 8 mm，小于此尺寸时去掉端点刻度</text>
  <text class="t sub" x="162" y="560">禁止拉伸、旋转、加投影、换字体、在标志内嵌入照片</text>
  <text class="t sub" x="162" y="578">Clear space ≥ rail spacing; min 16 px / 8 mm; no stretch,</text>
  <text class="t sub" x="162" y="596">rotation, shadow, substitute typeface, or photo fill.</text>

  <!-- 05 单色与反白 -->
  <text class="m h" x="620" y="486">05 MONO / REVERSED</text>
  <text class="t h" x="920" y="486" text-anchor="end">单色与反白</text>
  <g transform="translate(620,500) scale(0.57)">
    <rect x="41" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="72" y="12" width="7" height="96" fill="#17262E"/>
    <rect x="26" y="56" width="68" height="8" fill="#17262E"/>
    <rect x="26" y="46" width="3" height="28" fill="#17262E"/>
    <rect x="91" y="46" width="3" height="28" fill="#17262E"/>
  </g>
  <g transform="translate(712,500)">
    <rect x="0" y="0" width="72" height="72" fill="#17262E"/>
    <g transform="translate(2,2) scale(0.57)">
      <rect x="41" y="12" width="7" height="96" fill="#F2F3F0"/>
      <rect x="72" y="12" width="7" height="96" fill="#F2F3F0"/>
      <rect x="26" y="56" width="68" height="8" fill="#F2F3F0"/>
      <rect x="26" y="46" width="3" height="28" fill="#F2F3F0"/>
      <rect x="91" y="46" width="3" height="28" fill="#F2F3F0"/>
    </g>
  </g>
  <text class="t sub" x="620" y="600">单色用于刻印与铸件，反白用于深色标牌</text>
  <text class="t sub" x="620" y="618">Mono for engraving and casting; reversed for dark plates</text>
</svg>
