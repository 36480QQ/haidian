<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Four-state spatial relations across three prototypes</title><desc id="desc">Zhongzhiyuan stops an upper proof court while its bypass remains clear. Origin Community withdraws four nodes along one resident street. Dazhongsi stops an off-route service side while its commuter cross stays open. Recovery is never authorization.</desc>
<defs><style>.s{font-family:"Segoe UI","Noto Sans",sans-serif}.ink{fill:#102A43}.muted{fill:#526675}.micro{font-size:15px;font-weight:700}.small{font-size:18px;font-weight:750}.body{font-size:20px;font-weight:800}.label{font-size:23px;font-weight:900}.head{font-size:34px;font-weight:900}.kicker{font-size:17px;font-weight:900;letter-spacing:1.5px}.ordinary{stroke:#087E68}.proof{stroke:#167FA5}.failure{stroke:#D75D45}.cap{stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:13 10}</style><marker id="g" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L15 8L1 15Z" fill="#087E68"/></marker><marker id="r" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L15 8L1 15Z" fill="#D75D45"/></marker></defs>
<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/><text x="56" y="50" class="s kicker" fill="#D6A21D">FOUR STATES ARE SPATIAL RELATIONS · G0 · PROVISIONAL · NOT TO SCALE</text><text x="56" y="105" class="s head" fill="#FFF">One civic baseline; different stop objects, handoffs and restoration objects</text><text x="1740" y="103" class="s micro" fill="#F8D56A" text-anchor="end">Concept relations, not real recovery duration, authorization or approval</text><path d="M584 204L584 900M1216 204L1216 900" stroke="#C7D0CC" stroke-width="2" stroke-dasharray="8 12"/>
<g data-place-root="zhongzhiyuan" data-composition="parallel-section-four-state"><text x="70" y="208" class="s kicker" fill="#087E68">01 VERIFY · ZHONGZHIYUAN</text><text x="70" y="244" class="s label ink">Bypass below / proof court above</text><text x="70" y="275" class="s small muted">The upper side layer stops; lower ordinary movement stays clear.</text><path d="M105 705C220 665 352 720 510 682" fill="none" stroke="#DFF1EA" stroke-width="46" class="cap"/><path d="M105 705C220 665 352 720 510 682" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#g)"/><text x="105" y="758" class="s body" fill="#087E68">01 ORDINARY: BYPASS CONTINUES</text><rect x="134" y="405" width="342" height="170" rx="78" fill="#DCEEF4" stroke="#167FA5" stroke-width="6" stroke-dasharray="16 10"/><path d="M182 490H428" class="proof cap" stroke-width="8" stroke-dasharray="13 9"/><text x="305" y="454" class="s body" fill="#167FA5" text-anchor="middle">02 PROOF: SIDE COURT</text><circle cx="154" cy="630" r="28" fill="#FFF7E6" stroke="#B77A13" stroke-width="3"/><text x="154" y="638" class="s label" fill="#B77A13" text-anchor="middle">H</text><text x="198" y="638" class="s body ink">STAFFED HANDOFF</text><path d="M389 382C474 410 490 493 439 540" fill="none" class="failure cap" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#r)"/><path d="M420 553l22-22 22 22-22 22z" fill="#F8E4DE" stroke="#D75D45" stroke-width="4"/><text x="92" y="816" class="s micro" fill="#D75D45">03 FAILURE: court equipment and enclosure leave; bypass stays clear.</text><text x="92" y="852" class="s micro ink">04 RECOVERY: recheck court and environment; not authorization or restart.</text></g>
<g data-place-root="origin-community" data-composition="street-courts-nodes-four-state"><text x="622" y="208" class="s kicker" fill="#B77A13">02 CO-CREATE · ORIGIN COMMUNITY</text><text x="622" y="244" class="s label ink">One street / two courts / four nodes</text><text x="622" y="275" class="s small muted">Withdraw a node, not a shared civic timeline.</text><path d="M635 710C735 630 812 748 910 681S1085 630 1170 706" fill="none" stroke="#DFF1EA" stroke-width="46" class="cap"/><path d="M635 710C735 630 812 748 910 681S1085 630 1170 706" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#g)"/><text x="640" y="764" class="s body" fill="#087E68">01 ORDINARY: RESIDENT STREET</text><path d="M690 425L784 354 878 425V555H690Z" fill="#FFF9EB" stroke="#B77A13" stroke-width="5"/><path d="M953 488L1047 417 1141 488V618H953Z" fill="#EEF8FB" stroke="#167FA5" stroke-width="5"/><text x="784" y="476" class="s body" fill="#B77A13" text-anchor="middle">PROBLEM COURT</text><text x="1047" y="542" class="s body" fill="#167FA5" text-anchor="middle">REVIEW COURT</text><path d="M662 382C784 308 1018 319 1165 437" fill="none" class="proof cap dash" stroke-width="6"/><rect x="760" y="314" width="300" height="38" rx="14" fill="#F5F1E8"/><text x="910" y="341" class="s body" fill="#167FA5" text-anchor="middle">02 PROOF: TWO COURTS</text><g fill="#FFF" stroke="#D75D45" stroke-width="4"><circle cx="745" cy="679" r="20"/><circle cx="842" cy="715" r="20"/><circle cx="957" cy="678" r="20"/><circle cx="1064" cy="663" r="20"/></g><text x="745" y="686" class="s body" fill="#D75D45" text-anchor="middle">1</text><text x="842" y="722" class="s body" fill="#D75D45" text-anchor="middle">2</text><text x="957" y="685" class="s body" fill="#D75D45" text-anchor="middle">3</text><text x="1064" y="670" class="s body" fill="#D75D45" text-anchor="middle">4</text><rect x="668" y="790" width="270" height="62" rx="17" fill="#DDEEF4" stroke="#167FA5" stroke-width="3"/><text x="803" y="828" class="s body" fill="#167FA5" text-anchor="middle">PAPER / ORAL HANDOFF</text><text x="622" y="888" class="s micro" fill="#D75D45">03 FAILURE: nodes 1—4 withdraw; street and daily court use remain.</text><text x="622" y="922" class="s micro ink">04 RECOVERY: temporary layer leaves; quiet resident use returns first.</text></g>
<g data-place-root="dazhongsi" data-composition="commuter-cross-service-siding-four-state"><text x="1254" y="208" class="s kicker" fill="#D75D45">03 PUBLISH · DAZHONGSI</text><text x="1254" y="244" class="s label ink">Commuter cross / service side</text><text x="1254" y="275" class="s small muted">Hall, desk and rest stay outside the commuter route.</text><circle cx="1491" cy="620" r="76" fill="#DFF1EA"/><path d="M1284 620H1712M1491 400V838" fill="none" class="ordinary cap" stroke-width="25"/><circle cx="1491" cy="620" r="40" fill="#FFF" stroke="#087E68" stroke-width="6"/><text x="1491" y="886" class="s body" fill="#087E68" text-anchor="middle">01 ORDINARY: COMMUTE CONTINUES</text><rect x="1260" y="404" width="190" height="116" rx="40" fill="#FFF4D9" stroke="#B77A13" stroke-width="5" stroke-dasharray="14 9"/><text x="1355" y="451" class="s body" fill="#B77A13" text-anchor="middle">02 OFF-ROUTE HALL</text><text x="1355" y="479" class="s small" fill="#B77A13" text-anchor="middle">source · correction</text><rect x="1574" y="722" width="166" height="90" rx="20" fill="#DDEEF4" stroke="#167FA5" stroke-width="4"/><text x="1657" y="777" class="s body" fill="#167FA5" text-anchor="middle">STAFFED DESK</text><rect x="1255" y="742" width="230" height="70" rx="34" fill="#FFF" stroke="#6B7280" stroke-width="3"/><text x="1370" y="784" class="s body" fill="#526675" text-anchor="middle">QUIET REST</text><path d="M1280 545H1454" class="failure cap" stroke-width="7" stroke-dasharray="8 8"/><path d="M1390 514C1450 492 1472 520 1478 570" fill="none" class="failure cap" stroke-width="4" marker-end="url(#r)"/><text x="1254" y="931" class="s micro" fill="#D75D45">03 FAILURE: service side stops; staff preserves a non-AI route.</text><text x="1254" y="965" class="s micro ink">04 RECOVERY: correct source and retest; never authorization.</text></g>
<rect x="52" y="982" width="1696" height="68" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1010" class="s micro ink">All three share ordinary-first, stoppable overlay, staffed takeover and ordinary-place restoration; their ordinary line, failure object and restoration object are not interchangeable.</text><text x="76" y="1036" class="s micro" fill="#9A3F2F">LIMITS: dimensions, materials, connections, anchors, specialist conditions and real recovery duration are unknown; FIELD / GO / APPROVAL = 0; RIGHTS = not_fully_cleared.</text><text x="1745" y="1081" class="s micro" fill="#D75D45" text-anchor="end">G0 concept relation diagram, not engineering section, existing condition, restoration acceptance or restart authorization.</text>
<rect x="40" y="59" width="1040" height="66" fill="#102A43"/><text x="56" y="105" class="s head" fill="#FFF">Ordinary first; side layers stop differently</text>
<rect x="52" y="982" width="1696" height="68" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1010" class="s micro ink">All share ordinary-first, stoppable overlay, staffed takeover and ordinary-place restoration; their ordinary line, failure object and restoration object are not interchangeable.</text><text x="76" y="1036" class="s micro" fill="#9A3F2F">LIMITS: scale, dimensions, materials, connections, anchors, specialist conditions and real recovery duration unknown. FIELD / GO / APPROVAL = 0 · RIGHTS = not_fully_cleared.</text>
<rect x="0" y="60" width="1800" height="82" fill="#102A43"/><text x="56" y="105" class="s head" fill="#FFF">Ordinary first; side layers stop differently</text><text x="1740" y="103" class="s micro" fill="#F8D56A" text-anchor="end">Concept relations, not real recovery duration, authorization or approval</text>
<rect x="0" y="976" width="1800" height="74" fill="#F5F1E8"/><rect x="52" y="982" width="1696" height="68" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1010" class="s micro ink">All share ordinary-first, stoppable overlay, staffed takeover and ordinary-place restoration; their ordinary line, failure object and restoration object are not interchangeable.</text><text x="76" y="1036" class="s micro" fill="#9A3F2F">LIMITS: scale, dimensions, materials, connections, anchors, specialist conditions and real recovery duration unknown. FIELD / GO / APPROVAL = 0 · RIGHTS = not_fully_cleared.</text>
<rect x="50" y="255" width="1700" height="32" fill="#F5F1E8"/><text x="70" y="275" class="s small muted">Upper side layer stops; bypass clear.</text><text x="622" y="275" class="s small muted">Withdraw a node; no shared timeline.</text><text x="1254" y="275" class="s small muted">Service stays off commuter route.</text>
</svg>
