<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S03 / THREE PLAN PROTOTYPES / 三处平面</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">一次空间裁决，三处给出不可互换的答案</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">共同裁决：验证不得接管普通地面；三处分别用旁置、退院、路外作出不同空间回答。G0 · 临时关系 · 非批准。</text>
