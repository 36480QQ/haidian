<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">一次空间裁决，三处给出不可互换的答案</title><desc id="desc">三处概念平面分别拒绝验证穿越普通路径、验证节点占用居民街和服务设施占据通勤中心，并保留旁置证明园、退后两院和路外人工服务。</desc>
<defs>
