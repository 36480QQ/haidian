<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">双轨京张：三处不可互换的空间原型</title>
  <desc id="desc">众智园以普通绕行与平行验证庭分离；原点社区以一街串联两院和四个可撤回节点；大钟寺以四向通勤十字保留路外发布厅、人工台和安静休憩。均为 G0 概念关系，不按比例。</desc>
  <defs>
    <style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}.ink{fill:#102A43}.muted{fill:#526675}.micro{font-size:16px;font-weight:700}.small{font-size:20px;font-weight:750}.body{font-size:22px;font-weight:750}.label{font-size:25px;font-weight:850}.head{font-size:36px;font-weight:900}.kicker{font-size:17px;font-weight:900;letter-spacing:1.5px}.ordinary{stroke:#087E68}.proof{stroke:#167FA5}.failure{stroke:#D75D45}.restore{stroke:#6B7280}.dash{stroke-dasharray:14 10}.cap{stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="greenArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087E68"/></marker><marker id="blueArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#167FA5"/></marker><marker id="coralArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#D75D45"/></marker>
  </defs>
  <rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
  <text x="56" y="50" class="sans kicker" fill="#D6A21D">TWIN-TRACK JING-ZHANG · G0 RELATION DIAGRAM · PROVISIONAL · NOT TO SCALE</text>
  <text x="56" y="105" class="sans head" fill="#FFFFFF">三处普通路径先成立，验证、故障与恢复各自落在不同空间关系里</text>
  <text x="1740" y="103" class="sans micro" fill="#F8D56A" text-anchor="end">概念关系，不表示现状建筑、法定边界、批准方案或建设承诺</text>
  <path d="M585 210 L585 892 M1215 210 L1215 892" stroke="#C7D0CC" stroke-width="2" stroke-dasharray="8 12"/>
  <g data-place-root="zhongzhiyuan" data-place="zhongzhiyuan" data-composition="parallel-isolated-proof-court">
    <text x="72" y="210" class="sans kicker" fill="#087E68">01 VERIFY · 众智园</text><text x="72" y="248" class="sans label ink">平行隔离：普通绕行与验证庭永不交叉</text><text x="72" y="278" class="sans small muted">验证在上，普通在下；故障只退出旁侧庭与设备边。</text>
    <path d="M128 680 C225 645 340 708 500 674" fill="none" stroke="#DFF1EA" stroke-width="40" class="cap"/><path d="M128 680 C225 645 340 708 500 674" fill="none" class="ordinary cap" stroke-width="9" marker-end="url(#greenArrow)"/><text x="125" y="736" class="sans body" fill="#087E68">普通绕行 / 非 AI 连续路径</text>
    <rect x="133" y="354" width="350" height="194" rx="86" fill="#DCEEF4" stroke="#167FA5" stroke-width="6" stroke-dasharray="17 11"/><rect x="180" y="401" width="256" height="100" rx="48" fill="#FFFFFF" stroke="#167FA5" stroke-width="3"/><text x="308" y="451" class="sans label" fill="#167FA5" text-anchor="middle">平行验证庭</text><text x="308" y="482" class="sans small" fill="#167FA5" text-anchor="middle">旁侧、可物理停止</text>
    <path d="M112 592 L500 592" stroke="#C58A17" stroke-width="18" stroke-linecap="round"/><path d="M112 592 L500 592" stroke="#FFF6DE" stroke-width="8" stroke-dasharray="18 10"/><text x="306" y="626" class="sans small" fill="#A56F0F" text-anchor="middle">设备隔离边 / 不进入普通路径</text>
    <circle cx="145" cy="636" r="27" fill="#FFF7E6" stroke="#C58A17" stroke-width="3"/><text x="145" y="643" class="sans label" fill="#A56F0F" text-anchor="middle">H</text><text x="185" y="642" class="sans body ink">维护人工交接</text>
    <path d="M435 330 C500 355 524 413 488 470" fill="none" class="failure cap" stroke-width="5" stroke-dasharray="8 9" marker-end="url(#coralArrow)"/><path d="M482 508 l24 -24 l24 24 l-24 24 z" fill="#F8E4DE" stroke="#D75D45" stroke-width="4"/><text x="530" y="515" class="sans body" fill="#D75D45">停止实体验证庭</text><path d="M428 523 C476 572 460 628 404 650" fill="none" class="restore cap" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#blueArrow)"/>
    <text x="83" y="815" class="sans micro" fill="#D75D45">故障：设备、围合与线缆退出；普通绕行继续。</text><text x="83" y="850" class="sans micro ink">恢复：复核庭内铺地与环境，恢复不等于授权或 G1。</text>
  </g>
  <g data-place-root="origin-community" data-place="origin-community" data-composition="one-street-two-courts-four-withdrawals">
    <text x="625" y="210" class="sans kicker" fill="#B77A13">02 CO-CREATE · 原点社区</text><text x="625" y="248" class="sans label ink">一街两院四节点：撤回逐点发生，居民街保持开放</text><text x="625" y="278" class="sans small muted">两院被同一条日常街与四个退出点串联。</text>
    <path d="M640 690 C735 630 830 744 930 682 S1110 638 1170 705" fill="none" stroke="#DFF1EA" stroke-width="44" class="cap"/><path d="M640 690 C735 630 830 744 930 682 S1110 638 1170 705" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#greenArrow)"/><text x="655" y="744" class="sans body" fill="#087E68">居民街 / 日常通行不断</text>
    <path d="M698 420 L792 350 L886 420 L886 548 L698 548 Z" fill="#FFF9EB" stroke="#B77A13" stroke-width="5"/><text x="792" y="466" class="sans label" fill="#B77A13" text-anchor="middle">问题共创院</text><path d="M958 486 L1052 416 L1146 486 L1146 614 L958 614 Z" fill="#EEF8FB" stroke="#167FA5" stroke-width="5"/><text x="1052" y="534" class="sans label" fill="#167FA5" text-anchor="middle">公共评议院</text>
    <path d="M670 371 C800 305 1030 316 1172 431" fill="none" class="proof cap dash" stroke-width="6"/><text x="922" y="331" class="sans small" fill="#167FA5" text-anchor="middle">可选验证叠层跨两院，但不占居民街</text>
    <g fill="#FFFFFF" stroke="#D75D45" stroke-width="4"><circle cx="742" cy="667" r="21"/><circle cx="842" cy="708" r="21"/><circle cx="958" cy="670" r="21"/><circle cx="1064" cy="658" r="21"/></g><text x="742" y="675" class="sans body" fill="#D75D45" text-anchor="middle">1</text><text x="842" y="716" class="sans body" fill="#D75D45" text-anchor="middle">2</text><text x="958" y="678" class="sans body" fill="#D75D45" text-anchor="middle">3</text><text x="1064" y="666" class="sans body" fill="#D75D45" text-anchor="middle">4</text>
    <rect x="676" y="775" width="280" height="65" rx="18" fill="#DDEEF4" stroke="#167FA5" stroke-width="3"/><text x="816" y="815" class="sans body" fill="#167FA5" text-anchor="middle">纸质 / 口述人工交接（街外）</text><path d="M1064 690 C1114 704 1148 727 1143 770" fill="none" class="failure cap" stroke-width="4" stroke-dasharray="7 9" marker-end="url(#coralArrow)"/>
    <text x="625" y="870" class="sans micro" fill="#D75D45">故障：按节点撤回采集与匹配；两院与居民街不整体关闭。</text><text x="625" y="904" class="sans micro ink">恢复：屏幕、采集、临时标识离场；先回到居民日常与安静通行。</text>
  </g>
  <g data-place-root="dazhongsi" data-place="dazhongsi" data-composition="four-way-commute-off-route-service">
    <text x="1252" y="210" class="sans kicker" fill="#D75D45">03 PUBLISH · 大钟寺</text><text x="1252" y="248" class="sans label ink">四向通勤十字：发布与人工服务始终退到路外</text><text x="1252" y="278" class="sans small muted">通勤不是服务队列；路外厅、双入口台和安静休憩各自独立。</text>
    <circle cx="1480" cy="597" r="72" fill="#DFF1EA"/><path d="M1284 597 L1710 597 M1480 380 L1480 818" fill="none" class="ordinary cap" stroke-width="25"/><circle cx="1480" cy="597" r="40" fill="#FFFFFF" stroke="#087E68" stroke-width="6"/><text x="1480" y="860" class="sans body" fill="#087E68" text-anchor="middle">四向通勤 / 物理导引 / 非 AI 继续</text>
    <rect x="1260" y="380" width="195" height="118" rx="42" fill="#FFF4D9" stroke="#B77A13" stroke-width="5" stroke-dasharray="14 9"/><text x="1358" y="427" class="sans label" fill="#B77A13" text-anchor="middle">路外离线发布厅</text><text x="1358" y="458" class="sans small" fill="#B77A13" text-anchor="middle">来源 · 版本 · 纠错</text>
    <rect x="1572" y="696" width="170" height="96" rx="22" fill="#DDEEF4" stroke="#167FA5" stroke-width="4"/><circle cx="1572" cy="744" r="12" fill="#FFFFFF" stroke="#167FA5" stroke-width="4"/><circle cx="1742" cy="744" r="12" fill="#FFFFFF" stroke="#167FA5" stroke-width="4"/><text x="1657" y="751" class="sans body" fill="#167FA5" text-anchor="middle">双入口人工台</text><rect x="1258" y="713" width="238" height="82" rx="38" fill="#FFFFFF" stroke="#6B7280" stroke-width="3"/><text x="1377" y="761" class="sans body" fill="#526675" text-anchor="middle">安静休憩 / 不缩窄通路</text>
    <path d="M1280 520 L1455 520" class="failure cap" stroke-width="7" stroke-dasharray="7 9"/><path d="M1395 490 C1445 466 1470 486 1472 545" fill="none" class="failure cap" stroke-width="4" marker-end="url(#coralArrow)"/><text x="1260" y="565" class="sans small" fill="#D75D45">停止发布支线，不停止十字通勤</text>
    <text x="1252" y="904" class="sans micro" fill="#D75D45">故障：来源、屏幕、声光与队列退出；同任务转人工台。</text><text x="1252" y="938" class="sans micro ink">恢复：纠正来源、关闭申诉、全量复测；不等于批准、授权或 G1。</text>
  </g>
  <rect x="0" y="968" width="1800" height="82" fill="#F5F1E8"/><rect x="52" y="974" width="1696" height="72" rx="16" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="78" y="1005" class="sans micro ink">空间图谱读法：先认普通路径，再认可停止叠层；故障不停止日常，恢复回到具体普通空间。证据：PROV-KEY-001—003 · 重点区证据矩阵 · 可逆恢复台账 · 非 AI 对等合同。</text><text x="78" y="1032" class="sans micro" fill="#9A3F2F">限制：尺度、尺寸、材料、连接、锚点、专业条件与现实恢复时长 unknown；现场结果 / GO / 批准 = 0；RIGHTS = not_fully_cleared。</text><text x="1745" y="1081" class="sans micro" fill="#D75D45" text-anchor="end">概念关系图，不证明现状、已建成、人员承诺、无障碍结果或法定边界。</text>
</svg>
