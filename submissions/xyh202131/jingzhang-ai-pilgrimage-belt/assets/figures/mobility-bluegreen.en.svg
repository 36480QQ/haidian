<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">Continuous non-AI access is design intent, not an accessibility or field result · roads, water, dimensions, materials, slopes, lighting, rosters and recovery duration remain unknown / 0</text>
