<text x="1040" y="855" class="sans kicker" fill="#B77A13" text-anchor="start">维护净空 / MAINTENANCE CLEARANCE</text>
<text x="1040" y="880" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1040" dy="0">cleaning, repair, quiet time, emergency, and screen-free information</tspan><tspan x="1040" dy="24">stay unobstructed by proof equipment</tspan></text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">Continuous non-AI path is a design intent, not an accessibility result · roads, water, station, dimensions, materials, slopes, lighting, and recovery time remain unknown</text>
