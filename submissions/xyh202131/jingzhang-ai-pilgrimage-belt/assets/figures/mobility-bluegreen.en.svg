<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">One person completes the ordinary journey first; proof appears off-route only</title><desc id="desc">Human-scale ordinary journey with continuous blue-green and maintenance base, optional off-route proof, failure isolation, and restoration.</desc>
<defs>
<style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.kicker{font-size:17px;font-weight:900;letter-spacing:1.6px}.head{font-size:38px;font-weight:900}.sub{font-size:21px;font-weight:650}.label{font-size:27px;font-weight:900}.body{font-size:21px;font-weight:760}.small{font-size:18px;font-weight:720}.micro{font-size:16px;font-weight:650}.tiny{font-size:14px;font-weight:650}.number{font-size:42px;font-weight:950}</style>
