<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">04 / HUMAN JOURNEY / MOBILITY + BLUE-GREEN</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">One person completes the ordinary journey first; proof appears off-route only</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">The blue-green and maintenance base persists throughout; failure isolates proof while staffed handoff and safe exit continue.</text>
