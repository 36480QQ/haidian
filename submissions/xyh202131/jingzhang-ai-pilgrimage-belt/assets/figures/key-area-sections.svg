<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">三处空间的四态关系与场所恢复</title><desc id="desc">众智园的平行绕行与验证庭，原点社区的一街两院四节点，大钟寺的四向通勤十字与路外服务，分别展示普通、验证、故障和恢复。恢复不是授权。</desc>
<defs><style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}.ink{fill:#102A43}.muted{fill:#526675}.micro{font-size:16px;font-weight:700}.small{font-size:19px;font-weight:750}.body{font-size:22px;font-weight:800}.label{font-size:25px;font-weight:900}.head{font-size:36px;font-weight:900}.kicker{font-size:17px;font-weight:900;letter-spacing:1.5px}.ordinary{stroke:#087E68}.proof{stroke:#167FA5}.failure{stroke:#D75D45}.restore{stroke:#6B7280}.cap{stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:13 10}</style><marker id="aG" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087E68"/></marker><marker id="aB" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#167FA5"/></marker><marker id="aR" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#D75D45"/></marker></defs>
<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/><text x="56" y="50" class="sans kicker" fill="#D6A21D">FOUR STATES ARE SPATIAL RELATIONS · G0 · PROVISIONAL · NOT TO SCALE</text><text x="56" y="105" class="sans head" fill="#FFFFFF">同一公共底线，不同的停止对象、人工接管位置与恢复对象</text><text x="1740" y="103" class="sans micro" fill="#F8D56A" text-anchor="end">四态是概念关系；不提供现实恢复时长、授权或批准结论</text><path d="M584 204 L584 900 M1216 204 L1216 900" stroke="#C7D0CC" stroke-width="2" stroke-dasharray="8 12"/>
<g data-place-root="zhongzhiyuan" data-composition="parallel-section-four-state"><text x="70" y="208" class="sans kicker" fill="#087E68">01 VERIFY · 众智园 / 平行剖面</text><text x="70" y="244" class="sans label ink">普通绕行在下，验证庭在上</text><text x="70" y="275" class="sans small muted">停止只发生在上方可拆叠层；维护交接位于两者之间。</text><path d="M105 705 C220 665 352 720 510 682" fill="none" stroke="#DFF1EA" stroke-width="46" class="cap"/><path d="M105 705 C220 665 352 720 510 682" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#aG)"/><text x="105" y="758" class="sans body" fill="#087E68">01 普通：绕行持续</text><rect x="134" y="405" width="342" height="170" rx="78" fill="#DCEEF4" stroke="#167FA5" stroke-width="6" stroke-dasharray="16 10"/><path d="M182 490 L428 490" class="proof cap" stroke-width="8" stroke-dasharray="13 9" marker-end="url(#aB)"/><text x="305" y="454" class="sans body" fill="#167FA5" text-anchor="middle">02 验证：庭内旁侧</text><circle cx="154" cy="630" r="28" fill="#FFF7E6" stroke="#B77A13" stroke-width="3"/><text x="154" y="638" class="sans label" fill="#B77A13" text-anchor="middle">H</text><text x="198" y="638" class="sans body ink">人工维护交接</text><path d="M389 382 C474 410 490 493 439 540" fill="none" class="failure cap" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#aR)"/><path d="M420 553 l22 -22 l22 22 l-22 22z" fill="#F8E4DE" stroke="#D75D45" stroke-width="4"/><text x="92" y="816" class="sans micro" fill="#D75D45">03 故障：实体停止、设备与围合退出；下方绕行不受阻。</text><path d="M432 581 C444 625 398 649 356 660" fill="none" class="restore cap" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#aB)"/><text x="92" y="852" class="sans micro ink">04 恢复：复核庭内铺地与环境，仍不是授权或重启。</text></g>
<g data-place-root="origin-community" data-composition="street-courts-nodes-four-state"><text x="622" y="208" class="sans kicker" fill="#B77A13">02 CO-CREATE · 原点社区 / 街院剖面</text><text x="622" y="244" class="sans label ink">一街穿过两院，四节点可分别撤回</text><text x="622" y="275" class="sans small muted">状态沿街分布而非沿一条统一时间线排队。</text><path d="M635 710 C735 630 812 748 910 681 S1085 630 1170 706" fill="none" stroke="#DFF1EA" stroke-width="46" class="cap"/><path d="M635 710 C735 630 812 748 910 681 S1085 630 1170 706" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#aG)"/><text x="640" y="764" class="sans body" fill="#087E68">01 普通：居民街与无屏通行</text><path d="M690 425 L784 354 L878 425 L878 555 L690 555 Z" fill="#FFF9EB" stroke="#B77A13" stroke-width="5"/><path d="M953 488 L1047 417 L1141 488 L1141 618 L953 618 Z" fill="#EEF8FB" stroke="#167FA5" stroke-width="5"/><text x="784" y="476" class="sans body" fill="#B77A13" text-anchor="middle">问题院</text><text x="1047" y="542" class="sans body" fill="#167FA5" text-anchor="middle">评议院</text><path d="M662 382 C784 308 1018 319 1165 437" fill="none" class="proof cap dash" stroke-width="6"/><text x="907" y="341" class="sans body" fill="#167FA5" text-anchor="middle">02 验证：两院旁侧</text><g fill="#FFF" stroke="#D75D45" stroke-width="4"><circle cx="745" cy="679" r="20"/><circle cx="842" cy="715" r="20"/><circle cx="957" cy="678" r="20"/><circle cx="1064" cy="663" r="20"/></g><text x="745" y="686" class="sans body" fill="#D75D45" text-anchor="middle">1</text><text x="842" y="722" class="sans body" fill="#D75D45" text-anchor="middle">2</text><text x="957" y="685" class="sans body" fill="#D75D45" text-anchor="middle">3</text><text x="1064" y="670" class="sans body" fill="#D75D45" text-anchor="middle">4</text><rect x="668" y="790" width="270" height="62" rx="17" fill="#DDEEF4" stroke="#167FA5" stroke-width="3"/><text x="803" y="828" class="sans body" fill="#167FA5" text-anchor="middle">纸质 / 口述交接（街外）</text><text x="622" y="888" class="sans micro" fill="#D75D45">03 故障：节点 1—4 可逐一退出；居民街、两院的日常使用保持。</text><text x="622" y="922" class="sans micro ink">04 恢复：先撤屏幕、采集与临时标识，再回到安静居民日常。</text></g>
<g data-place-root="dazhongsi" data-composition="commuter-cross-service-siding-four-state"><text x="1254" y="208" class="sans kicker" fill="#D75D45">03 PUBLISH · 大钟寺 / 通勤界面</text><text x="1254" y="244" class="sans label ink">四向十字不停，服务支线可离线</text><text x="1254" y="275" class="sans small muted">发布厅、人工台与安静休憩均在通勤路径之外。</text><circle cx="1491" cy="620" r="76" fill="#DFF1EA"/><path d="M1284 620 L1712 620 M1491 400 L1491 838" fill="none" class="ordinary cap" stroke-width="25"/><circle cx="1491" cy="620" r="40" fill="#FFF" stroke="#087E68" stroke-width="6"/><text x="1491" y="886" class="sans body" fill="#087E68" text-anchor="middle">01 普通：四向通勤继续</text><rect x="1260" y="404" width="190" height="116" rx="40" fill="#FFF4D9" stroke="#B77A13" stroke-width="5" stroke-dasharray="14 9"/><text x="1355" y="451" class="sans body" fill="#B77A13" text-anchor="middle">02 路外发布厅</text><text x="1355" y="479" class="sans small" fill="#B77A13" text-anchor="middle">来源与纠错</text><rect x="1574" y="722" width="166" height="90" rx="20" fill="#DDEEF4" stroke="#167FA5" stroke-width="4"/><text x="1657" y="777" class="sans body" fill="#167FA5" text-anchor="middle">人工台</text><rect x="1255" y="742" width="230" height="70" rx="34" fill="#FFF" stroke="#6B7280" stroke-width="3"/><text x="1370" y="784" class="sans body" fill="#526675" text-anchor="middle">安静休憩</text><path d="M1280 545 L1454 545" class="failure cap" stroke-width="7" stroke-dasharray="8 8"/><path d="M1390 514 C1450 492 1472 520 1478 570" fill="none" class="failure cap" stroke-width="4" marker-end="url(#aR)"/><text x="1254" y="931" class="sans micro" fill="#D75D45">03 故障：下线发布支线，来源冲突与申诉转人工；十字不断。</text><text x="1254" y="965" class="sans micro ink">04 恢复：纠正来源、关闭申诉、全量复测后才可候选；并非授权。</text></g>
<rect x="52" y="990" width="1696" height="60" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1026" class="sans micro ink">读图要点：三处共用“普通先行、叠层可停、人工接管、恢复先还普通空间”的底线，但各自的普通线、失败对象与恢复对象不可互换。尺寸、材料、连接、锚点、专项条件和现实恢复时长 unknown；现场结果 / GO / 批准 = 0；RIGHTS = not_fully_cleared。</text><text x="1745" y="1081" class="sans micro" fill="#D75D45" text-anchor="end">G0 概念关系图，不是工程剖面、现状建筑记录、恢复验收或重启授权。</text>
<rect x="720" y="312" width="405" height="40" rx="14" fill="#F5F1E8"/><text x="922" y="340" class="sans body" fill="#167FA5" text-anchor="middle">02 验证：旁置两院</text>
<rect x="52" y="990" width="1696" height="60" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1015" class="sans micro ink">三处共用“普通先行、叠层可停、人工接管、恢复还普通空间”，但普通线、失败对象与恢复对象不可互换。</text><text x="76" y="1038" class="sans micro" fill="#9A3F2F">尺度、材料、连接、锚点、专业条件与现实恢复时长 unknown；现场结果 / GO / 批准 = 0；RIGHTS = not_fully_cleared。</text>
<rect x="0" y="984" width="1800" height="68" fill="#F5F1E8"/><rect x="52" y="990" width="1696" height="60" rx="14" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="76" y="1015" class="sans micro ink">三处共用“普通先行、叠层可停、人工接管、恢复还普通空间”，但普通线、失败对象与恢复对象不可互换。</text><text x="76" y="1038" class="sans micro" fill="#9A3F2F">尺度、材料、连接、锚点、专业条件与现实恢复时长 unknown；现场结果 / GO / 批准 = 0；RIGHTS = not_fully_cleared。</text>
</svg>
