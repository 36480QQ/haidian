<text x="635" y="258" class="sans kicker" fill="#B77A13" text-anchor="start">02 CO-CREATE · 原点社区 / 街院剖面</text>
<text x="635" y="302" class="sans label" fill="#102A43" text-anchor="start">一街贯通，两院从街边后退</text>
