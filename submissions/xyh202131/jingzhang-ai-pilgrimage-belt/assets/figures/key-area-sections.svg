<path d="M1370 638 L1370 662 M1370 647 L1358 656 M1370 647 L1382 656 M1370 662 L1358 680 M1370 662 L1382 680" stroke="#102A43" stroke-width="3" stroke-linecap="round" fill="none"/>
<circle cx="1465" cy="632" r="6" fill="#102A43"/>
