<text x="635" y="875" class="sans micro" fill="#526675" text-anchor="start"><tspan x="635" dy="0">故障：验证退回街边，街道与院落日常继续</tspan><tspan x="635" dy="28">恢复：纸面/口述/人工先成立，再判断是否重启</tspan></text>
<text x="1230" y="258" class="sans kicker" fill="#D75D45" text-anchor="start">03 PUBLISH · 大钟寺 / 通勤剖面</text>
<text x="1230" y="302" class="sans label" fill="#102A43" text-anchor="start">主路保持平直，服务空间退到路外</text>
