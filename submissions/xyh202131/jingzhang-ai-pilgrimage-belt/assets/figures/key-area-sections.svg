<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S04 / GROUND-THRESHOLD SECTIONS / 三处剖面</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">三种剖面明确停止对象、人工位置与还场对象</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">剖面只表达空间责任，不给出未证实尺寸、材料、坡度、消防、铁路保护或无障碍验收结论。</text>
