<text x="1230" y="875" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1230" dy="0">故障：只关闭路外服务侧，主路不断</tspan><tspan x="1230" dy="28">恢复：校正来源与重测；不等于授权或批准</tspan></text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">G0 概念剖面 · 不按比例 · 高差、尺寸、材料、结构、消防、铁路保护、无障碍结果、人员排班和恢复时长均未获证实 / unknown / 0</text>
