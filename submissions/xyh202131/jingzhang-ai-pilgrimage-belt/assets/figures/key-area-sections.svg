<circle cx="882" cy="740" r="13" fill="#FFFFFF" stroke="#D75D45" stroke-width="3"/>
<text x="882" y="745" class="sans tiny" fill="#D75D45" text-anchor="middle">2</text>
<circle cx="925" cy="740" r="13" fill="#FFFFFF" stroke="#D75D45" stroke-width="3"/>
<text x="925" y="745" class="sans tiny" fill="#D75D45" text-anchor="middle">3</text>
