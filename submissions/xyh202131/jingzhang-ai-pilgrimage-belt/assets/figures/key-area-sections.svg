<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">三种剖面明确停止对象、人工位置与还场对象</title><desc id="desc">Three distinct conceptual urban sections showing parallel ordinary and proof strips, a resident street between two courts, and four-way commuting with off-route service.</desc>
