<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">海淀创新密度，沿一条公共能力接力进入普通生活</title><desc id="desc">Haidian public-capability relay from knowledge and community relations through a continuous ordinary track, bounded proof, three distinct civic roles, and a failure siding.</desc>
<defs>
<style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.kicker{font-size:17px;font-weight:900;letter-spacing:1.6px}.head{font-size:38px;font-weight:900}.sub{font-size:21px;font-weight:650}.label{font-size:27px;font-weight:900}.body{font-size:21px;font-weight:760}.small{font-size:18px;font-weight:720}.micro{font-size:16px;font-weight:650}.tiny{font-size:14px;font-weight:650}.number{font-size:42px;font-weight:950}</style>
<marker id="greenArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087E68"/></marker>
<marker id="blueArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#167FA5"/></marker>
<marker id="coralArrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#D75D45"/></marker>
</defs>
<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">01 / PUBLIC-CAPABILITY RELAY / 公共能力接力</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">海淀创新密度，沿一条公共能力接力进入普通生活</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">这是一张社会—空间关系图，不是场地总平：日常先连续，验证再旁置，失败只退出验证。</text>
<rect x="50" y="220" width="455" height="760" rx="22" fill="#FFFFFF" stroke="#C7D0CC" stroke-width="2"/><rect x="50" y="220" width="9" height="760" rx="5" fill="#B77A13"/>
<text x="82" y="260" class="sans kicker" fill="#B77A13" text-anchor="start">A / HAIDIAN RELATIONS</text>
<text x="82" y="300" class="sans label" fill="#102A43" text-anchor="start">先看谁与谁相遇</text>
<circle cx="278" cy="555" r="102" fill="#102A43"/>
<text x="278" y="530" class="sans body" fill="#FFFFFF" text-anchor="middle"><tspan x="278" dy="0">公共能力</tspan><tspan x="278" dy="31">不是技术密度</tspan><tspan x="278" dy="31">的自动结果</tspan></text>
<rect x="125" y="390" width="185" height="82" rx="24" fill="#DCEEF4" stroke="#167FA5" stroke-width="3"/>
<text x="217" y="423" class="sans micro" fill="#167FA5" text-anchor="middle"><tspan x="217" dy="0">高校科研</tspan></text>
<path d="M217 472 L278 455" stroke="#167FA5" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="310" y="355" width="185" height="82" rx="24" fill="#FFF4D9" stroke="#B77A13" stroke-width="3"/>
<text x="402" y="388" class="sans micro" fill="#B77A13" text-anchor="middle"><tspan x="402" dy="0">创业与企业服务</tspan></text>
<path d="M402 437 L278 455" stroke="#B77A13" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="100" y="700" width="185" height="82" rx="24" fill="#DFF1EA" stroke="#087E68" stroke-width="3"/>
<text x="192" y="733" class="sans micro" fill="#087E68" text-anchor="middle"><tspan x="192" dy="0">居民与普通任务</tspan></text>
<path d="M192 700 L278 655" stroke="#087E68" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="305" y="735" width="185" height="82" rx="24" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="397" y="768" class="sans micro" fill="#D75D45" text-anchor="middle"><tspan x="397" dy="0">京张遗址公园</tspan></text>
<path d="M397 735 L278 655" stroke="#D75D45" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="95" y="865" width="365" height="46" rx="23" fill="#F8E4DE" stroke="#D75D45" stroke-width="2"/>
<text x="277" y="895" class="sans micro" fill="#D75D45" text-anchor="middle">账户 · 设备 · 专业语言</text>
<rect x="95" y="920" width="365" height="46" rx="23" fill="#F8E4DE" stroke="#D75D45" stroke-width="2"/>
<text x="277" y="950" class="sans micro" fill="#D75D45" text-anchor="middle">时间 · 算法判断</text>
<rect x="535" y="220" width="1215" height="760" rx="22" fill="#FFFFFF" stroke="#C7D0CC" stroke-width="2"/><rect x="535" y="220" width="9" height="760" rx="5" fill="#087E68"/>
<text x="567" y="260" class="sans kicker" fill="#087E68" text-anchor="start">B / ONE TASK RELAY</text>
<text x="567" y="300" class="sans label" fill="#102A43" text-anchor="start">普通任务先行，三处责任不互换</text>
<path d="M610 765 C865 725 1110 800 1685 748" fill="none" stroke="#DFF1EA" stroke-width="92" stroke-linecap="round"/>
<path d="M610 765 C865 725 1110 800 1685 748" fill="none" stroke="#087E68" stroke-width="13" stroke-linecap="round" marker-end="url(#greenArrow)"/>
<text x="610" y="850" class="sans body" fill="#087E68" text-anchor="start">连续日常轨：进入 · 表达 · 通行 · 休息 · 求助 · 离开</text>
<text x="610" y="885" class="sans micro" fill="#526675" text-anchor="start">不注册、不扫码、不使用 AI，仍能完成同一普通任务</text>
<path d="M715 448 C920 372 1190 378 1512 438" fill="none" stroke="#167FA5" stroke-width="9" stroke-dasharray="20 15" marker-end="url(#blueArrow)"/>
<text x="1115" y="365" class="sans kicker" fill="#167FA5" text-anchor="middle">间歇验证轨 / OPTIONAL + BOUNDED PROOF</text>
<rect x="585" y="420" width="330" height="270" rx="28" fill="#FFF4D9" stroke="#B77A13" stroke-width="4"/>
<circle cx="630" cy="465" r="26" fill="#B77A13"/>
<text x="630" y="474" class="sans small" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="667" y="472" class="sans body" fill="#B77A13" text-anchor="start">原点社区</text>
<text x="613" y="530" class="sans small" fill="#102A43" text-anchor="start">先定义普通问题</text>
<text x="613" y="575" class="sans micro" fill="#526675" text-anchor="start"><tspan x="613" dy="0">口头 · 纸面 · 无屏</tspan><tspan x="613" dy="31">技术证明在入口之后</tspan></text>
<path d="M750 690 L750 735" stroke="#B77A13" stroke-width="5"/>
<rect x="950" y="420" width="330" height="270" rx="28" fill="#DCEEF4" stroke="#167FA5" stroke-width="4"/>
<circle cx="995" cy="465" r="26" fill="#167FA5"/>
<text x="995" y="474" class="sans small" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="1032" y="472" class="sans body" fill="#167FA5" text-anchor="start">众智园</text>
<text x="978" y="530" class="sans small" fill="#102A43" text-anchor="start">并排比较公共证明</text>
<text x="978" y="575" class="sans micro" fill="#526675" text-anchor="start"><tspan x="978" dy="0">普通／非 AI 基线</tspan><tspan x="978" dy="31">证明增量 · 实体停止边</tspan></text>
<path d="M1115 690 L1115 735" stroke="#167FA5" stroke-width="5"/>
<rect x="1315" y="420" width="330" height="270" rx="28" fill="#F8E4DE" stroke="#D75D45" stroke-width="4"/>
<circle cx="1360" cy="465" r="26" fill="#D75D45"/>
<text x="1360" y="474" class="sans small" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="1397" y="472" class="sans body" fill="#D75D45" text-anchor="start">大钟寺</text>
<text x="1343" y="530" class="sans small" fill="#102A43" text-anchor="start">解释、拒绝与人工交接</text>
<text x="1343" y="575" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1343" dy="0">无屏信息在验证之前</tspan><tspan x="1343" dy="31">发布或保留 NO-GO</tspan></text>
<path d="M1480 690 L1480 735" stroke="#D75D45" stroke-width="5"/>
<path d="M1480 570 C1600 540 1690 575 1670 650" fill="none" stroke="#D75D45" stroke-width="6" stroke-dasharray="11 10" marker-end="url(#coralArrow)"/>
<rect x="1260" y="900" width="430" height="64" rx="22" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="1475" y="940" class="sans small" fill="#D75D45" text-anchor="middle">停验证 → 人工接管 → 回到声明基线</text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">G0 社会—空间关系 · 临时几何 · 不按比例 · 不证明官方红线、真实人群结果、现场服务、批准、恢复时长或 G1</text>
</svg>
