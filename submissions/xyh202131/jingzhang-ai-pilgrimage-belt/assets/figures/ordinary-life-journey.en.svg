<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">One public right produces three distinct ordinary-life spaces</title>
<desc id="desc">Zhongzhiyuan uses a parallel bypass beside a proof garden, Origin Community uses one resident street with two stepped-back courts, and Dazhongsi keeps a four-way commute centre clear with an off-route hall and staffed desk. Each retains a complete non-AI task.</desc>
<defs>
  <style>.sans{font-family:"Noto Sans","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.k{font-size:19px;font-weight:800;letter-spacing:1.6px}.h{font-size:42px;font-weight:900}.sub{font-size:21px;font-weight:700}.label{font-size:23px;font-weight:900}.body{font-size:17px;font-weight:650}.small{font-size:15px;font-weight:650}.micro{font-size:13px;font-weight:650}</style>
  <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087e68"/></marker>
  <g id="person" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="-20" r="7" fill="#102d46" stroke="none"/><path d="M0 -12V18M0 -2L-15 12M0 -2L15 12M0 18L-13 38M0 18L14 38"/></g>
</defs>
<rect width="1800" height="1100" fill="#f4f0e7"/>
<rect width="1800" height="142" fill="#102d46"/>
<text x="56" y="52" class="sans k" fill="#ffc21a">S05 / HUMAN-SCALE ORDINARY LIFE</text>
<text x="56" y="108" class="sans h" fill="#fff">One public right, three different spatial answers</text>
<text x="56" y="178" class="sans sub" fill="#536a7b">Read how a person enters, asks, completes a staffed task and leaves. Proof stays beside, stoppable and removable; this is not field or accessibility evidence.</text>
<line x1="600" y1="215" x2="600" y2="978" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<line x1="1200" y1="215" x2="1200" y2="978" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<text x="56" y="235" class="sans k" fill="#167fa5">01 VERIFY · ZHONGZHIYUAN</text>
<text x="56" y="270" class="sans label" fill="#102d46">PARALLEL BYPASS</text><text x="56" y="298" class="sans body" fill="#167fa5">SIDE PROOF GARDEN</text>
<ellipse cx="320" cy="470" rx="205" ry="125" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/>
<ellipse cx="320" cy="470" rx="145" ry="82" fill="#fff" stroke="#167fa5" stroke-width="4" stroke-dasharray="12 10"/>
<text x="320" y="456" text-anchor="middle" class="sans body" fill="#167fa5">OPTIONAL PROOF GARDEN</text>
<text x="320" y="486" text-anchor="middle" class="sans small" fill="#536a7b">bounded · observable · physically stoppable</text>
<path d="M70 706 C205 670 352 728 548 684" fill="none" stroke="#dcefe9" stroke-width="76" stroke-linecap="round"/>
<path d="M70 706 C205 670 352 728 548 684" fill="none" stroke="#087e68" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<use href="#person" transform="translate(125 664)"/><use href="#person" transform="translate(410 687)"/>
<rect x="382" y="587" width="150" height="62" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="3"/>
<text x="457" y="626" text-anchor="middle" class="sans body" fill="#9a6200">STAFF</text>
<text x="56" y="790" class="sans body" fill="#087e68">Ordinary: bypass → read status → staff → correct or leave</text>
<rect x="56" y="818" width="488" height="112" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="78" y="850" class="sans small" fill="#167fa5">Proof stops: close and clear the proof garden</text><text x="78" y="881" class="sans small" fill="#102d46">Still works: bypass, observation, staffed explanation, exit</text><text x="78" y="912" class="sans micro" fill="#536a7b">Spatial cue: parallel relations, never one crossed route</text>
<text x="636" y="235" class="sans k" fill="#bd7700">02 CO-CREATE · ORIGIN COMMUNITY</text>
<text x="636" y="270" class="sans label" fill="#102d46">ONE STREET</text><text x="636" y="298" class="sans body" fill="#bd7700">TWO COURTS + FOUR WITHDRAWALS</text>
<rect x="666" y="355" width="205" height="190" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="5"/>
<rect x="720" y="405" width="97" height="90" fill="#fff" stroke="#bd7700" stroke-width="3" stroke-dasharray="10 8"/>
<text x="768" y="455" text-anchor="middle" class="sans body" fill="#9a6200">PROBLEM COURT</text>
<rect x="950" y="335" width="205" height="210" rx="18" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/>
<rect x="1004" y="395" width="97" height="90" fill="#fff" stroke="#167fa5" stroke-width="3"/>
<text x="1052" y="445" text-anchor="middle" class="sans body" fill="#167fa5">REVIEW COURT</text>
