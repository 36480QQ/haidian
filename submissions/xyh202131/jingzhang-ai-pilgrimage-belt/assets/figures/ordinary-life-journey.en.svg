<path d="M636 706 C780 676 954 726 1168 684" fill="none" stroke="#087e68" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<use href="#person" transform="translate(686 664)"/><use href="#person" transform="translate(1110 674)"/>
<g class="sans body" text-anchor="middle" fill="#d75d45"><circle cx="748" cy="695" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="748" y="702">1</text><circle cx="850" cy="696" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="850" y="703">2</text><circle cx="952" cy="697" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="952" y="704">3</text><circle cx="1054" cy="694" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="1054" y="701">4</text></g>
<text x="636" y="790" class="sans body" fill="#087e68">Ordinary: street → paper/spoken → staff → withdraw or leave</text>
<rect x="636" y="818" width="488" height="112" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="658" y="850" class="sans small" fill="#bd7700">Proof stops: withdraw nodes; remove court inserts</text><text x="658" y="881" class="sans small" fill="#102d46">Still works: street, paper entry, staffed task, appeal</text><text x="658" y="912" class="sans micro" fill="#536a7b">Spatial cue: one street links two stepped-back courts</text>
<text x="1236" y="235" class="sans k" fill="#d75d45">03 PUBLISH · DAZHONGSI</text>
<text x="1236" y="270" class="sans label" fill="#102d46">FOUR-WAY COMMUTE</text><text x="1236" y="298" class="sans body" fill="#d75d45">OFF-ROUTE HALL + STAFFED DESK</text>
<rect x="1270" y="352" width="170" height="120" fill="#fee5de" stroke="#d75d45" stroke-width="4" stroke-dasharray="12 9"/>
<text x="1355" y="405" text-anchor="middle" class="sans body" fill="#d75d45">OFF-ROUTE HALL</text><text x="1355" y="436" text-anchor="middle" class="sans small" fill="#536a7b">source · refuse · appeal</text>
<path d="M1240 625 H1730 M1485 350 V835" stroke="#dcefe9" stroke-width="76" stroke-linecap="round"/>
<path d="M1240 625 H1730 M1485 350 V835" stroke="#087e68" stroke-width="12" stroke-linecap="round"/>
<circle cx="1485" cy="625" r="56" fill="#fff" stroke="#087e68" stroke-width="6"/>
<text x="1485" y="620" text-anchor="middle" class="sans micro" fill="#087e68">CLEAR</text><text x="1485" y="640" text-anchor="middle" class="sans micro" fill="#087e68">CROSSING</text>
<use href="#person" transform="translate(1298 585)"/><use href="#person" transform="translate(1665 585)"/><use href="#person" transform="translate(1538 740)"/>
<rect x="1570" y="760" width="155" height="72" rx="20" fill="#d8edf3" stroke="#167fa5" stroke-width="4"/>
<text x="1647" y="804" text-anchor="middle" class="sans body" fill="#167fa5">STAFFED DESK</text>
<text x="1236" y="884" class="sans body" fill="#087e68">Ordinary: cross → read source → staff → continue</text>
<rect x="1236" y="905" width="500" height="70" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="1258" y="934" class="sans small" fill="#d75d45">Proof stops: publishing and automation leave the route</text><text x="1258" y="962" class="sans small" fill="#102d46">Still works: commute, quiet rest, staffed service</text>
<rect x="48" y="1016" width="1704" height="52" rx="20" fill="#102d46"/>
<text x="900" y="1050" text-anchor="middle" class="sans small" fill="#fff">G0 concept relation · people are generic symbols, not real participants or public feedback · non-AI task first · not field or accessibility evidence</text>
</svg>
