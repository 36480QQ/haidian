<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">One person, one task, one place: three ordinary-life journeys</title>
<desc id="desc">Arrival, understanding, completion, correction or withdrawal, and departure compare Zhongzhiyuan's parallel bypass, Origin Community's resident street, and Dazhongsi's four-way commute. Failure stops only the validation overlay; ordinary tasks and staffed routes continue.</desc>
<defs>
  <style>.sans{font-family:"Segoe UI","Noto Sans","Microsoft YaHei",Arial,sans-serif}.k{font-size:17px;font-weight:800;letter-spacing:1.25px}.h{font-size:41px;font-weight:900}.sub{font-size:20px;font-weight:700}.label{font-size:24px;font-weight:900}.body{font-size:16px;font-weight:700}.small{font-size:14px;font-weight:650}.micro{font-size:12.5px;font-weight:650}.step{font-size:17px;font-weight:900}.journey{font-size:16px;font-weight:800}</style>
  <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087e68"/></marker>
  <g id="person" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="-20" r="8" fill="#102d46" stroke="none"/><path d="M0 -10V20M0 0L-15 13M0 0L15 13M0 20L-13 40M0 20L14 40"/></g>
  <g id="seated" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="-4" cy="-19" r="8" fill="#102d46" stroke="none"/><path d="M-4 -9L2 14H24M2 14L-8 32M24 14L31 34"/><circle cx="12" cy="31" r="17"/></g>
</defs>
<rect width="1800" height="1100" fill="#f4f0e7"/><rect width="1800" height="148" fill="#102d46"/>
<text x="56" y="48" class="sans k" fill="#ffc21a">S05 / HUMAN TASK LENS</text>
<text x="56" y="105" class="sans h" fill="#fff">One person, one task, one place: can the ordinary task finish?</text>
<text x="56" y="180" class="sans sub" fill="#536a7b">One five-action lens, three different spatial answers; validation stays aside and ordinary life continues through failure.</text>
<g class="sans" transform="translate(56 208)">
  <rect width="1688" height="84" rx="24" fill="#fff" stroke="#c8d5d6" stroke-width="2"/><path d="M74 42H1590" stroke="#dcefe9" stroke-width="18" stroke-linecap="round"/><path d="M74 42H1590" stroke="#087e68" stroke-width="4" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <circle cx="92" cy="42" r="27" fill="#087e68"/><text x="92" y="48" class="step" fill="#fff">1</text><text x="92" y="76" class="micro" fill="#102d46">ARRIVE</text>
    <circle cx="448" cy="42" r="27" fill="#167fa5"/><text x="448" y="48" class="step" fill="#fff">2</text><text x="448" y="76" class="micro" fill="#102d46">UNDERSTAND</text>
    <circle cx="804" cy="42" r="27" fill="#bd7700"/><text x="804" y="48" class="step" fill="#fff">3</text><text x="804" y="76" class="micro" fill="#102d46">COMPLETE</text>
    <circle cx="1160" cy="42" r="27" fill="#d75d45"/><text x="1160" y="48" class="step" fill="#fff">4</text><text x="1160" y="76" class="micro" fill="#102d46">CORRECT / WITHDRAW</text>
    <circle cx="1516" cy="42" r="27" fill="#102d46"/><text x="1516" y="48" class="step" fill="#fff">5</text><text x="1516" y="76" class="micro" fill="#102d46">LEAVE</text>
  </g>
</g>
<line x1="608" y1="320" x2="608" y2="984" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/><line x1="1192" y1="320" x2="1192" y2="984" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<g class="sans">
  <text x="56" y="350" class="k" fill="#167fa5">01 VERIFY · ZHONGZHIYUAN</text><text x="56" y="391" class="label" fill="#102d46">One task on the bypass</text><text x="56" y="422" class="small" fill="#536a7b">Public route skirts the closable proof court</text>
  <ellipse cx="330" cy="552" rx="176" ry="88" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/><ellipse cx="330" cy="552" rx="114" ry="49" fill="#fff" stroke="#167fa5" stroke-width="3" stroke-dasharray="11 9"/><text x="330" y="548" text-anchor="middle" class="body" fill="#167fa5">OPTIONAL PROOF COURT</text><text x="330" y="576" text-anchor="middle" class="micro" fill="#536a7b">observable · physically stoppable</text>
  <path d="M74 712C185 676 353 746 558 690" fill="none" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/><path d="M74 712C185 676 353 746 558 690" fill="none" stroke="#087e68" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
  <use href="#person" transform="translate(112 672)"/><use href="#seated" transform="translate(252 696)"/><rect x="390" y="624" width="152" height="62" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="3"/><text x="466" y="663" text-anchor="middle" class="body" fill="#9a6200">STAFFED DESK</text>
  <text x="56" y="784" class="journey" fill="#102d46">Arrive → read status → staffed task</text><text x="56" y="809" class="journey" fill="#102d46">correct → leave safely</text>
  <rect x="56" y="836" width="496" height="120" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/><text x="78" y="868" class="small" fill="#167fa5">Validation stops: proof court closes and clears</text><text x="78" y="899" class="small" fill="#087e68">People still: arrive, understand, finish with staff and leave</text><text x="78" y="929" class="micro" fill="#536a7b">No crossing of the test zone; parallel relations stay legible</text>

  <text x="640" y="350" class="k" fill="#bd7700">02 CO-CREATE · ORIGIN COMMUNITY</text><text x="640" y="391" class="label" fill="#102d46">Raise, correct, withdraw</text><text x="640" y="422" class="small" fill="#536a7b">Resident street; two setback courts; four exit points</text>
  <rect x="668" y="485" width="190" height="142" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="5"/><rect x="716" y="523" width="94" height="66" fill="#fff" stroke="#bd7700" stroke-width="3" stroke-dasharray="10 8"/><text x="763" y="563" text-anchor="middle" class="body" fill="#9a6200">ISSUE COURT</text>
  <rect x="966" y="465" width="190" height="162" rx="18" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/><rect x="1014" y="511" width="94" height="72" fill="#fff" stroke="#167fa5" stroke-width="3"/><text x="1061" y="554" text-anchor="middle" class="body" fill="#167fa5">REVIEW COURT</text>
  <path d="M644 712C788 682 954 732 1162 690" fill="none" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/><path d="M644 712C788 682 954 732 1162 690" fill="none" stroke="#087e68" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/><use href="#person" transform="translate(676 671)"/>
  <g class="body" text-anchor="middle" fill="#d75d45"><circle cx="760" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="760" y="711">1</text><circle cx="860" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="860" y="711">2</text><circle cx="960" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="960" y="711">3</text><circle cx="1060" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="1060" y="711">4</text></g>
  <text x="640" y="784" class="journey" fill="#102d46">Enter street → paper/speech → staffed task</text><text x="640" y="809" class="journey" fill="#102d46">withdraw → return to daily life</text>
  <rect x="640" y="836" width="496" height="120" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/><text x="662" y="868" class="small" fill="#bd7700">Validation stops: nodes retract; court plug-ins exit</text><text x="662" y="899" class="small" fill="#087e68">People still: arrive, ask on paper, appeal and leave</text><text x="662" y="929" class="micro" fill="#536a7b">Nodes stay off-street; withdrawal is a full action</text>

  <text x="1224" y="350" class="k" fill="#d75d45">03 PUBLISH · DAZHONGSI</text><text x="1224" y="391" class="label" fill="#102d46">Commute; check a source</text><text x="1224" y="422" class="small" fill="#536a7b">Clear four-way centre; publication stays off-route</text>
  <rect x="1260" y="468" width="174" height="104" fill="#fee5de" stroke="#d75d45" stroke-width="4" stroke-dasharray="12 9"/><text x="1347" y="514" text-anchor="middle" class="body" fill="#d75d45">OFF-ROUTE HALL</text><text x="1347" y="543" text-anchor="middle" class="micro" fill="#536a7b">source · refusal · appeal</text>
  <path d="M1236 690H1738M1490 455V800" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/><path d="M1236 690H1738M1490 455V800" stroke="#087e68" stroke-width="11" stroke-linecap="round"/><circle cx="1490" cy="690" r="52" fill="#fff" stroke="#087e68" stroke-width="6"/><text x="1490" y="697" text-anchor="middle" class="body" fill="#087e68">CLEAR ROUTE</text>
  <use href="#person" transform="translate(1280 648)"/><use href="#seated" transform="translate(1670 652)"/><use href="#person" transform="translate(1538 764)"/><rect x="1560" y="500" width="166" height="68" rx="20" fill="#d8edf3" stroke="#167fa5" stroke-width="4"/><text x="1643" y="542" text-anchor="middle" class="body" fill="#167fa5">TWO-ENTRY DESK</text>
  <text x="1224" y="822" class="journey" fill="#102d46">Arrive → read source → staff correction</text><text x="1224" y="847" class="journey" fill="#102d46">finish commute → leave</text>
  <rect x="1224" y="876" width="520" height="80" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/><text x="1246" y="909" class="small" fill="#d75d45">Validation stops: publication and automation leave the route</text><text x="1246" y="940" class="small" fill="#087e68">People still: commute, rest, use staff service and leave</text>
</g>
<rect x="48" y="1000" width="1704" height="62" rx="20" fill="#102d46"/>
<text x="900" y="1039" text-anchor="middle" class="sans small" fill="#fff">G0 concept relation · anonymous self-authored symbols, not real people or public feedback · non-AI same-task first · not field or accessibility evidence</text>
</svg>
