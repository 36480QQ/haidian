<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">04 / SAME-TASK JOURNEY / 同任务普通旅程</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">先完成同一普通旅程，再决定是否进入验证</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">进入—移动—停留—询问—拒绝或自愿进入—离开；故障只移除旁侧验证带。</text>
<rect x="50" y="220" width="1700" height="760" rx="22" fill="#FFFFFF" stroke="#C7D0CC" stroke-width="2"/><rect x="50" y="220" width="9" height="760" rx="5" fill="#087E68"/>
