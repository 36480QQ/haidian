<text x="1325" y="923" class="sans micro" fill="#B77A13" text-anchor="middle">维护净空：保洁 · 检修 · 应急 · 无屏信息 · 人工路线</text>
<text x="1325" y="950" class="sans tiny" fill="#526675" text-anchor="middle">验证设施不得占用</text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">连续非 AI 路径是设计意图，不是无障碍验收或现场结果 · 道路、河道、尺寸、材料、坡度、照明、排班与恢复时长保持 unknown / 0</text>
