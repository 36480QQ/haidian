<text x="735" y="710" class="sans body" fill="#102A43" text-anchor="middle">停留</text>
<text x="735" y="742" class="sans tiny" fill="#526675" text-anchor="middle">蓝绿舒适</text>
<circle cx="1020" cy="595" r="43" fill="#FFFFFF" stroke="#087E68" stroke-width="7"/>
