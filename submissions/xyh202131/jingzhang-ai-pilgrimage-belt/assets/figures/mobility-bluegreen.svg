<text x="1040" y="855" class="sans kicker" fill="#B77A13" text-anchor="start">维护净空 / MAINTENANCE CLEARANCE</text>
<text x="1040" y="880" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1040" dy="0">保洁、检修、静音、应急和无屏信息</tspan><tspan x="1040" dy="24">不被验证设施占用</tspan></text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">连续非 AI 路径是设计意图，不是无障碍验收结果 · 道路、河道、站点、尺寸、材料、坡度、照明与恢复时长均保持未知</text>
