<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">04 / HUMAN JOURNEY / 慢行与蓝绿</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">一个人先完成普通旅程，验证只在路径外出现</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">蓝绿与维护基线贯穿全程；故障隔离验证叠层，人工交接和安全离开继续。</text>
