<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S03 / THREE PLAN PROTOTYPES / KEY AREAS</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">One spatial decision, three non-interchangeable answers</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">Common ruling: proof may not take ordinary ground. Each place answers with beside, stepped-back courts or off-route service. G0 · provisional · not approved.</text>
