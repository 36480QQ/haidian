<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Twin-Track Jing-Zhang: three non-interchangeable prototypes for the spatial-atlas reading</title><desc id="desc">Read this plan with the three-switchyard spatial atlas: Zhongzhiyuan keeps an ordinary bypass apart from a proof court; Origin Community joins two courts and four withdrawable nodes to one resident street; Dazhongsi keeps a four-way commuter cross apart from its service side. All are G0 concept relations, not to scale.</desc>
<defs><style>.s{font-family:"Segoe UI","Noto Sans",sans-serif}.ink{fill:#102A43}.muted{fill:#526675}.micro{font-size:16px;font-weight:700}.small{font-size:19px;font-weight:750}.body{font-size:21px;font-weight:750}.label{font-size:23px;font-weight:850}.head{font-size:34px;font-weight:900}.kicker{font-size:17px;font-weight:900;letter-spacing:1.5px}.ordinary{stroke:#087E68}.proof{stroke:#167FA5}.failure{stroke:#D75D45}.cap{stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:14 10}</style><marker id="g" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L15 8L1 15Z" fill="#087E68"/></marker><marker id="r" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L15 8L1 15Z" fill="#D75D45"/></marker></defs>
<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/><text x="56" y="50" class="s kicker" fill="#D6A21D">TWIN-TRACK JING-ZHANG · G0 RELATION DIAGRAM · PROVISIONAL · NOT TO SCALE</text><text x="56" y="105" class="s head" fill="#FFF">Ordinary paths work first; each place stops and restores a different side layer</text><text x="1740" y="103" class="s micro" fill="#F8D56A" text-anchor="end">Concept relation only — not existing condition, boundary, approved design or delivery commitment</text><path d="M585 210L585 892M1215 210L1215 892" stroke="#C7D0CC" stroke-width="2" stroke-dasharray="8 12"/>
<g data-place-root="zhongzhiyuan" data-place="zhongzhiyuan" data-composition="parallel-isolated-proof-court"><text x="72" y="210" class="s kicker" fill="#087E68">01 VERIFY · ZHONGZHIYUAN</text><text x="72" y="248" class="s label ink">Parallel bypass / proof court</text><text x="72" y="278" class="s small muted">Proof is above; ordinary movement is below; they never cross.</text><path d="M128 680C225 645 340 708 500 674" fill="none" stroke="#DFF1EA" stroke-width="40" class="cap"/><path d="M128 680C225 645 340 708 500 674" fill="none" class="ordinary cap" stroke-width="9" marker-end="url(#g)"/><text x="125" y="736" class="s body" fill="#087E68">ORDINARY BYPASS / NON-AI CONTINUES</text><rect x="133" y="354" width="350" height="194" rx="86" fill="#DCEEF4" stroke="#167FA5" stroke-width="6" stroke-dasharray="17 11"/><rect x="180" y="401" width="256" height="100" rx="48" fill="#FFF" stroke="#167FA5" stroke-width="3"/><text x="308" y="451" class="s label" fill="#167FA5" text-anchor="middle">PROOF COURT</text><text x="308" y="482" class="s small" fill="#167FA5" text-anchor="middle">stoppable side layer</text><path d="M112 592L500 592" stroke="#C58A17" stroke-width="18" stroke-linecap="round"/><path d="M112 592L500 592" stroke="#FFF6DE" stroke-width="8" stroke-dasharray="18 10"/><text x="306" y="626" class="s small" fill="#A56F0F" text-anchor="middle">ISOLATION EDGE / OFF BYPASS</text><circle cx="145" cy="650" r="27" fill="#FFF7E6" stroke="#C58A17" stroke-width="3"/><text x="145" y="657" class="s label" fill="#A56F0F" text-anchor="middle">H</text><text x="185" y="657" class="s body ink">STAFFED HANDOFF</text><path d="M435 330C500 355 524 413 488 470" fill="none" class="failure cap" stroke-width="5" stroke-dasharray="8 9" marker-end="url(#r)"/><path d="M482 508l24-24 24 24-24 24z" fill="#F8E4DE" stroke="#D75D45" stroke-width="4"/><text x="530" y="515" class="s body" fill="#D75D45">STOP PROOF</text><text x="83" y="815" class="s micro" fill="#D75D45">FAILURE: equipment and enclosure leave; the bypass continues.</text><text x="83" y="850" class="s micro ink">RECOVERY: recheck court and environment; not authorization or G1.</text></g>
<g data-place-root="origin-community" data-place="origin-community" data-composition="one-street-two-courts-four-withdrawals"><text x="625" y="210" class="s kicker" fill="#B77A13">02 CO-CREATE · ORIGIN COMMUNITY</text><text x="625" y="248" class="s label ink">One street / two courts / four nodes</text><text x="625" y="278" class="s small muted">Withdraw by node; the resident street stays open.</text><path d="M640 690C735 630 830 744 930 682S1110 638 1170 705" fill="none" stroke="#DFF1EA" stroke-width="44" class="cap"/><path d="M640 690C735 630 830 744 930 682S1110 638 1170 705" fill="none" class="ordinary cap" stroke-width="10" marker-end="url(#g)"/><text x="655" y="744" class="s body" fill="#087E68">RESIDENT STREET / ORDINARY PASSAGE</text><path d="M698 420L792 350 886 420V548H698Z" fill="#FFF9EB" stroke="#B77A13" stroke-width="5"/><text x="792" y="466" class="s label" fill="#B77A13" text-anchor="middle">PROBLEM COURT</text><path d="M958 486L1052 416 1146 486V614H958Z" fill="#EEF8FB" stroke="#167FA5" stroke-width="5"/><text x="1052" y="534" class="s label" fill="#167FA5" text-anchor="middle">REVIEW COURT</text><path d="M670 371C800 305 1030 316 1172 431" fill="none" class="proof cap dash" stroke-width="6"/><rect x="745" y="310" width="360" height="42" rx="16" fill="#F5F1E8"/><text x="925" y="338" class="s small" fill="#167FA5" text-anchor="middle">OPTIONAL PROOF BESIDE TWO COURTS</text><g fill="#FFF" stroke="#D75D45" stroke-width="4"><circle cx="742" cy="667" r="21"/><circle cx="842" cy="708" r="21"/><circle cx="958" cy="670" r="21"/><circle cx="1064" cy="658" r="21"/></g><text x="742" y="675" class="s body" fill="#D75D45" text-anchor="middle">1</text><text x="842" y="716" class="s body" fill="#D75D45" text-anchor="middle">2</text><text x="958" y="678" class="s body" fill="#D75D45" text-anchor="middle">3</text><text x="1064" y="666" class="s body" fill="#D75D45" text-anchor="middle">4</text><rect x="676" y="775" width="280" height="65" rx="18" fill="#DDEEF4" stroke="#167FA5" stroke-width="3"/><text x="816" y="815" class="s body" fill="#167FA5" text-anchor="middle">PAPER / ORAL HANDOFF</text><text x="625" y="870" class="s micro" fill="#D75D45">FAILURE: nodes withdraw one by one; street and daily court use remain.</text><text x="625" y="904" class="s micro ink">RECOVERY: temporary screens and capture leave; resident use returns first.</text></g>
<g data-place-root="dazhongsi" data-place="dazhongsi" data-composition="four-way-commute-off-route-service"><text x="1252" y="210" class="s kicker" fill="#D75D45">03 PUBLISH · DAZHONGSI</text><text x="1252" y="248" class="s label ink">Four-way commute / off-route service</text><text x="1252" y="278" class="s small muted">Hall, desk and quiet rest never become a commuter queue.</text><circle cx="1480" cy="597" r="72" fill="#DFF1EA"/><path d="M1284 597H1710M1480 380V818" fill="none" class="ordinary cap" stroke-width="25"/><circle cx="1480" cy="597" r="40" fill="#FFF" stroke="#087E68" stroke-width="6"/><text x="1480" y="860" class="s body" fill="#087E68" text-anchor="middle">FOUR-WAY COMMUTE / NON-AI CONTINUES</text><rect x="1260" y="380" width="195" height="118" rx="42" fill="#FFF4D9" stroke="#B77A13" stroke-width="5" stroke-dasharray="14 9"/><text x="1358" y="427" class="s label" fill="#B77A13" text-anchor="middle">OFF-ROUTE HALL</text><text x="1358" y="458" class="s small" fill="#B77A13" text-anchor="middle">source · correction</text><rect x="1572" y="696" width="170" height="96" rx="22" fill="#DDEEF4" stroke="#167FA5" stroke-width="4"/><text x="1657" y="751" class="s body" fill="#167FA5" text-anchor="middle">STAFFED DESK</text><rect x="1258" y="713" width="238" height="82" rx="38" fill="#FFF" stroke="#6B7280" stroke-width="3"/><text x="1377" y="761" class="s body" fill="#526675" text-anchor="middle">QUIET REST</text><path d="M1280 520H1455" class="failure cap" stroke-width="7" stroke-dasharray="7 9"/><path d="M1395 490C1445 466 1470 486 1472 545" fill="none" class="failure cap" stroke-width="4" marker-end="url(#r)"/><text x="1260" y="565" class="s small" fill="#D75D45">STOP SERVICE SIDE, NOT CROSS</text><text x="1252" y="904" class="s micro" fill="#D75D45">FAILURE: source, screens and queue leave; staff keeps a non-AI route.</text><text x="1252" y="938" class="s micro ink">RECOVERY: correct source and retest; not approval, authorization or G1.</text></g>
<rect x="52" y="974" width="1696" height="72" rx="16" fill="#E7ECEC" stroke="#B9C7CA" stroke-width="2"/><text x="78" y="1005" class="s micro ink">Read the ordinary path first, then the stoppable overlay. Failure never stops ordinary life; recovery returns a specific ordinary place. Evidence: PROV-KEY-001—003 · key-area-evidence-matrix · restoration register · non-AI parity contract.</text><text x="78" y="1032" class="s micro" fill="#9A3F2F">LIMITS: dimensions, materials, connections, anchors, specialist conditions and real recovery duration are unknown; FIELD / GO / APPROVAL = 0; RIGHTS = not_fully_cleared.</text><text x="1745" y="1081" class="s micro" fill="#D75D45" text-anchor="end">Concept relation diagram; it proves no existing condition, delivery, staffing commitment, accessibility result or statutory boundary.</text>
<text x="56" y="135" class="s micro" fill="#D8E2E7">READ WITH THE THREE-SWITCHYARD SPATIAL ATLAS: ordinary first · side proof stops · staffed handoff remains · recovery returns to the named ordinary place.</text>
</svg>
