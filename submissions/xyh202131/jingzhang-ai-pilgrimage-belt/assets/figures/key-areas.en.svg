<title id="title">One spatial decision, three non-interchangeable answers</title><desc id="desc">The three concept plans reject proof crossing the ordinary route, proof nodes taking the resident street, and service taking the commute centre; they keep side proof, courts stepped back, and off-route staffed service.</desc>
