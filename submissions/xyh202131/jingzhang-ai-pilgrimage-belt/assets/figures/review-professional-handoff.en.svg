<text x="1026" y="318" fill="#17364d" font-family="Noto Sans SC, sans-serif" font-size="18" font-weight="700">01 AUTHORITY + SCOPE</text>
<text x="1026" y="353" fill="#e85c42" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700">H01 duty acceptance · H02 scope</text>
<text x="1026" y="388" fill="#647786" font-family="Noto Sans SC, sans-serif" font-size="15" font-weight="400">Named duties, reachable stop chain, exact activity / site / time / data</text>
<text x="1668" y="354" fill="#e85c42" font-family="Noto Sans SC, sans-serif" font-size="20" font-weight="700" text-anchor="end">0 / 2</text>
