<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">Stop, removal and restoration are three different spatial actions</title><desc id="desc">Three distinct reversible assembly and restoration sequences for a parallel proof court, street-court withdrawal nodes and off-route hall and staffed desk.</desc>
