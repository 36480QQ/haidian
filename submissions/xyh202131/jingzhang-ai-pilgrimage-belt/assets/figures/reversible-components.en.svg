<text x="675" y="785" class="sans small" fill="#D75D45" text-anchor="start">RESTORATION PACK</text>
<text id="restore-pack-2-details" x="675" y="807" class="sans tiny" fill="#526675" text-anchor="start"><tspan x="675" dy="0">freeze new task → remove nodes/inserts → return street/courts</tspan><tspan x="675" dy="20">paper / spoken / staffed first</tspan></text>
<circle cx="900" cy="599" r="8" fill="#102A43"/>
<path d="M900 610 L900 638 M900 619 L885 632 M900 619 L915 632 M900 638 L888 658 M900 638 L912 658" fill="none" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<text x="1235" y="260" class="sans kicker" fill="#D75D45" text-anchor="start">03 大钟寺 / OFF-ROUTE HALL + DESK</text>
<text x="1235" y="302" class="sans body" fill="#102A43" text-anchor="start">Close off-route service; keep commute cross clear</text>
<line x1="1480" y1="425" x2="1480" y2="740" stroke="#DFF1EA" stroke-width="72" stroke-linecap="round"/>
<line x1="1260" y1="590" x2="1710" y2="590" stroke="#DFF1EA" stroke-width="72" stroke-linecap="round"/>
