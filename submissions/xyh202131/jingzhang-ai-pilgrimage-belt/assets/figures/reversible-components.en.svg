<text x="530" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">OPEN CHECK</text>
<line x1="558" y1="955" x2="762" y2="955" stroke="#C7D0CC" stroke-width="4" stroke-linecap="round"/>
<circle cx="790" cy="955" r="22" fill="#FFFFFF" stroke="#087E68" stroke-width="4"/>
<text x="790" y="962" class="sans tiny" fill="#087E68" text-anchor="middle">3</text>
<text x="790" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">ORDINARY</text>
<line x1="818" y1="955" x2="1022" y2="955" stroke="#C7D0CC" stroke-width="4" stroke-linecap="round"/>
<circle cx="1050" cy="955" r="22" fill="#FFFFFF" stroke="#D75D45" stroke-width="4"/>
<text x="1050" y="962" class="sans tiny" fill="#D75D45" text-anchor="middle">4</text>
<text x="1050" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">STOP + ISOLATE</text>
<line x1="1078" y1="955" x2="1282" y2="955" stroke="#C7D0CC" stroke-width="4" stroke-linecap="round"/>
<circle cx="1310" cy="955" r="22" fill="#FFFFFF" stroke="#D75D45" stroke-width="4"/>
