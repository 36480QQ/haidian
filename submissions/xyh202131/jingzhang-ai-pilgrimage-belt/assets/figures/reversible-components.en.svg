<text x="310" y="330" class="sans small" fill="#D75D45" text-anchor="middle">PHYSICAL STOP FIRST</text>
<text x="335" y="550" class="sans small" fill="#167FA5" text-anchor="middle">ENCLOSURE + TEMP KIT</text>
<rect x="80" y="750" width="465" height="92" rx="20" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="105" y="785" class="sans small" fill="#D75D45" text-anchor="start">RESTORATION PACK</text>
<text id="restore-pack-1-details" x="105" y="807" class="sans tiny" fill="#526675" text-anchor="start"><tspan x="105" dy="0">remove edge → count kit → repair surface/soil</tspan><tspan x="105" dy="20">confirm bypass clearance</tspan></text>
<circle cx="130" cy="586" r="7" fill="#102A43"/>
