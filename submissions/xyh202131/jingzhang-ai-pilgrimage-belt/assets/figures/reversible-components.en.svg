<text x="1310" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">REMOVE + EXIT</text>
<line x1="1338" y1="955" x2="1542" y2="955" stroke="#C7D0CC" stroke-width="4" stroke-linecap="round"/>
<circle cx="1570" cy="955" r="22" fill="#FFFFFF" stroke="#D75D45" stroke-width="4"/>
<text x="1570" y="962" class="sans tiny" fill="#D75D45" text-anchor="middle">6</text>
<text x="1570" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">RESTORE + ACCEPT</text>
<rect x="50" y="1018" width="1700" height="64" rx="16" fill="#102A43"/>
<text id="reversible-footer" x="900" y="1039" class="sans micro" fill="#FFFFFF" text-anchor="middle"><tspan x="900" dy="0">G0 REVERSIBLE INTENT · Stop, removal and restoration objects are legible; location, dimensions, material, connection,</tspan><tspan x="900" dy="21">fire safety, railway safety, duty and recovery time remain unknown / 0 · restoration is not approval, GO or G1</tspan></text>
