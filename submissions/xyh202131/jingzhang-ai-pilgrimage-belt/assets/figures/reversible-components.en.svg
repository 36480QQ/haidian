<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S08 / REVERSIBLE ASSEMBLY ATLAS / REVERSIBLE COMPONENTS</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">Stop, removal and restoration are three different spatial actions</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">Only proof is removed; ordinary paths, staff and safe exit stay. Concept only—not a material or construction detail.</text>
<line x1="600" y1="230" x2="600" y2="880" stroke="#C7D0CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 9"/>
<line x1="1200" y1="230" x2="1200" y2="880" stroke="#C7D0CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 9"/>
<text x="55" y="260" class="sans kicker" fill="#167FA5" text-anchor="start">01 众智园 / PARALLEL PROOF COURT</text>
<text x="55" y="302" class="sans body" fill="#102A43" text-anchor="start">Remove enclosure and kit; keep parallel bypass</text>
<path d="M85 670 C210 620 350 685 550 625" fill="none" stroke="#DFF1EA" stroke-width="62" stroke-linecap="round"/>
<path d="M85 670 C210 620 350 685 550 625" fill="none" stroke="#087E68" stroke-width="10" stroke-linecap="round" marker-end="url(#greenArrow)"/>
