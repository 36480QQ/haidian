<line x1="1090" y1="637" x2="1090" y2="570" stroke="#D75D45" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/>
<text x="910" y="360" class="sans small" fill="#D75D45" text-anchor="middle">LIFT COURT INSERTS OUT</text>
<path d="M820 405 Q910 330 1005 395" fill="none" stroke="#D75D45" stroke-width="5" marker-end="url(#coralArrow)"/>
