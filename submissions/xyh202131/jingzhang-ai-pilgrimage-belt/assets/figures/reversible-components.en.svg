<circle cx="270" cy="955" r="22" fill="#FFFFFF" stroke="#087E68" stroke-width="4"/>
<text x="270" y="962" class="sans tiny" fill="#087E68" text-anchor="middle">1</text>
<text x="270" y="1000" class="sans tiny" fill="#526675" text-anchor="middle">EVIDENCE</text>
<line x1="298" y1="955" x2="502" y2="955" stroke="#C7D0CC" stroke-width="4" stroke-linecap="round"/>
<circle cx="530" cy="955" r="22" fill="#FFFFFF" stroke="#087E68" stroke-width="4"/>
