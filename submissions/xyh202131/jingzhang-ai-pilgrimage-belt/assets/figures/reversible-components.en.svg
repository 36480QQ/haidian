<path d="M1415 445 L1515 365" stroke="#D75D45" stroke-width="6" marker-end="url(#coralArrow)"/>
<path d="M1640 670 L1690 610" stroke="#D75D45" stroke-width="5" marker-end="url(#coralArrow)"/>
<text x="1570" y="350" class="sans small" fill="#D75D45" text-anchor="middle">DECIDE AFTER SOURCE CORRECTION</text>
<rect x="1245" y="780" width="480" height="92" rx="20" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="1270" y="815" class="sans small" fill="#D75D45" text-anchor="start">RESTORATION PACK</text>
<text id="restore-pack-3-details" x="1270" y="837" class="sans tiny" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">stop publish → close service side → clear hall/desk</tspan><tspan x="1270" dy="20">recheck sources; route stays open</tspan></text>
<circle cx="1460" cy="496" r="7" fill="#102A43"/>
<path d="M1460 506 L1460 532 M1460 515 L1446 527 M1460 515 L1474 527 M1460 532 L1448 552 M1460 532 L1472 552" fill="none" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
