<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">四态静态故事板</title><desc id="figure-desc">绿色普通地面连续，蓝色验证在旁侧，故障只隔离蓝色对象，恢复普通任务、实体信息、人工服务和安静通行，不画重启箭头。</desc>
<defs><style><![CDATA[.sans{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif}.ink{fill:#17364d}.muted{fill:#5c6d77}.small{font-size:18px}.label{font-size:25px;font-weight:700;letter-spacing:2px}.state{font-size:34px;font-weight:700}.body{font-size:19px}.cap{font-size:16px;font-weight:700;letter-spacing:1px}]]></style></defs>
<rect width="1800" height="1100" fill="#f4f0e7"/>
<g id="ruling-boundary"><rect width="1800" height="180" fill="#102d46"/><text x="58" y="53" class="sans label" fill="#ffc21a">S06 / 四态静态故事板</text><text x="58" y="109" class="sans" font-size="43" font-weight="700" fill="#fff">普通地面先连续；验证只在旁侧、可停、可撤</text><rect x="1193" y="34" width="548" height="94" rx="18" fill="none" stroke="#8798a5" stroke-width="2" stroke-dasharray="8 8"/><text x="1220" y="72" class="sans cap" fill="#dce6eb">G0 · NO-GO · PROVISIONAL · 现实结果 0</text><text x="1220" y="103" class="sans small" fill="#dce6eb">概念表达；不构成现场、批准或官方边界证据</text></g>
<g id="state-sequence"><path d="M72 226H1728" fill="none" stroke="#d7d0c2" stroke-width="2"/>
<g id="state-column-ordinary"><circle cx="205" cy="273" r="32" fill="#00856f"/><text x="205" y="282" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#fff">01</text><text id="state-label-ordinary" x="255" y="283" class="sans state ink">普通</text><text x="255" y="316" class="sans body muted">非 AI 同任务先成立</text><rect x="115" y="355" width="290" height="130" rx="22" fill="#fff" stroke="#c6ddd8" stroke-width="2"/><text x="145" y="397" class="sans cap" fill="#00856f">纸面 · 口述 · 实体导视</text><text x="145" y="432" class="sans body ink">不用账户、扫码或设备</text></g>
<g id="state-column-verify"><circle cx="637" cy="273" r="32" fill="#1681aa"/><text x="637" y="282" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#fff">02</text><text id="state-label-verify" x="687" y="283" class="sans state ink">验证</text><text x="687" y="316" class="sans body muted">自愿、限域、可退出</text><rect x="547" y="355" width="290" height="130" rx="22" fill="#e9f6fb" stroke="#1681aa" stroke-width="2"/><text x="577" y="397" class="sans cap" fill="#1681aa">旁置验证层</text><text x="577" y="432" class="sans body ink">从不占用普通地面</text></g>
<g id="state-column-fault"><circle cx="1069" cy="273" r="32" fill="#e85c42"/><text x="1069" y="282" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#fff">03</text><text id="state-label-fault" x="1119" y="283" class="sans state ink">故障</text><text x="1119" y="316" class="sans body muted">只停验证对象</text><rect x="979" y="355" width="290" height="130" rx="22" fill="#fff4ef" stroke="#e85c42" stroke-width="2"/><text x="1009" y="397" class="sans cap" fill="#e85c42">蓝色对象隔离</text><text x="1009" y="432" class="sans body ink">普通生活与人工交接继续</text></g>
<g id="state-column-recover"><circle cx="1501" cy="273" r="32" fill="#bd7700"/><text x="1501" y="282" text-anchor="middle" class="sans" font-size="24" font-weight="700" fill="#fff">04</text><text id="state-label-recover" x="1551" y="283" class="sans state ink">恢复</text><text x="1551" y="316" class="sans body muted">先恢复普通任务与证据状态</text><rect x="1411" y="355" width="290" height="130" rx="22" fill="#fff7e8" stroke="#bd7700" stroke-width="2"/><text x="1441" y="397" class="sans cap" fill="#bd7700">实体信息 · 人工服务</text><text x="1441" y="432" class="sans body ink">不是重启、授权、批准或 G1</text></g></g>
