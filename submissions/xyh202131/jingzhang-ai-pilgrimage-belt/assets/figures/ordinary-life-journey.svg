<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">一人一事一处：三种普通生活任务</title>
<desc id="desc">以到达、理解、完成、纠正或撤回、离开五个动作，比较众智园平行旁路、原点社区居民街与大钟寺四向通勤。故障只停止验证叠层，普通任务与人工路径继续。</desc>
<defs>
  <style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.k{font-size:18px;font-weight:800;letter-spacing:1.5px}.h{font-size:42px;font-weight:900}.sub{font-size:21px;font-weight:700}.label{font-size:27px;font-weight:900}.body{font-size:18px;font-weight:700}.small{font-size:16px;font-weight:650}.micro{font-size:14px;font-weight:650}.step{font-size:17px;font-weight:900}</style>
  <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087e68"/></marker>
  <g id="person" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="-20" r="8" fill="#102d46" stroke="none"/><path d="M0 -10V20M0 0L-15 13M0 0L15 13M0 20L-13 40M0 20L14 40"/></g>
  <g id="seated" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="-4" cy="-19" r="8" fill="#102d46" stroke="none"/><path d="M-4 -9L2 14H24M2 14L-8 32M24 14L31 34"/><circle cx="12" cy="31" r="17"/></g>
</defs>
<rect width="1800" height="1100" fill="#f4f0e7"/>
<rect width="1800" height="148" fill="#102d46"/>
<text x="56" y="48" class="sans k" fill="#ffc21a">S05 / HUMAN TASK LENS / 人本任务镜头</text>
<text x="56" y="105" class="sans h" fill="#fff">一人一事一处：先看普通任务能否完整完成</text>
<text x="56" y="180" class="sans sub" fill="#536a7b">同一五动作镜头，不复制同一空间答案；验证在旁侧，故障时普通生活不断线。</text>
<g class="sans" transform="translate(56 208)">
  <rect width="1688" height="84" rx="24" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
  <path d="M74 42H1590" stroke="#dcefe9" stroke-width="18" stroke-linecap="round"/>
  <path d="M74 42H1590" stroke="#087e68" stroke-width="4" marker-end="url(#arrow)"/>
  <g text-anchor="middle">
    <circle cx="92" cy="42" r="27" fill="#087e68"/><text x="92" y="48" class="step" fill="#fff">1</text><text x="92" y="76" class="micro" fill="#102d46">到达</text>
    <circle cx="448" cy="42" r="27" fill="#167fa5"/><text x="448" y="48" class="step" fill="#fff">2</text><text x="448" y="76" class="micro" fill="#102d46">理解</text>
    <circle cx="804" cy="42" r="27" fill="#bd7700"/><text x="804" y="48" class="step" fill="#fff">3</text><text x="804" y="76" class="micro" fill="#102d46">完成</text>
    <circle cx="1160" cy="42" r="27" fill="#d75d45"/><text x="1160" y="48" class="step" fill="#fff">4</text><text x="1160" y="76" class="micro" fill="#102d46">纠正或撤回</text>
    <circle cx="1516" cy="42" r="27" fill="#102d46"/><text x="1516" y="48" class="step" fill="#fff">5</text><text x="1516" y="76" class="micro" fill="#102d46">离开</text>
  </g>
</g>
<line x1="608" y1="320" x2="608" y2="984" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<line x1="1192" y1="320" x2="1192" y2="984" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<g class="sans">
  <text x="56" y="350" class="k" fill="#167fa5">01 VERIFY · 众智园</text>
  <text x="56" y="391" class="label" fill="#102d46">沿旁路办完一件事</text>
  <text x="56" y="422" class="small" fill="#536a7b">平行旁路绕过可关闭的证明庭</text>
  <ellipse cx="330" cy="552" rx="176" ry="88" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/>
  <ellipse cx="330" cy="552" rx="114" ry="49" fill="#fff" stroke="#167fa5" stroke-width="3" stroke-dasharray="11 9"/>
  <text x="330" y="548" text-anchor="middle" class="body" fill="#167fa5">可选证明庭</text><text x="330" y="576" text-anchor="middle" class="micro" fill="#536a7b">可观察 · 可物理停止</text>
  <path d="M74 712C185 676 353 746 558 690" fill="none" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/>
  <path d="M74 712C185 676 353 746 558 690" fill="none" stroke="#087e68" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
  <use href="#person" transform="translate(112 672)"/><use href="#seated" transform="translate(252 696)"/>
  <rect x="390" y="624" width="152" height="62" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="3"/><text x="466" y="663" text-anchor="middle" class="body" fill="#9a6200">人工解释台</text>
  <text x="56" y="794" class="body" fill="#102d46">到达旁路 → 看实体状态 → 找人工完成 → 纠错 → 安全离开</text>
  <rect x="56" y="824" width="496" height="132" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
  <text x="78" y="858" class="small" fill="#167fa5">验证停：证明庭关闭并清场</text><text x="78" y="891" class="small" fill="#087e68">人仍能：到达、理解、完成人工任务并离开</text><text x="78" y="924" class="micro" fill="#536a7b">不穿越验证区；两条平行关系一眼可辨</text>

  <text x="640" y="350" class="k" fill="#bd7700">02 CO-CREATE · 原点社区</text>
  <text x="640" y="391" class="label" fill="#102d46">提出问题，也能撤回</text>
  <text x="640" y="422" class="small" fill="#536a7b">居民街连续，两座院落退后，四节点可退出</text>
  <rect x="668" y="485" width="190" height="142" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="5"/><rect x="716" y="523" width="94" height="66" fill="#fff" stroke="#bd7700" stroke-width="3" stroke-dasharray="10 8"/><text x="763" y="563" text-anchor="middle" class="body" fill="#9a6200">问题院</text>
  <rect x="966" y="465" width="190" height="162" rx="18" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/><rect x="1014" y="511" width="94" height="72" fill="#fff" stroke="#167fa5" stroke-width="3"/><text x="1061" y="554" text-anchor="middle" class="body" fill="#167fa5">评议院</text>
  <path d="M644 712C788 682 954 732 1162 690" fill="none" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/><path d="M644 712C788 682 954 732 1162 690" fill="none" stroke="#087e68" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
  <use href="#person" transform="translate(676 671)"/>
  <g class="body" text-anchor="middle" fill="#d75d45"><circle cx="760" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="760" y="711">1</text><circle cx="860" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="860" y="711">2</text><circle cx="960" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="960" y="711">3</text><circle cx="1060" cy="704" r="23" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="1060" y="711">4</text></g>
  <text x="640" y="794" class="body" fill="#102d46">进入居民街 → 纸面/口述理解 → 人工办理 → 撤回 → 回到日常</text>
  <rect x="640" y="824" width="496" height="132" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
  <text x="662" y="858" class="small" fill="#bd7700">验证停：节点逐个撤回，院内插件退出</text><text x="662" y="891" class="small" fill="#087e68">人仍能：沿街到达、纸面问询、申诉并离开</text><text x="662" y="924" class="micro" fill="#536a7b">节点不占街；撤回是完整动作，不是异常状态</text>

  <text x="1224" y="350" class="k" fill="#d75d45">03 PUBLISH · 大钟寺</text>
  <text x="1224" y="391" class="label" fill="#102d46">继续通勤，顺手核来源</text>
  <text x="1224" y="422" class="small" fill="#536a7b">四向中心净空，发布与人工服务退到路外</text>
  <rect x="1260" y="468" width="174" height="104" fill="#fee5de" stroke="#d75d45" stroke-width="4" stroke-dasharray="12 9"/><text x="1347" y="514" text-anchor="middle" class="body" fill="#d75d45">路外信息厅</text><text x="1347" y="543" text-anchor="middle" class="micro" fill="#536a7b">来源 · 拒绝 · 申诉</text>
  <path d="M1236 690H1738M1490 455V800" stroke="#dcefe9" stroke-width="72" stroke-linecap="round"/><path d="M1236 690H1738M1490 455V800" stroke="#087e68" stroke-width="11" stroke-linecap="round"/>
  <circle cx="1490" cy="690" r="52" fill="#fff" stroke="#087e68" stroke-width="6"/><text x="1490" y="697" text-anchor="middle" class="body" fill="#087e68">净空通行</text>
  <use href="#person" transform="translate(1280 648)"/><use href="#seated" transform="translate(1670 652)"/><use href="#person" transform="translate(1538 764)"/>
  <rect x="1560" y="500" width="166" height="68" rx="20" fill="#d8edf3" stroke="#167fa5" stroke-width="4"/><text x="1643" y="542" text-anchor="middle" class="body" fill="#167fa5">双入口人工台</text>
  <text x="1224" y="846" class="body" fill="#102d46">四向到达 → 看实体来源 → 人工纠错 → 完成通勤 → 离开</text>
  <rect x="1224" y="876" width="520" height="80" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
  <text x="1246" y="909" class="small" fill="#d75d45">验证停：发布层与自动服务退出通行面</text><text x="1246" y="940" class="small" fill="#087e68">人仍能：通勤、安静休息、人工服务与离开</text>
</g>
<rect x="48" y="1000" width="1704" height="62" rx="20" fill="#102d46"/>
<text x="900" y="1039" text-anchor="middle" class="sans small" fill="#fff">G0 概念关系 · 匿名人物为自制通用图示，非真实人员或公众反馈 · 非 AI 同任务优先 · 非现场证据、非无障碍结果</text>
</svg>
