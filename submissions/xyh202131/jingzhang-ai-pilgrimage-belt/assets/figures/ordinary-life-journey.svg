<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">同一公共权利，三处形成不同的普通生活空间</title>
<desc id="desc">众智园以平行旁路绕开旁置证明庭，原点社区以一条居民街串联两座退后院落，大钟寺保持四向通勤中心净空并将信息厅和人工台置于路外。三处均保留完整非 AI 任务。</desc>
<defs>
  <style>.sans{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",Arial,sans-serif}.k{font-size:19px;font-weight:800;letter-spacing:1.6px}.h{font-size:42px;font-weight:900}.sub{font-size:22px;font-weight:700}.label{font-size:26px;font-weight:900}.body{font-size:18px;font-weight:650}.small{font-size:16px;font-weight:650}.micro{font-size:14px;font-weight:650}</style>
  <marker id="arrow" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L15 8 L1 15 Z" fill="#087e68"/></marker>
  <g id="person" stroke="#102d46" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="0" cy="-20" r="7" fill="#102d46" stroke="none"/><path d="M0 -12V18M0 -2L-15 12M0 -2L15 12M0 18L-13 38M0 18L14 38"/></g>
</defs>
<rect width="1800" height="1100" fill="#f4f0e7"/>
<rect width="1800" height="142" fill="#102d46"/>
<text x="56" y="52" class="sans k" fill="#ffc21a">S05 / HUMAN-SCALE ORDINARY LIFE / 人尺度普通生活</text>
<text x="56" y="108" class="sans h" fill="#fff">同一公共权利，不复制同一空间答案</text>
<text x="56" y="178" class="sans sub" fill="#536a7b">先看人如何进入、询问、完成人工任务并离开；验证对象始终在旁侧，可停、可撤，不构成现场或无障碍结果。</text>
<line x1="600" y1="215" x2="600" y2="978" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<line x1="1200" y1="215" x2="1200" y2="978" stroke="#c6d2d3" stroke-width="2" stroke-dasharray="9 10"/>
<text x="56" y="235" class="sans k" fill="#167fa5">01 VERIFY · 众智园</text>
<text x="56" y="276" class="sans label" fill="#102d46">平行旁路 + 旁置证明庭</text>
<ellipse cx="320" cy="470" rx="205" ry="125" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/>
<ellipse cx="320" cy="470" rx="145" ry="82" fill="#fff" stroke="#167fa5" stroke-width="4" stroke-dasharray="12 10"/>
<text x="320" y="456" text-anchor="middle" class="sans body" fill="#167fa5">可选证明庭</text>
<text x="320" y="486" text-anchor="middle" class="sans small" fill="#536a7b">围合 · 可观察 · 可物理停止</text>
<path d="M70 706 C205 670 352 728 548 684" fill="none" stroke="#dcefe9" stroke-width="76" stroke-linecap="round"/>
<path d="M70 706 C205 670 352 728 548 684" fill="none" stroke="#087e68" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<use href="#person" transform="translate(125 664)"/><use href="#person" transform="translate(410 687)"/>
<rect x="382" y="587" width="150" height="62" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="3"/>
<text x="457" y="626" text-anchor="middle" class="sans body" fill="#9a6200">人工交接</text>
<text x="56" y="790" class="sans body" fill="#087e68">普通任务：沿旁路进入 → 看实体状态 → 找人工 → 纠错或离开</text>
<rect x="56" y="818" width="488" height="112" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="78" y="850" class="sans small" fill="#167fa5">验证停：关闭并清场证明庭</text><text x="78" y="881" class="sans small" fill="#102d46">仍继续：旁路、观察、人工解释、安全离开</text><text x="78" y="912" class="sans micro" fill="#536a7b">空间识别：两条平行关系，而非穿越同一路径</text>
<text x="636" y="235" class="sans k" fill="#bd7700">02 CO-CREATE · 原点社区</text>
<text x="636" y="276" class="sans label" fill="#102d46">一街两院 + 四个撤回节点</text>
<rect x="666" y="355" width="205" height="190" rx="18" fill="#fff2d2" stroke="#bd7700" stroke-width="5"/>
<rect x="720" y="405" width="97" height="90" fill="#fff" stroke="#bd7700" stroke-width="3" stroke-dasharray="10 8"/>
<text x="768" y="455" text-anchor="middle" class="sans body" fill="#9a6200">问题院</text>
<rect x="950" y="335" width="205" height="210" rx="18" fill="#d8edf3" stroke="#167fa5" stroke-width="5"/>
<rect x="1004" y="395" width="97" height="90" fill="#fff" stroke="#167fa5" stroke-width="3"/>
<text x="1052" y="445" text-anchor="middle" class="sans body" fill="#167fa5">评议院</text>
<path d="M636 706 C780 676 954 726 1168 684" fill="none" stroke="#dcefe9" stroke-width="76" stroke-linecap="round"/>
<path d="M636 706 C780 676 954 726 1168 684" fill="none" stroke="#087e68" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
<use href="#person" transform="translate(686 664)"/><use href="#person" transform="translate(1110 674)"/>
<g class="sans body" text-anchor="middle" fill="#d75d45"><circle cx="748" cy="695" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="748" y="702">1</text><circle cx="850" cy="696" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="850" y="703">2</text><circle cx="952" cy="697" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="952" y="704">3</text><circle cx="1054" cy="694" r="24" fill="#fff" stroke="#d75d45" stroke-width="4"/><text x="1054" y="701">4</text></g>
<text x="636" y="790" class="sans body" fill="#087e68">普通任务：沿居民街进入 → 纸面/口述问询 → 人工办理 → 撤回或离开</text>
<rect x="636" y="818" width="488" height="112" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="658" y="850" class="sans small" fill="#bd7700">验证停：节点逐个撤回，院内插件退出</text><text x="658" y="881" class="sans small" fill="#102d46">仍继续：居民街、纸面入口、人工任务与申诉</text><text x="658" y="912" class="sans micro" fill="#536a7b">空间识别：一条街串两座退后院落，节点不占街</text>
<text x="1236" y="235" class="sans k" fill="#d75d45">03 PUBLISH · 大钟寺</text>
<text x="1236" y="276" class="sans label" fill="#102d46">四向通勤 + 路外人工服务</text>
<rect x="1270" y="352" width="170" height="120" fill="#fee5de" stroke="#d75d45" stroke-width="4" stroke-dasharray="12 9"/>
<text x="1355" y="405" text-anchor="middle" class="sans body" fill="#d75d45">路外信息厅</text><text x="1355" y="436" text-anchor="middle" class="sans small" fill="#536a7b">来源 · 拒绝 · 申诉</text>
<path d="M1240 625 H1730 M1485 350 V835" stroke="#dcefe9" stroke-width="76" stroke-linecap="round"/>
<path d="M1240 625 H1730 M1485 350 V835" stroke="#087e68" stroke-width="12" stroke-linecap="round"/>
<circle cx="1485" cy="625" r="56" fill="#fff" stroke="#087e68" stroke-width="6"/>
<text x="1485" y="633" text-anchor="middle" class="sans body" fill="#087e68">净空通行</text>
<use href="#person" transform="translate(1298 585)"/><use href="#person" transform="translate(1665 585)"/><use href="#person" transform="translate(1538 740)"/>
<rect x="1570" y="760" width="155" height="72" rx="20" fill="#d8edf3" stroke="#167fa5" stroke-width="4"/>
<text x="1647" y="804" text-anchor="middle" class="sans body" fill="#167fa5">双入口人工台</text>
<text x="1236" y="884" class="sans body" fill="#087e68">普通任务：四向通行 → 看实体来源 → 人工纠错 → 继续通勤</text>
<rect x="1236" y="905" width="500" height="70" rx="20" fill="#fff" stroke="#c8d5d6" stroke-width="2"/>
<text x="1258" y="934" class="sans small" fill="#d75d45">验证停：发布层与自动服务退到路外</text><text x="1258" y="962" class="sans small" fill="#102d46">仍继续：中心通勤、安静休息、人工服务</text>
<rect x="48" y="1016" width="1704" height="52" rx="20" fill="#102d46"/>
<text x="900" y="1050" text-anchor="middle" class="sans small" fill="#fff">G0 概念关系 · 人物为通用图示、非真实人员或公众反馈 · 非 AI 同任务优先 · 非现场证据、非无障碍结果</text>
</svg>
