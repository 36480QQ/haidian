<text x="106" y="830" class="sans small" fill="#087E68" text-anchor="start"><tspan x="106" dy="0">连续日常首层：入口、通行、休憩、人工服务与离开不可被技术叠层切断</tspan><tspan x="106" dy="29">普通路径先成立；验证只能旁置</tspan></text>
<text x="106" y="892" class="sans micro" fill="#526675" text-anchor="start"><tspan x="106" dy="0">36/36 只表示机器可复算的概念单元</tspan><tspan x="106" dy="25">用途、权属、容积率、强度与建设规模均未获确认</tspan></text>
<rect x="1210" y="220" width="540" height="760" rx="22" fill="#FFFFFF" stroke="#C7D0CC" stroke-width="2"/><rect x="1210" y="220" width="9" height="760" rx="5" fill="#087E68"/>
<text x="1242" y="260" class="sans kicker" fill="#087E68" text-anchor="start">B / THREE GROUND-LEVEL DUTIES</text>
<text x="1242" y="298" class="sans label" fill="#102A43" text-anchor="start">同一首层，三种责任</text>
<rect x="1242" y="350" width="470" height="154" rx="24" fill="#DFF1EA" stroke="#087E68" stroke-width="3"/>
<text x="1270" y="386" class="sans kicker" fill="#087E68" text-anchor="start">01 ORDINARY</text>
<text x="1270" y="426" class="sans label" fill="#087E68" text-anchor="start">日常连续</text>
<text x="1270" y="460" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">无屏导向 + 人工入口</tspan><tspan x="1270" dy="27">路径与维护净空先成立</tspan></text>
<rect x="1242" y="545" width="470" height="154" rx="24" fill="#DCEEF4" stroke="#167FA5" stroke-width="3"/>
<text x="1270" y="581" class="sans kicker" fill="#167FA5" text-anchor="start">02 OPTIONAL</text>
<text x="1270" y="621" class="sans label" fill="#167FA5" text-anchor="start">验证旁置</text>
<text x="1270" y="655" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">自愿、公告、限域</tspan><tspan x="1270" dy="27">不占普通通行与安静休憩</tspan></text>
<rect x="1242" y="740" width="470" height="154" rx="24" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="1270" y="776" class="sans kicker" fill="#D75D45" text-anchor="start">03 EXIT / RESTORE</text>
<text x="1270" y="816" class="sans label" fill="#D75D45" text-anchor="start">退出与还场</text>
<text x="1270" y="850" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">物理停止 + 人工接管</tspan><tspan x="1270" dy="27">先还普通使用，不自动重启</tspan></text>
