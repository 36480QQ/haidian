<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S07 / SEASONAL CIVIC SECTION / CLIMATE RESILIENCE</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">Four seasons share one ordinary baseline; climate proof attaches to a removable edge</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">A continuous section orders shade, stormwater, quiet use, maintenance and staffed service without depicting the climate contract as built works.</text>
<text x="55" y="245" class="sans kicker" fill="#087E68" text-anchor="start">A / CONTINUOUS SEASONAL SECTION</text>
<text x="55" y="286" class="sans label" fill="#102A43" text-anchor="start">Layer outward from ordinary use; proof never occupies basic service</text>
