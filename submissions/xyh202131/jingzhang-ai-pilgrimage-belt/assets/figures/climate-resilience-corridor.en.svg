<title id="title">Four seasons share one ordinary baseline; climate proof attaches to a removable edge</title><desc id="desc">Conceptual seasonal civic-ground section showing continuous ordinary use, ecological and maintenance layers, removable sensing edge and four-state operation without built-condition claims.</desc>
