<text x="55" y="835" class="sans kicker" fill="#D75D45" text-anchor="start">B / ORDINARY—OPTIONAL—STOP—RESTORE</text>
<path d="M55 875 L430 875 L455 915 L430 955 L55 955 Z" fill="#DFF1EA" stroke="#087E68" stroke-width="3"/>
<text x="77" y="909" class="sans small" fill="#087E68" text-anchor="start">01 普通</text>
<text x="77" y="940" class="sans tiny" fill="#526675" text-anchor="start">通行、休憩、人工服务持续</text>
<path d="M475 875 L850 875 L875 915 L850 955 L475 955 Z" fill="#DCEEF4" stroke="#167FA5" stroke-width="3"/>
<text x="497" y="909" class="sans small" fill="#167FA5" text-anchor="start">02 可选验证</text>
<text x="497" y="940" class="sans tiny" fill="#526675" text-anchor="start">自愿进入旁侧；普通线不变</text>
<path d="M895 875 L1270 875 L1295 915 L1270 955 L895 955 Z" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="917" y="909" class="sans small" fill="#D75D45" text-anchor="start">03 故障停止</text>
<text x="917" y="940" class="sans tiny" fill="#526675" text-anchor="start">停活动与设备；人工接管</text>
<path d="M1315 875 L1690 875 L1715 915 L1690 955 L1315 955 Z" fill="#FFF4D9" stroke="#B77A13" stroke-width="3"/>
<text x="1337" y="909" class="sans small" fill="#B77A13" text-anchor="start">04 恢复普通基线</text>
<text x="1337" y="940" class="sans tiny" fill="#526675" text-anchor="start">先还地面；重启仍需证据门</text>
<rect x="50" y="1018" width="1700" height="48" rx="16" fill="#102A43"/>
<text x="900" y="1049" class="sans micro" fill="#FFFFFF" text-anchor="middle">G0 气候关系图 · 不证明现状树木、排水能力或脆弱群体结果 · 边界、尺寸、生态、水工、消防、铁路保护、排班与恢复时长 unknown / 0</text>
