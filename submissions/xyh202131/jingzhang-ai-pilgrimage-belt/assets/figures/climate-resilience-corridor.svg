<rect width="1800" height="1100" fill="#F5F1E8"/><rect width="1800" height="142" fill="#102A43"/>
<text x="56" y="48" class="sans kicker" fill="#D6A21D" text-anchor="start">S07 / SEASONAL CIVIC SECTION / 气候韧性</text>
<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">四季共用一条普通基线，气候验证只附着在可拆边缘</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">以连续剖面回答遮阴、雨水、静音、维护与人工服务的空间次序；不把气候合同画成已建成工程。</text>
<text x="55" y="245" class="sans kicker" fill="#087E68" text-anchor="start">A / CONTINUOUS SEASONAL SECTION</text>
<text x="55" y="286" class="sans label" fill="#102A43" text-anchor="start">从日常使用向外叠加，不让验证占据基本服务</text>
<line x1="65" y1="760" x2="1735" y2="760" stroke="#102A43" stroke-width="4" stroke-linecap="round"/>
<rect x="80" y="610" width="360" height="150" rx="12" fill="#DFF1EA" stroke="#087E68" stroke-width="4"/>
<text x="260" y="665" class="sans body" fill="#087E68" text-anchor="middle">普通通行 + 安静休憩</text>
<text x="260" y="700" class="sans micro" fill="#526675" text-anchor="middle">无屏导向 · 人工帮助 · 安全离开</text>
<path d="M470 760 Q620 520 780 760 Z" fill="#B9DCCF" stroke="#087E68" stroke-width="4"/>
<text x="625" y="665" class="sans body" fill="#087E68" text-anchor="middle">遮阴 + 种植</text>
<text x="625" y="700" class="sans micro" fill="#526675" text-anchor="middle">树种与土壤待核</text>
<path d="M800 760 Q950 675 1100 760 Z" fill="#D6E9ED" stroke="#167FA5" stroke-width="4"/>
<path d="M830 735 Q950 685 1070 735" fill="none" stroke="#167FA5" stroke-width="5"/>
<text x="950" y="665" class="sans body" fill="#167FA5" text-anchor="middle">雨洪 / 生态缓冲</text>
<text x="950" y="700" class="sans micro" fill="#526675" text-anchor="middle">水工与排水待核</text>
<rect x="1130" y="570" width="250" height="190" rx="12" fill="#FFFFFF" stroke="#B77A13" stroke-width="4"/>
<text x="1255" y="630" class="sans body" fill="#B77A13" text-anchor="middle">人工服务 + 维护净空</text>
<text x="1255" y="670" class="sans micro" fill="#526675" text-anchor="middle">保洁 · 检修 · 应急</text>
<text x="1255" y="700" class="sans micro" fill="#526675" text-anchor="middle">不得被设备堵塞</text>
<rect x="1430" y="535" width="260" height="225" rx="24" fill="#DCEEF4" stroke="#167FA5" stroke-width="5" stroke-dasharray="15 10"/>
<text x="1560" y="600" class="sans body" fill="#167FA5" text-anchor="middle">可拆气候验证边</text>
<text x="1560" y="640" class="sans micro" fill="#526675" text-anchor="middle">传感 / 提示 / 可移动遮阴</text>
<text x="1560" y="675" class="sans micro" fill="#D75D45" text-anchor="middle">故障时物理停止</text>
