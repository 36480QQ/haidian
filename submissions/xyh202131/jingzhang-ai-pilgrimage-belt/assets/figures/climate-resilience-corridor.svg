<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
<title id="title">四季共用一条普通基线，气候验证只附着在可拆边缘</title><desc id="desc">Conceptual seasonal civic-ground section showing continuous ordinary use, ecological and maintenance layers, removable sensing edge and four-state operation without built-condition claims.</desc>
<defs>
