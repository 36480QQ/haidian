<title id="title">总体—原型—人尺度：三处沿同一公共地面产生不同空间答案</title><desc id="desc">Nested conceptual atlas connecting overall civic ground to three non-isomorphic public-space prototypes and human-scale use without claiming site registration or detailed design approval.</desc>
