<text x="56" y="104" class="sans head" fill="#FFFFFF" text-anchor="start">Thirty-six functional envelopes first serve three public-space duties</text>
<text x="1740" y="48" class="sans kicker" fill="#F8D56A" text-anchor="end">G0 · PROVISIONAL · NOT TO SCALE</text>
<text x="56" y="178" class="sans sub" fill="#526675" text-anchor="start">Unit colours show conceptual function families; continuous ordinary use, side proof, and exit/recovery determine how the ground level works.</text>
