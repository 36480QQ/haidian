<text x="106" y="830" class="sans small" fill="#087E68" text-anchor="start"><tspan x="106" dy="0">Continuous ordinary ground level: entry, movement, rest, staffed help, and exit</tspan><tspan x="106" dy="29">cannot be cut by a technology overlay; proof can only sit beside it</tspan></text>
<text x="106" y="892" class="sans micro" fill="#526675" text-anchor="start"><tspan x="106" dy="0">36/36 means machine-recalculable concept units only</tspan><tspan x="106" dy="25">use, ownership, FAR, intensity, and development scale remain unconfirmed</tspan></text>
<rect x="1210" y="220" width="540" height="760" rx="22" fill="#FFFFFF" stroke="#C7D0CC" stroke-width="2"/><rect x="1210" y="220" width="9" height="760" rx="5" fill="#087E68"/>
<text x="1242" y="260" class="sans kicker" fill="#087E68" text-anchor="start">B / THREE GROUND-LEVEL DUTIES</text>
<text x="1242" y="298" class="sans label" fill="#102A43" text-anchor="start">One ground level, three duties</text>
<rect x="1242" y="350" width="470" height="154" rx="24" fill="#DFF1EA" stroke="#087E68" stroke-width="3"/>
<text x="1270" y="386" class="sans kicker" fill="#087E68" text-anchor="start">01 ORDINARY</text>
<text x="1270" y="426" class="sans label" fill="#087E68" text-anchor="start">ordinary continuity</text>
<text x="1270" y="460" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">screen-free wayfinding + staffed entry</tspan><tspan x="1270" dy="27">route + maintenance clearance first</tspan></text>
<rect x="1242" y="545" width="470" height="154" rx="24" fill="#DCEEF4" stroke="#167FA5" stroke-width="3"/>
<text x="1270" y="581" class="sans kicker" fill="#167FA5" text-anchor="start">02 OPTIONAL</text>
<text x="1270" y="621" class="sans label" fill="#167FA5" text-anchor="start">proof beside</text>
<text x="1270" y="655" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">voluntary · announced · bounded</tspan><tspan x="1270" dy="27">no loss of movement or quiet rest</tspan></text>
<rect x="1242" y="740" width="470" height="154" rx="24" fill="#F8E4DE" stroke="#D75D45" stroke-width="3"/>
<text x="1270" y="776" class="sans kicker" fill="#D75D45" text-anchor="start">03 EXIT / RESTORE</text>
<text x="1270" y="816" class="sans label" fill="#D75D45" text-anchor="start">exit + restore</text>
<text x="1270" y="850" class="sans micro" fill="#526675" text-anchor="start"><tspan x="1270" dy="0">physical stop + human takeover</tspan><tspan x="1270" dy="27">restore ordinary use; no automatic restart</tspan></text>
<rect x="90" y="934" width="22" height="22" rx="5" fill="#E8C56E"/>
<text x="122" y="951" class="sans tiny" fill="#526675" text-anchor="start">culture</text>
