<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<rect width="800" height="600" fill="#0a1628"/>
<text x="400" y="36" fill="#00D4AA" font-size="20" text-anchor="middle" font-weight="bold">京张·源带 | 用地结构 Land Use Structure</text>
<text x="400" y="56" fill="#6b7280" font-size="11" text-anchor="middle">概念建议 · 待正式控规确定 | 以下为概念性用地比例</text>

<!-- Donut chart -->
<g transform="translate(250,300)">
  <circle r="150" fill="none" stroke="#1B3A5C" stroke-width="60" stroke-dasharray="329.87 612.61" stroke-dashoffset="0" transform="rotate(-90)"/>
  <circle r="150" fill="none" stroke="#00D4AA" stroke-width="60" stroke-dasharray="141.37 799.11" stroke-dashoffset="-329.87" transform="rotate(-90)"/>
  <circle r="150" fill="none" stroke="#06b6d4" stroke-width="60" stroke-dasharray="113.1 827.38" stroke-dashoffset="-471.24" transform="rotate(-90)"/>
  <circle r="150" fill="none" stroke="#f59e0b" stroke-width="60" stroke-dasharray="169.65 770.83" stroke-dashoffset="-584.34" transform="rotate(-90)"/>
  <circle r="150" fill="none" stroke="#22c55e" stroke-width="60" stroke-dasharray="113.1 827.38" stroke-dashoffset="-753.99" transform="rotate(-90)"/>
  <circle r="150" fill="none" stroke="#6b7280" stroke-width="60" stroke-dasharray="75.4 865.08" stroke-dashoffset="-867.09" transform="rotate(-90)"/>
  <circle r="100" fill="#0a1628"/>
  <text x="0" y="-10" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">11.4 km²</text>
  <text x="0" y="10" fill="#9ca3af" font-size="11" text-anchor="middle">总体设计范围</text>
</g>

<!-- Legend -->
<g transform="translate(480,150)">
  <rect x="0" y="0" width="16" height="16" rx="3" fill="#1B3A5C"/>
  <text x="24" y="13" fill="#e5e7eb" font-size="13">科研与产业用地</text>
  <text x="220" y="13" fill="#00D4AA" font-size="13" font-weight="bold">35%</text>

  <rect x="0" y="32" width="16" height="16" rx="3" fill="#00D4AA"/>
  <text x="24" y="45" fill="#e5e7eb" font-size="13">公共管理与服务</text>
  <text x="220" y="45" fill="#00D4AA" font-size="13" font-weight="bold">15%</text>

  <rect x="0" y="64" width="16" height="16" rx="3" fill="#06b6d4"/>
  <text x="24" y="77" fill="#e5e7eb" font-size="13">商业服务业</text>
  <text x="220" y="77" fill="#00D4AA" font-size="13" font-weight="bold">12%</text>

  <rect x="0" y="96" width="16" height="16" rx="3" fill="#f59e0b"/>
  <text x="24" y="109" fill="#e5e7eb" font-size="13">居住用地</text>
  <text x="220" y="109" fill="#00D4AA" font-size="13" font-weight="bold">18%</text>

  <rect x="0" y="128" width="16" height="16" rx="3" fill="#22c55e"/>
  <text x="24" y="141" fill="#e5e7eb" font-size="13">绿地与广场</text>
  <text x="220" y="141" fill="#00D4AA" font-size="13" font-weight="bold">12%</text>

  <rect x="0" y="160" width="16" height="16" rx="3" fill="#6b7280"/>
  <text x="24" y="173" fill="#e5e7eb" font-size="13">道路与交通设施</text>
  <text x="220" y="173" fill="#00D4AA" font-size="13" font-weight="bold">8%</text>
</g>

<!-- Note -->
<text x="400" y="560" fill="#6b7280" font-size="10" text-anchor="middle">⚠️ 概念建议比例，不构成法定控规指标。待正式规划数据确定后调整。</text>
<text x="400" y="580" fill="#6b7280" font-size="10" text-anchor="middle">来源: agent design · 参考: 国土空间用地用海分类指南 (2023)</text>
</svg>
