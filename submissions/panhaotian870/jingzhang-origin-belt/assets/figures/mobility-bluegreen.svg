<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<rect width="800" height="600" fill="#0a1628"/>
<text x="400" y="36" fill="#00D4AA" font-size="20" text-anchor="middle" font-weight="bold">京张·源带 | 蓝绿公共空间与交通 Blue-Green &amp; Mobility</text>

<!-- North-South Heritage Park Corridor -->
<rect x="370" y="60" width="60" height="420" rx="8" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-width="1.5"/>
<line x1="400" y1="60" x2="400" y2="480" stroke="#22c55e" stroke-width="4"/>
<text x="400" y="500" fill="#22c55e" font-size="11" text-anchor="middle" font-weight="bold">京张铁路遗址公园 9km</text>
<text x="400" y="516" fill="#9ca3af" font-size="9" text-anchor="middle">开发者散步道 · 开源成果展示 · 荣誉墙</text>

<!-- East-West Stitch Connections -->
<line x1="160" y1="140" x2="640" y2="140" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
<text x="650" y="144" fill="#06b6d4" font-size="9">缝合通道1</text>
<line x1="160" y1="220" x2="640" y2="220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
<text x="650" y="224" fill="#06b6d4" font-size="9">缝合通道2</text>
<line x1="160" y1="300" x2="640" y2="300" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
<text x="650" y="304" fill="#06b6d4" font-size="9">缝合通道3</text>
<line x1="160" y1="380" x2="640" y2="380" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
<text x="650" y="384" fill="#06b6d4" font-size="9">缝合通道4</text>

<!-- Innovation Boulevard -->
<line x1="450" y1="60" x2="450" y2="480" stroke="#f59e0b" stroke-width="2"/>
<text x="462" y="470" fill="#f59e0b" font-size="9">创新大道</text>

<!-- Key Areas boxes -->
<rect x="200" y="70" width="140" height="60" rx="6" fill="#1B3A5C" stroke="#00D4AA" stroke-width="1"/>
<text x="270" y="95" fill="#fff" font-size="10" text-anchor="middle">众智园</text>
<text x="270" y="112" fill="#00D4AA" font-size="8" text-anchor="middle">源·创 192ha</text>

<rect x="200" y="190" width="140" height="60" rx="6" fill="#1B3A5C" stroke="#00D4AA" stroke-width="1"/>
<text x="270" y="215" fill="#fff" font-size="10" text-anchor="middle">AI原点社区</text>
<text x="270" y="232" fill="#00D4AA" font-size="8" text-anchor="middle">源·智 104ha</text>

<rect x="200" y="340" width="140" height="60" rx="6" fill="#1B3A5C" stroke="#00D4AA" stroke-width="1"/>
<text x="270" y="365" fill="#fff" font-size="10" text-anchor="middle">大钟寺</text>
<text x="270" y="382" fill="#00D4AA" font-size="8" text-anchor="middle">源·享 72ha</text>

<!-- Green nodes -->
<circle cx="400" cy="100" r="12" fill="#22c55e" fill-opacity=".3" stroke="#22c55e"/>
<text x="400" y="104" fill="#22c55e" font-size="7" text-anchor="middle">广场</text>
<circle cx="400" cy="260" r="12" fill="#22c55e" fill-opacity=".3" stroke="#22c55e"/>
<text x="400" y="264" fill="#22c55e" font-size="7" text-anchor="middle">公园</text>
<circle cx="400" cy="420" r="12" fill="#22c55e" fill-opacity=".3" stroke="#22c55e"/>
<text x="400" y="424" fill="#22c55e" font-size="7" text-anchor="middle">花园</text>

<!-- Smart Rail -->
<path d="M 480 80 Q 520 200 480 320 Q 440 400 480 460" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3"/>
<text x="530" y="260" fill="#8b5cf6" font-size="9" transform="rotate(-10,530,260)">智轨示范线(概念)</text>

<!-- Legend -->
<rect x="40" y="530" width="720" height="50" rx="8" fill="#111827" stroke="#1f2937"/>
<line x1="70" y1="555" x2="100" y2="555" stroke="#22c55e" stroke-width="4"/><text x="108" y="559" fill="#9ca3af" font-size="9">遗址公园绿廊</text>
<line x1="220" y1="555" x2="250" y2="555" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/><text x="258" y="559" fill="#9ca3af" font-size="9">东西缝合通道</text>
<line x1="380" y1="555" x2="410" y2="555" stroke="#f59e0b" stroke-width="2"/><text x="418" y="559" fill="#9ca3af" font-size="9">创新大道</text>
<line x1="520" y1="555" x2="550" y2="555" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3"/><text x="558" y="559" fill="#9ca3af" font-size="9">智轨(概念)</text>
</svg>
