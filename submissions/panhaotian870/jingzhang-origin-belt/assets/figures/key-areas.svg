  <text x="115" y="64" fill="#00D4AA" font-size="12" text-anchor="middle">源·创引擎 | 192.9 ha</text>
  <!-- Mini map -->
  <rect x="20" y="80" width="190" height="80" rx="6" fill="#0a1628" stroke="#1f2937"/>
  <rect x="30" y="90" width="60" height="30" rx="4" fill="#1B3A5C" stroke="#00D4AA" stroke-width=".5"/>
