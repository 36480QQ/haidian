  <rect x="30" y="125" width="170" height="25" rx="4" fill="#06b6d4" fill-opacity=".2" stroke="#06b6d4" stroke-width=".5"/>
  <text x="115" y="142" fill="#06b6d4" font-size="8" text-anchor="middle">AI治理实验区</text>
  <!-- Features -->
  <text x="20" y="180" fill="#e5e7eb" font-size="10">• AI基础研究集群（大模型、具身智能）</text>
  <text x="20" y="198" fill="#e5e7eb" font-size="10">• AI治理实验区（伦理、安全、政策沙盒）</text>
  <text x="20" y="216" fill="#e5e7eb" font-size="10">• 国际AI人才社区</text>
  <text x="20" y="234" fill="#e5e7eb" font-size="10">• 智·源塔地标（60m）</text>
</g>

<!-- Area 2: Origin Community -->
<g transform="translate(285,70)">
  <rect width="230" height="240" rx="12" fill="#111827" stroke="#00D4AA" stroke-width="1.5"/>
