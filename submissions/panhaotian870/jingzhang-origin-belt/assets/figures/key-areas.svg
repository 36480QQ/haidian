  <text x="115" y="64" fill="#00D4AA" font-size="12" text-anchor="middle">源·智心脏 | 104.3 ha</text>
  <rect x="20" y="80" width="190" height="80" rx="6" fill="#0a1628" stroke="#1f2937"/>
  <rect x="30" y="90" width="70" height="30" rx="4" fill="#06b6d4" fill-opacity=".3" stroke="#06b6d4" stroke-width=".5"/>
