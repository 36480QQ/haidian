  <rect x="30" y="90" width="80" height="30" rx="4" fill="#06b6d4" fill-opacity=".3" stroke="#06b6d4" stroke-width=".5"/>
  <text x="70" y="109" fill="#06b6d4" font-size="8" text-anchor="middle">体验商业</text>
  <rect x="120" y="90" width="50" height="30" rx="4" fill="#1B3A5C" stroke="#00D4AA" stroke-width=".5"/>
  <text x="145" y="109" fill="#fff" font-size="8" text-anchor="middle">企业总部</text>
  <circle cx="185" cy="105" r="15" fill="#FFD700" fill-opacity=".2" stroke="#FFD700" stroke-width=".5"/>
  <text x="185" y="109" fill="#FFD700" font-size="7" text-anchor="middle">智·百年钟</text>
  <rect x="30" y="125" width="170" height="25" rx="4" fill="#22c55e" fill-opacity=".2" stroke="#22c55e" stroke-width=".5"/>
  <text x="115" y="142" fill="#22c55e" font-size="8" text-anchor="middle">AI文化广场</text>
  <text x="20" y="180" fill="#e5e7eb" font-size="10">• 源·享体验大道</text>
  <text x="20" y="198" fill="#e5e7eb" font-size="10">• AI企业总部集群</text>
  <text x="20" y="216" fill="#e5e7eb" font-size="10">• 智·百年钟地标</text>
  <text x="20" y="234" fill="#e5e7eb" font-size="10">• 城市智能体运营中心</text>
