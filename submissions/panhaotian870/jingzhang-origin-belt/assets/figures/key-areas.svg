  <rect x="100" y="90" width="50" height="30" rx="4" fill="#22c55e" fill-opacity=".3" stroke="#22c55e" stroke-width=".5"/>
  <text x="125" y="109" fill="#22c55e" font-size="8" text-anchor="middle">绿轴</text>
  <rect x="160" y="90" width="40" height="30" rx="4" fill="#f59e0b" fill-opacity=".3" stroke="#f59e0b" stroke-width=".5"/>
