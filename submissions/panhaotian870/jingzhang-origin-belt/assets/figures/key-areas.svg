<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<rect width="800" height="600" fill="#0a1628"/>
<text x="400" y="36" fill="#00D4AA" font-size="20" text-anchor="middle" font-weight="bold">京张·源带 | 重点区域详细设计 Key Areas</text>

<!-- Area 1: Zhongzhiyuan -->
<g transform="translate(40,70)">
  <rect width="230" height="240" rx="12" fill="#111827" stroke="#00D4AA" stroke-width="1.5"/>
