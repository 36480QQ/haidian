  <text x="20" y="180" fill="#e5e7eb" font-size="10">• AI交叉创新走廊</text>
  <text x="20" y="198" fill="#e5e7eb" font-size="10">• 开源社区总部</text>
  <text x="20" y="216" fill="#e5e7eb" font-size="10">• 智·算法花园（约2ha）</text>
  <text x="20" y="234" fill="#e5e7eb" font-size="10">• 源·智创新广场</text>
</g>

<!-- Area 3: Dazhongsi -->
<g transform="translate(530,70)">
