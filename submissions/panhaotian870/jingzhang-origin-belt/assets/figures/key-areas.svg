<!-- Bottom info -->
<rect x="40" y="340" width="720" height="220" rx="12" fill="#111827" stroke="#1f2937"/>
<text x="400" y="370" fill="#00D4AA" font-size="14" text-anchor="middle" font-weight="bold">三区协同关系 / Three-Area Synergy</text>
<line x1="155" y1="400" x2="155" y2="430" stroke="#00D4AA" stroke-width="2"/>
<line x1="155" y1="430" x2="400" y2="430" stroke="#00D4AA" stroke-width="2"/>
<line x1="400" y1="400" x2="400" y2="430" stroke="#00D4AA" stroke-width="2"/>
<line x1="645" y1="400" x2="645" y2="430" stroke="#00D4AA" stroke-width="2"/>
<line x1="400" y1="430" x2="645" y2="430" stroke="#00D4AA" stroke-width="2"/>
<text x="155" y="395" fill="#00D4AA" font-size="10" text-anchor="middle">源·创</text>
<text x="400" y="395" fill="#00D4AA" font-size="10" text-anchor="middle">源·智</text>
<text x="645" y="395" fill="#00D4AA" font-size="10" text-anchor="middle">源·享</text>
<text x="400" y="450" fill="#9ca3af" font-size="10" text-anchor="middle">创新链：基础研究 → 交叉创新 → 产业转化 → 场景体验</text>
<text x="400" y="475" fill="#e5e7eb" font-size="11" text-anchor="middle">京张铁路遗址公园 9km 创新主轴贯穿三区</text>
<text x="400" y="500" fill="#e5e7eb" font-size="11" text-anchor="middle">中关村科技服务翼（西）提供资本与IP支撑</text>
<text x="400" y="525" fill="#e5e7eb" font-size="11" text-anchor="middle">小月河场景赋能翼（东）提供AI场景试验场</text>
<text x="400" y="550" fill="#6b7280" font-size="9" text-anchor="middle">所有空间布局为概念建议，不构成正式规划 | 数据来源: 公告推算(临时)</text>
