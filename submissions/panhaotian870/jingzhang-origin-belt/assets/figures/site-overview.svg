<line x1="400" y1="100" x2="400" y2="500" stroke="#00D4AA" stroke-width="4"/>
<text x="400" y="520" fill="#00D4AA" font-size="11" text-anchor="middle" font-weight="bold">京张铁路遗址公园 ~9km</text>

