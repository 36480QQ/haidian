<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<rect width="800" height="600" fill="#0a1628"/>
<text x="400" y="36" fill="#00D4AA" font-size="20" text-anchor="middle" font-weight="bold">京张·智廊 | 场地总览 Site Overview</text>
<text x="400" y="56" fill="#6b7280" font-size="11" text-anchor="middle">统筹研究范围 ~43.6km² · 总体设计范围 ~11.4km² · 数据来源: 公告文字四至推算(临时)</text>

