</g>

<text x="400" y="380" fill="#e5e7eb" font-size="14" text-anchor="middle" font-weight="bold">色彩体系 / Color System</text>
<g transform="translate(120,400)">
  <rect x="0" y="0" width="130" height="60" rx="8" fill="#1E4D3A"/>
