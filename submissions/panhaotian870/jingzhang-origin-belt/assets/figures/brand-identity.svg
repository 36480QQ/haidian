<text x="400" y="56" fill="#6b7280" font-size="11" text-anchor="middle">从铁路走廊到智能走廊 — 百年创新</text>

<g transform="translate(110,110)">
  <rect x="0" y="0" width="230" height="230" rx="20" fill="#111827" stroke="#0057D9" stroke-width="2"/>
  <line x1="30" y1="150" x2="200" y2="150" stroke="#1E4D3A" stroke-width="9" stroke-linecap="round"/>
  <line x1="30" y1="178" x2="200" y2="178" stroke="#1E4D3A" stroke-width="9" stroke-linecap="round"/>
  <circle cx="60" cy="150" r="11" fill="#7C4DFF"/>
  <circle cx="120" cy="150" r="11" fill="#00D4AA"/>
  <circle cx="180" cy="150" r="11" fill="#0057D9"/>
  <circle cx="120" cy="60" r="9" fill="#7C4DFF"/>
  <line x1="60" y1="150" x2="120" y2="60" stroke="#7C4DFF" stroke-width="2"/>
  <line x1="180" y1="150" x2="120" y2="60" stroke="#7C4DFF" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="150" stroke="#00D4AA" stroke-width="2"/>
