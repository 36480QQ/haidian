<g transform="translate(380,110)">
  <text x="0" y="70" fill="#ffffff" font-size="44" font-weight="bold">京张·智廊</text>
  <text x="0" y="112" fill="#0057D9" font-size="16" font-weight="bold">JINGZHANG AI CORRIDOR</text>
