<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Open Weave / Jingzhang Civic Loop lockup</title>
  <desc id="desc">A scalable brand lockup with twin railway tracks, three numbered cores and an open contribution arc.</desc>
  <rect width="1200" height="420" rx="36" fill="#17283b"/>
  <g fill="none" stroke="#f4f0e8" stroke-width="22" stroke-linecap="round">
    <path d="M90 118H720"/>
    <path d="M90 184H720"/>
  </g>
  <path d="M720 151C830 151 898 105 990 54" fill="none" stroke="#f0c76c" stroke-width="22" stroke-linecap="round"/>
  <g stroke="#17283b" stroke-width="9">
    <circle cx="250" cy="151" r="39" fill="#c25543"/>
    <circle cx="405" cy="151" r="39" fill="#3d8b76"/>
    <circle cx="560" cy="151" r="39" fill="#f0c76c"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">
    <text x="250" y="160">01</text>
    <text x="405" y="160">02</text>
  </g>
  <text x="560" y="160" fill="#17283b" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">03</text>
  <text x="90" y="286" fill="#f4f0e8" font-family="Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="2">OPEN WEAVE</text>
  <text x="94" y="337" fill="#c7d8d2" font-family="Arial, sans-serif" font-size="26" letter-spacing="3">JINGZHANG CIVIC LOOP</text>
</svg>
