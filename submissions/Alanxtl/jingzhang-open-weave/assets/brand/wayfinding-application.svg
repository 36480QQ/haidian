<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Open Weave wayfinding application mockup</title>
  <desc id="desc">A concept wayfinding sign showing the 02 node, a human-service fallback, an AI test commons direction and a paper route marker.</desc>
  <rect width="1200" height="720" fill="#f4f0e8"/>
  <rect x="92" y="74" width="1016" height="572" rx="30" fill="#fffdf8" stroke="#d4cbbe" stroke-width="5"/>
  <path d="M180 122V595" stroke="#17283b" stroke-width="18" stroke-linecap="round"/>
  <path d="M180 184H1020" stroke="#f4f0e8" stroke-width="12"/>
  <path d="M180 206H1020" stroke="#f4f0e8" stroke-width="12"/>
  <rect x="255" y="134" width="730" height="190" rx="22" fill="#17283b"/>
  <circle cx="330" cy="229" r="48" fill="#3d8b76" stroke="#17283b" stroke-width="10"/>
  <text x="330" y="242" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">02</text>
  <text x="412" y="208" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="700">TEST COMMONS</text>
  <text x="412" y="260" fill="#c7d8d2" font-family="Arial, sans-serif" font-size="25">标准治理 · 人工复核 · 可撤回试点</text>
  <path d="M927 202l48 27-48 27z" fill="#f0c76c"/>
  <g font-family="Arial, sans-serif">
    <rect x="255" y="370" width="730" height="82" rx="16" fill="#fff" stroke="#d4cbbe" stroke-width="3"/>
    <circle cx="306" cy="411" r="22" fill="#c25543"/>
    <text x="352" y="403" fill="#17283b" font-size="24" font-weight="700">Human desk / 人工服务</text>
    <text x="352" y="433" fill="#5c6975" font-size="20">Paper route + phone + staffed handover</text>
    <rect x="255" y="480" width="730" height="82" rx="16" fill="#fff" stroke="#d4cbbe" stroke-width="3"/>
    <circle cx="306" cy="521" r="22" fill="#f0c76c"/>
    <text x="352" y="513" fill="#17283b" font-size="24" font-weight="700">Paper route / 纸面路线</text>
    <text x="352" y="543" fill="#5c6975" font-size="20">No phone required · exit remains visible</text>
  </g>
</svg>
