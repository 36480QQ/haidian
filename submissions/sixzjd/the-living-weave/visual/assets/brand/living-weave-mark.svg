<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">The Living Weave mark</title>
  <desc id="mark-desc">Three vertical warp threads interlaced with two horizontal weft threads; one cream weft passes over the warps and carries three jacquard punch-hole dots, one orange weft passes under the warps. Original mark for the Jingzhang Living Weave proposal.</desc>
  <!-- warp: Jingzhang Teal #1F4E46 -->
  <rect x="58" y="30" width="24" height="180" fill="#1F4E46"/>
  <rect x="108" y="30" width="24" height="180" fill="#1F4E46"/>
  <rect x="158" y="30" width="24" height="180" fill="#1F4E46"/>
  <!-- weft 1 (under): Jacquard Orange #D2622A, visible only between warp threads -->
  <rect x="30" y="78" width="28" height="24" fill="#D2622A"/>
  <rect x="82" y="78" width="26" height="24" fill="#D2622A"/>
  <rect x="132" y="78" width="26" height="24" fill="#D2622A"/>
  <rect x="182" y="78" width="28" height="24" fill="#D2622A"/>
  <!-- weft 2 (over): Warp-Weft Cream #F2EDE4 with teal outline -->
  <rect x="30" y="138" width="180" height="24" fill="#F2EDE4" stroke="#1F4E46" stroke-width="1.5"/>
  <!-- jacquard punch-hole dots on the over-weft, centered on each warp -->
  <circle cx="70" cy="150" r="3.5" fill="#D2622A"/>
  <circle cx="120" cy="150" r="3.5" fill="#D2622A"/>
  <circle cx="170" cy="150" r="3.5" fill="#D2622A"/>
</svg>
