<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="pattern-title pattern-desc">
  <title id="pattern-title">The Living Weave tileable pattern</title>
  <desc id="pattern-desc">A seamless plain-weave pattern tile: teal warp threads and orange weft threads interlace over and under on a cream ground. The 240 by 240 unit repeats seamlessly in both directions. Original pattern for the Jingzhang Living Weave proposal.</desc>
  <!-- ground: Warp-Weft Cream #F2EDE4 -->
  <rect x="0" y="0" width="240" height="240" fill="#F2EDE4"/>
  <!-- warp: Jingzhang Teal #1F4E46 (three columns, wraps seamlessly at tile edges) -->
  <rect x="0" y="0" width="40" height="240" fill="#1F4E46"/>
  <rect x="80" y="0" width="40" height="240" fill="#1F4E46"/>
  <rect x="160" y="0" width="40" height="240" fill="#1F4E46"/>
  <!-- weft row 1: over the left and right warps, under the middle warp -->
  <rect x="0" y="0" width="240" height="40" fill="#D2622A"/>
  <!-- weft row 2: under the left and right warps, over the middle warp -->
  <rect x="0" y="120" width="240" height="40" fill="#D2622A"/>
  <!-- over/under patches restoring the checkerboard interlace -->
  <rect x="80" y="0" width="40" height="40" fill="#1F4E46"/>
  <rect x="0" y="120" width="40" height="40" fill="#1F4E46"/>
  <rect x="160" y="120" width="40" height="40" fill="#1F4E46"/>
</svg>
