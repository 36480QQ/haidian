<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">R04 开源知识前台五级尺度与100天限定样板</title>
  <desc id="desc">R04 以约120米概念公共路线、四道门和三份测量契约组织。所有尺度为概念关系表达，非测绘、非施工，待专项复核。</desc>
  <rect width="1600" height="900" fill="#f5f0e5"/>
  <rect x="54" y="54" width="1492" height="128" rx="18" fill="#12302e"/>
  <text x="96" y="112" font-family="sans-serif" font-size="40" fill="#fffdf7">R04 开源知识前台｜五级尺度与100天限定样板</text>
  <text x="96" y="152" font-family="sans-serif" font-size="23" fill="#b9d8c4">概念表达：约120米公共路线、3.0米路径、4.8米边侧前台均待正式资料与专项审查</text>
  <rect x="112" y="245" width="1376" height="410" rx="28" fill="#fffdf7" stroke="#2e8b82" stroke-width="4"/>
  <text x="800" y="380" text-anchor="middle" font-family="sans-serif" font-size="48" fill="#173f3a">城市关系 → 片区接口 → 1:500 → 1:200 → 1:50</text>
  <text x="800" y="465" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#53635a">G0 核验 ｜ G1 公共基线 ｜ G2 限定可拆层 ｜ G3 人工复核</text>
  <text x="800" y="540" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#53635a">三份测量契约：无账号抵达、撤回后可理解、暂停后立即复位；现场结果 0 / 未开展</text>
  <text x="800" y="605" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#53635a">非测绘、非施工、非许可，后续由合法权利人及专业程序决定。</text>
</svg>
