<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">R04 开源知识前台：五级尺度与100天限定样板</title><desc id="d">R04概念节点的区域到细部尺度、120米公共路线、四个决策点、空间剖面和100天准入门。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.h{fill:#173b35}.m{fill:#596961}.s{fill:#fffdf7;stroke:#cbd7cd;stroke-width:2}.k{fill:#1b7666}.a{fill:#c1843b}.r{fill:#a64e45}</style><rect width="1600" height="980" fill="#fffdf7"/><rect width="1600" height="118" fill="#173b35"/><text x="58" y="52" font-size="33" font-weight="700" fill="white">R04 开源知识前台｜一处场地化样板，而非一组并列场景</text><text x="58" y="88" font-size="17" fill="#dcebe3">AI 原点临时重点区索引 · 五级尺度、四个准入门、100天概念试点 · 所有几何与尺寸待测绘、权属、消防及无障碍复核</text>
<g transform="translate(56 154)"><rect class="s" width="718" height="395" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">01 / 五级尺度：同一编号贯穿总图、平面、剖面和可逆节点</text><g transform="translate(28 72)"><rect width="126" height="256" rx="12" fill="#edf4ef"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:5000</text><path d="M20 205L110 65M20 125H110" stroke="#1b7666" stroke-width="12"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">城市关系</text><g transform="translate(142)"><rect width="126" height="256" rx="12" fill="#f2f0e9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:2000</text><path d="M20 190H108M65 52V215" stroke="#57966f" stroke-width="14"/><circle cx="65" cy="132" r="30" fill="#c1843b"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">片区接口</text></g><g transform="translate(284)"><rect width="126" height="256" rx="12" fill="#fff5e6"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:500</text><path d="M17 150H110" stroke="#1b7666" stroke-width="27"/><rect x="71" y="69" width="36" height="142" fill="#c1843b"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">120m 平面</text></g><g transform="translate(426)"><rect width="126" height="256" rx="12" fill="#f0f6f3"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:200</text><path d="M14 205H112" stroke="#4f5c56" stroke-width="4"/><rect x="16" y="174" width="53" height="31" fill="#64b39f"/><rect x="75" y="105" width="36" height="100" fill="#1b7666"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">公共 / 前台剖面</text></g><g transform="translate(568)"><rect width="126" height="256" rx="12" fill="#f9eee9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:50</text><path d="M15 205H111" stroke="#4f5c56" stroke-width="4"/><rect x="22" y="140" width="28" height="65" fill="#64b39f"/><rect x="61" y="151" width="45" height="54" fill="#c1843b"/><circle cx="84" cy="118" r="17" class="r"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">可拆节点</text></g></g><text x="28" y="368" font-size="15" class="m">概念比例仅用于显示责任关系：从城市到节点，任何细部都不越过正式资料和专项审查的表达上限。</text></g>
<g transform="translate(804 154)"><rect class="s" width="740" height="395" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">02 / 1:500 概念平面：120m 连续公共路径 + 四个决策点</text><rect x="28" y="68" width="684" height="255" rx="13" fill="#f4f7f2" stroke="#d8e1d9"/><path d="M70 194H670" stroke="#64b39f" stroke-width="56" stroke-linecap="round"/><path d="M70 194H670" stroke="white" stroke-width="7" stroke-dasharray="20 14"/><text x="75" y="145" font-size="17" font-weight="700" fill="#176e60">3.0m 概念公共路线：不登录、不断开</text><g fill="#173b35"><circle cx="155" cy="194" r="20"/><circle cx="295" cy="194" r="20"/><circle cx="445" cy="194" r="20"/><circle cx="585" cy="194" r="20"/></g><g fill="white" font-size="15" font-weight="700"><text x="155" y="200" text-anchor="middle">01</text><text x="295" y="200" text-anchor="middle">02</text><text x="445" y="200" text-anchor="middle">03</text><text x="585" y="200" text-anchor="middle">04</text></g><rect x="464" y="82" width="192" height="85" rx="10" fill="#c1843b"/><text x="560" y="116" text-anchor="middle" font-size="16" font-weight="700" class="h">4.8m 边侧前台</text><text x="560" y="143" text-anchor="middle" font-size="14" class="h">人工咨询 / 可撤回成果卡</text><rect x="250" y="232" width="150" height="53" rx="10" fill="#d9e8df"/><text x="325" y="264" text-anchor="middle" font-size="15" class="h">遮阴、坐憩、实体导览</text><text x="30" y="362" font-size="15" class="m">01到达导向 · 02无账号人工交接 · 03停留与权利说明 · 04暂停 / 撤场出口</text></g>
<g transform="translate(56 580)"><rect class="s" width="930" height="342" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">03 / 100天限定样板：先普通服务，再进入有限试用；未达门即停</text><g transform="translate(28 78)"><g><rect width="202" height="180" rx="14" fill="#edf4ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">0—15日 / G0</text><text x="18" y="69" font-size="15" class="m">场地、权利、无障碍、</text><text x="18" y="93" font-size="15" class="m">开放时段与风险核验</text><text x="18" y="139" font-size="14" class="k">输出：核验单 / 不实施清单</text></g><g transform="translate(218)"><rect width="202" height="180" rx="14" fill="#f1f6ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">16—35日 / G1</text><text x="18" y="69" font-size="15" class="m">公共路径、静态导向、</text><text x="18" y="93" font-size="15" class="m">人工咨询先独立成立</text><text x="18" y="139" font-size="14" class="k">输出：普通公共基线</text></g><g transform="translate(436)"><rect width="202" height="180" rx="14" fill="#fff4df"/><text x="18" y="36" font-size="18" font-weight="700" class="h">36—70日 / G2</text><text x="18" y="69" font-size="15" class="m">人工在场、授权、撤回、</text><text x="18" y="93" font-size="15" class="m">维护/撤场责任到位</text><text x="18" y="139" font-size="14" fill="#a46d2d">输出：限时试用记录</text></g><g transform="translate(654)"><rect width="220" height="180" rx="14" fill="#fae9e7"/><text x="18" y="36" font-size="18" font-weight="700" class="h">71—100日 / G3</text><text x="18" y="69" font-size="15" class="m">复核连续性、交接、撤回；</text><text x="18" y="93" font-size="15" class="m">撤场或给出深化建议</text><text x="18" y="139" font-size="14" class="r">输出：adopt / revise / stop</text></g></g><text x="28" y="305" font-size="14" class="m">当前仅完成设计与合成规则，不主张任何现场运行、许可、造价或服务绩效已经发生。</text></g>
<g transform="translate(1016 580)"><rect class="s" width="528" height="342" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">04 / 三份测量契约</text><text x="30" y="89" font-size="17" font-weight="700" class="h">MC-01 无账号能否到达人？</text><text x="30" y="116" font-size="14" class="m">静态导向+人工问询 / 路线受阻或人工缺席即停</text><text x="30" y="166" font-size="17" font-weight="700" class="h">MC-02 撤回后能否仍被解释？</text><text x="30" y="193" font-size="14" class="m">纸质权利说明 / 授权、署名或纠错不清即下架</text><text x="30" y="243" font-size="17" font-weight="700" class="h">MC-03 暂停后能否立即复位？</text><text x="30" y="270" font-size="14" class="m">人工咨询+实体导览 / 维护或安全责任失效即退回</text><rect x="28" y="290" width="470" height="28" rx="8" fill="#edf4ef"/><text x="42" y="310" font-size="13" class="k">3份设计测量契约 · 0项现场结果 · not field-run</text></g></svg>
