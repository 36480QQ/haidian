<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">R04 Open Knowledge Front Desk: bounded pilot atlas</title><desc id="desc">A five-scale R04 spatial atlas showing a 120 metre conceptual public route, four decision points, four human gates and a 100-day bounded pilot.</desc>
  <style>text{font-family:Arial,sans-serif}.h{fill:#173b35}.m{fill:#52645d}.card{fill:#fffdf7;stroke:#cbd7cd;stroke-width:2}.green{fill:#1b7666}.amber{fill:#c1843b}.red{fill:#a64e45}</style>
  <rect width="1600" height="980" fill="#fffdf7"/><rect width="1600" height="118" fill="#173b35"/>
  <text x="58" y="52" font-size="33" font-weight="700" fill="white">R04 Open Knowledge Front Desk | a bounded, site-specific pilot</text><text x="58" y="88" font-size="17" fill="#dcebe3">Provisional AI Origin index · five scales, four human gates and a conceptual 100-day sequence · non-survey / non-construction / subject to specialist review</text>
  <g transform="translate(56 154)"><rect class="card" width="720" height="360" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">01 / Five scales, one spatial decision</text><g transform="translate(28 74)"><g><rect width="126" height="210" rx="12" fill="#edf4ef"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:5000</text><path d="M22 170L105 66M22 120H105" class="green" stroke="#1b7666" stroke-width="11"/><text x="63" y="190" text-anchor="middle" font-size="13" class="m">city relation</text></g><g transform="translate(142)"><rect width="126" height="210" rx="12" fill="#f2f0e9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:2000</text><path d="M22 142H104M63 59V178" stroke="#57966f" stroke-width="13"/><circle cx="63" cy="122" r="24" class="amber"/><text x="63" y="190" text-anchor="middle" font-size="13" class="m">district edge</text></g><g transform="translate(284)"><rect width="126" height="210" rx="12" fill="#fff4df"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:500</text><path d="M18 125H108" stroke="#64b39f" stroke-width="25"/><rect x="75" y="62" width="30" height="125" class="amber"/><text x="63" y="190" text-anchor="middle" font-size="13" class="m">120m plan</text></g><g transform="translate(426)"><rect width="126" height="210" rx="12" fill="#f0f6f3"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:200</text><path d="M15 174H111" stroke="#4f5c56" stroke-width="4"/><rect x="18" y="145" width="48" height="29" fill="#64b39f"/><rect x="76" y="84" width="33" height="90" class="green"/><text x="63" y="190" text-anchor="middle" font-size="13" class="m">public section</text></g><g transform="translate(568)"><rect width="126" height="210" rx="12" fill="#f9eee9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:50</text><path d="M15 174H111" stroke="#4f5c56" stroke-width="4"/><rect x="24" y="121" width="26" height="53" fill="#64b39f"/><rect x="62" y="132" width="44" height="42" class="amber"/><circle cx="84" cy="103" r="15" class="red"/><text x="63" y="190" text-anchor="middle" font-size="13" class="m">reversible kit</text></g></g><text x="28" y="326" font-size="14" class="m">Every drawn dimension is a concept relationship for review and a future survey brief — not a surveyed, permitted or construction-ready condition.</text></g>
  <g transform="translate(806 154)"><rect class="card" width="738" height="360" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">02 / One 1:500 concept plan: public route first</text><rect x="28" y="68" width="682" height="218" rx="13" fill="#f4f7f2" stroke="#d8e1d9"/><path d="M72 177H666" stroke="#64b39f" stroke-width="54" stroke-linecap="round"/><path d="M72 177H666" stroke="white" stroke-width="7" stroke-dasharray="20 14"/><text x="72" y="127" font-size="17" font-weight="700" class="green">3.0m conceptual public route: no login, no interruption</text><g fill="#173b35"><circle cx="158" cy="177" r="20"/><circle cx="300" cy="177" r="20"/><circle cx="444" cy="177" r="20"/><circle cx="586" cy="177" r="20"/></g><g fill="white" font-size="15" font-weight="700"><text x="158" y="183" text-anchor="middle">01</text><text x="300" y="183" text-anchor="middle">02</text><text x="444" y="183" text-anchor="middle">03</text><text x="586" y="183" text-anchor="middle">04</text></g><rect x="466" y="80" width="190" height="74" rx="10" class="amber"/><text x="561" y="110" text-anchor="middle" font-size="16" font-weight="700" class="h">4.8m side front desk</text><text x="561" y="136" text-anchor="middle" font-size="14" class="h">staffed help / removable cards</text><rect x="250" y="216" width="150" height="44" rx="10" fill="#d9e8df"/><text x="325" y="244" text-anchor="middle" font-size="14" class="h">shade / rest / static guide</text><text x="30" y="326" font-size="14" class="m">01 arrival guide · 02 no-login handoff · 03 rest and rights · 04 pause / demobilise exit</text></g>
  <g transform="translate(56 546)"><rect class="card" width="1000" height="370" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">03 / Four gates and a 100-day bounded sequence</text><g transform="translate(28 78)"><g><rect width="218" height="184" rx="14" fill="#edf4ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 0–15 / G0</text><text x="18" y="70" font-size="15" class="m">site, rights, access, hours</text><text x="18" y="94" font-size="15" class="m">and risk verification</text><text x="18" y="140" font-size="14" class="green">verification / no-go list</text></g><g transform="translate(235)"><rect width="218" height="184" rx="14" fill="#f1f6ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 16–35 / G1</text><text x="18" y="70" font-size="15" class="m">route, static guide, staffed</text><text x="18" y="94" font-size="15" class="m">help work on their own</text><text x="18" y="140" font-size="14" class="green">ordinary public baseline</text></g><g transform="translate(470)"><rect width="218" height="184" rx="14" fill="#fff4df"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 36–70 / G2</text><text x="18" y="70" font-size="15" class="m">staff, rights, removal and</text><text x="18" y="94" font-size="15" class="m">maintenance responsibility</text><text x="18" y="140" font-size="14" class="amber">limited trial record</text></g><g transform="translate(705)"><rect width="240" height="184" rx="14" fill="#fae9e7"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 71–100 / G3</text><text x="18" y="70" font-size="15" class="m">aggregate review, restore</text><text x="18" y="94" font-size="15" class="m">and advise adopt / revise / stop</text><text x="18" y="140" font-size="14" class="red">no automatic expansion</text></g></g><text x="28" y="330" font-size="14" class="m">A gate is closed only by authorised human review. This submission reports design and synthetic rules only; it claims no field operation, permit, cost or performance outcome.</text></g>
  <g transform="translate(1086 546)"><rect class="card" width="458" height="370" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">04 / Three measurement contracts</text><text x="30" y="92" font-size="16" font-weight="700" class="h">MC-01 No-login arrival</text><text x="30" y="118" font-size="14" class="m">stop on route blockage or no staff</text><text x="30" y="166" font-size="16" font-weight="700" class="h">MC-02 Explain after withdrawal</text><text x="30" y="192" font-size="14" class="m">remove on unclear rights or correction</text><text x="30" y="240" font-size="16" font-weight="700" class="h">MC-03 Restore ordinary service</text><text x="30" y="266" font-size="14" class="m">return on maintenance or safety failure</text><rect x="28" y="301" width="402" height="30" rx="8" fill="#edf4ef"/><text x="42" y="322" font-size="13" class="green">3 contracts · 0 field results · not field-run</text></g>
</svg>
