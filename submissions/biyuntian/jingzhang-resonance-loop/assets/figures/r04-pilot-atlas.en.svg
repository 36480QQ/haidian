<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">R04 Open Knowledge Front Desk: scale atlas and 100-day pilot</title><desc id="d">Five design scales, a 120m public route, decision points, and a staged conceptual pilot for the R04 node.</desc><style>text{font-family:Arial,sans-serif}.h{fill:#173b35}.m{fill:#596961}.s{fill:#fffdf7;stroke:#cbd7cd;stroke-width:2}.k{fill:#1b7666}.a{fill:#c1843b}.r{fill:#a64e45}</style><rect width="1600" height="980" fill="#fffdf7"/><rect width="1600" height="118" fill="#173b35"/><text x="58" y="52" font-size="33" font-weight="700" fill="white">R04 Open Knowledge Front Desk | one site-specific pilot, not a menu of scenes</text><text x="58" y="88" font-size="17" fill="#dcebe3">Provisional AI Origin index · five scales, four gates, conceptual 100-day pilot · all dimensions await survey, rights, fire and accessibility review</text>
<g transform="translate(56 154)"><rect class="s" width="718" height="395" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">01 / Five scales: one ID chain from city relation to reversible detail</text><g transform="translate(28 72)"><g><rect width="126" height="256" rx="12" fill="#edf4ef"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:5000</text><path d="M20 205L110 65M20 125H110" stroke="#1b7666" stroke-width="12"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">city relation</text></g><g transform="translate(142)"><rect width="126" height="256" rx="12" fill="#f2f0e9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:2000</text><path d="M20 190H108M65 52V215" stroke="#57966f" stroke-width="14"/><circle cx="65" cy="132" r="30" fill="#c1843b"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">district edge</text></g><g transform="translate(284)"><rect width="126" height="256" rx="12" fill="#fff5e6"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:500</text><path d="M17 150H110" stroke="#1b7666" stroke-width="27"/><rect x="71" y="69" width="36" height="142" fill="#c1843b"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">120m plan</text></g><g transform="translate(426)"><rect width="126" height="256" rx="12" fill="#f0f6f3"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:200</text><path d="M14 205H112" stroke="#4f5c56" stroke-width="4"/><rect x="16" y="174" width="53" height="31" fill="#64b39f"/><rect x="75" y="105" width="36" height="100" fill="#1b7666"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">section</text></g><g transform="translate(568)"><rect width="126" height="256" rx="12" fill="#f9eee9"/><text x="63" y="34" text-anchor="middle" font-size="18" font-weight="700" class="h">1:50</text><path d="M15 205H111" stroke="#4f5c56" stroke-width="4"/><rect x="22" y="140" width="28" height="65" fill="#64b39f"/><rect x="61" y="151" width="45" height="54" fill="#c1843b"/><circle cx="84" cy="118" r="17" class="r"/><text x="63" y="236" text-anchor="middle" font-size="14" class="m">reversible kit</text></g></g><text x="28" y="368" font-size="15" class="m">Conceptual proportions only: details never exceed the evidence level of formal base data and specialist reviews.</text></g>
<g transform="translate(804 154)"><rect class="s" width="740" height="395" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">02 / 1:500 concept plan: 120m public route + four decision points</text><rect x="28" y="68" width="684" height="255" rx="13" fill="#f4f7f2" stroke="#d8e1d9"/><path d="M70 194H670" stroke="#64b39f" stroke-width="56" stroke-linecap="round"/><path d="M70 194H670" stroke="white" stroke-width="7" stroke-dasharray="20 14"/><text x="75" y="145" font-size="17" font-weight="700" fill="#176e60">3.0m conceptual public route: no login, no interruption</text><g fill="#173b35"><circle cx="155" cy="194" r="20"/><circle cx="295" cy="194" r="20"/><circle cx="445" cy="194" r="20"/><circle cx="585" cy="194" r="20"/></g><g fill="white" font-size="15" font-weight="700"><text x="155" y="200" text-anchor="middle">01</text><text x="295" y="200" text-anchor="middle">02</text><text x="445" y="200" text-anchor="middle">03</text><text x="585" y="200" text-anchor="middle">04</text></g><rect x="464" y="82" width="192" height="85" rx="10" fill="#c1843b"/><text x="560" y="116" text-anchor="middle" font-size="16" font-weight="700" class="h">4.8m side front desk</text><text x="560" y="143" text-anchor="middle" font-size="14" class="h">staffed help / removable cards</text><rect x="250" y="232" width="150" height="53" rx="10" fill="#d9e8df"/><text x="325" y="264" text-anchor="middle" font-size="15" class="h">shade, rest, static guide</text><text x="30" y="362" font-size="15" class="m">01 arrival guide · 02 no-login handoff · 03 rest & rights · 04 pause / demobilize exit</text></g>
<g transform="translate(56 580)"><rect class="s" width="930" height="342" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">03 / 100-day bounded pilot: ordinary service first; no gate, no trial</text><g transform="translate(28 78)"><g><rect width="202" height="180" rx="14" fill="#edf4ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 0—15 / G0</text><text x="18" y="69" font-size="15" class="m">site, rights, access,</text><text x="18" y="93" font-size="15" class="m">hours and risk verification</text><text x="18" y="139" font-size="14" class="k">output: verification / no-go list</text></g><g transform="translate(218)"><rect width="202" height="180" rx="14" fill="#f1f6ef"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 16—35 / G1</text><text x="18" y="69" font-size="15" class="m">public route, static guide,</text><text x="18" y="93" font-size="15" class="m">staffed help work alone</text><text x="18" y="139" font-size="14" class="k">output: ordinary baseline</text></g><g transform="translate(436)"><rect width="202" height="180" rx="14" fill="#fff4df"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 36—70 / G2</text><text x="18" y="69" font-size="15" class="m">staff, rights, withdrawal,</text><text x="18" y="93" font-size="15" class="m">maintenance / removal ready</text><text x="18" y="139" font-size="14" fill="#a46d2d">output: limited trial log</text></g><g transform="translate(654)"><rect width="220" height="180" rx="14" fill="#fae9e7"/><text x="18" y="36" font-size="18" font-weight="700" class="h">days 71—100 / G3</text><text x="18" y="69" font-size="15" class="m">review route, handoff,</text><text x="18" y="93" font-size="15" class="m">withdrawal; remove or revise</text><text x="18" y="139" font-size="14" class="r">output: adopt / revise / stop</text></g></g><text x="28" y="305" font-size="14" class="m">Design and synthetic rules only; no site operation, permit, cost or performance outcome is claimed.</text></g>
<g transform="translate(1016 580)"><rect class="s" width="528" height="342" rx="18"/><text x="28" y="43" font-size="25" font-weight="700" class="h">04 / Three measurement contracts</text><text x="30" y="89" font-size="17" font-weight="700" class="h">MC-01 Can a no-login visitor reach staff?</text><text x="30" y="116" font-size="14" class="m">static guide + staffed help / stop on route blockage or absence</text><text x="30" y="166" font-size="17" font-weight="700" class="h">MC-02 Can content be explained after withdrawal?</text><text x="30" y="193" font-size="14" class="m">printed rights note / remove on unclear rights, credit or correction</text><text x="30" y="243" font-size="17" font-weight="700" class="h">MC-03 Can ordinary service restore at once?</text><text x="30" y="270" font-size="14" class="m">staffed help + static guide / return on maintenance or safety failure</text><rect x="28" y="290" width="470" height="28" rx="8" fill="#edf4ef"/><text x="42" y="310" font-size="13" class="k">3 design measurement contracts · 0 field results · not field-run</text></g></svg>
