<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" role="img" aria-labelledby="title desc">
  <title id="title">智脊·京张 AI Spine · Jingzhang</title>
  <desc id="desc">百年京张AI创新带品牌标识：竖向脊梁串联三处创新节点，深蓝主色与铜橙辅色。</desc>
  <!-- 背景 -->
  <rect width="160" height="320" fill="#ffffff"/>
  <!-- 竖向脊梁（铁路/脊柱） -->
  <line x1="80" y1="40" x2="80" y2="280" stroke="#1B3A6B" stroke-width="10" stroke-linecap="round"/>
  <!-- 神经连接细线 -->
  <line x1="80" y1="90" x2="80" y2="230" stroke="#C07A3A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 三处节点 -->
  <circle cx="80" cy="70" r="22" fill="#1B3A6B"/>
  <circle cx="80" cy="70" r="8" fill="#ffffff"/>
  <circle cx="80" cy="160" r="22" fill="none" stroke="#1B3A6B" stroke-width="6"/>
  <circle cx="80" cy="160" r="8" fill="#C07A3A"/>
  <circle cx="80" cy="250" r="22" fill="#C07A3A"/>
  <circle cx="80" cy="250" r="8" fill="#ffffff"/>
  <!-- 品牌文字 -->
  <text x="80" y="306" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1B3A6B" font-weight="700">智脊 · 京张</text>
</svg>
