  <title id="usage-title">京张和鸣标志使用规范</title>
  <desc id="usage-desc">标志使用规范示意：安全区 1x、最小高度 24mm、标准彩色、单色和深色背景反白版本，以及禁止拉伸、倾斜、换色和拆分。三站声部共用人字钟摆铁轨骨架。</desc>
