<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="共数京张单色标识：实线与虚线区分两条正线，不依赖颜色 / Data Co-op Line monochrome mark: solid and dashed lines distinguish the two lines without color">
  <title>共数京张 / The Data Co-op Line — monochrome mark</title>
  <desc>Single-color variant. The data participation line stays solid and the no-data equivalent line stays dashed, so the two lines remain distinguishable without color.</desc>
  <line x1="10" y1="20" x2="50" y2="20" stroke="#182430" stroke-width="6" stroke-linecap="round"/>
  <line x1="10" y1="36" x2="50" y2="36" stroke="#182430" stroke-width="6" stroke-linecap="round" stroke-dasharray="7 5"/>
  <line x1="24" y1="12" x2="24" y2="44" stroke="#182430" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="12" x2="40" y2="44" stroke="#182430" stroke-width="6" stroke-linecap="round"/>
  <line x1="24" y1="44" x2="17" y2="54" stroke="#182430" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="44" x2="47" y2="54" stroke="#182430" stroke-width="6" stroke-linecap="round"/>
  <circle cx="56" cy="14" r="1.6" fill="#182430"/>
  <circle cx="56" cy="20" r="1.6" fill="#182430"/>
  <circle cx="56" cy="26" r="1.6" fill="#182430"/>
  <circle cx="56" cy="32" r="1.6" fill="#182430"/>
  <circle cx="56" cy="38" r="1.6" fill="#182430"/>
  <circle cx="56" cy="44" r="1.6" fill="#182430"/>
  <circle cx="56" cy="50" r="1.6" fill="#182430"/>
</svg>
