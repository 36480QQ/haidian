<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">道岔·SWITCH 证据闭环</title>
  <desc id="desc">五项慢变量、十二张场景卡和四道复核门通过公共证据形成可暂停、可复核、可退役的城市试验闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a5878"/></marker>
    <style>
      .bg{fill:#f7fafc}.title{font:700 30px 'Microsoft YaHei',Arial,sans-serif;fill:#18324b}.sub{font:16px 'Microsoft YaHei',Arial,sans-serif;fill:#4b6475}.head{font:700 20px 'Microsoft YaHei',Arial,sans-serif;fill:#18324b}.body{font:15px 'Microsoft YaHei',Arial,sans-serif;fill:#294657}.small{font:13px 'Microsoft YaHei',Arial,sans-serif;fill:#4b6475}.box{stroke:#2a5878;stroke-width:2;rx:18}.slow{fill:#e8f3ea}.fast{fill:#eaf2fb}.gate{fill:#fff3d9}.artifact{fill:#f1eafa}.line{stroke:#2a5878;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="620"/>
  <text class="title" x="70" y="65">道岔·SWITCH：从场景快轨到公共证据</text>
  <text class="sub" x="70" y="96">场景可以快，城市底盘必须慢；没有证据，就不加速。</text>
  <rect class="box slow" x="70" y="145" width="300" height="330"/>
  <text class="head" x="105" y="190">五项慢变量</text>
  <text class="body" x="105" y="230">SV-01 树荫与热舒适</text>
  <text class="body" x="105" y="270">SV-02 雨后渗透与恢复</text>
  <text class="body" x="105" y="310">SV-03 无障碍连续性</text>
  <text class="body" x="105" y="350">SV-04 街区业态与小商户</text>
  <text class="body" x="105" y="390">SV-05 儿童出行与照护安全</text>
  <text class="small" x="105" y="440">样点 · 频率 · 对照 · 参与者</text>
  <path class="line" d="M370 310 H470"/>
  <rect class="box fast" x="490" y="145" width="360" height="330"/>
  <text class="head" x="530" y="190">十二张场景卡</text>
  <text class="body" x="530" y="230">T0 问题与场地</text>
  <text class="body" x="530" y="265">T1 数据与权限</text>
  <text class="body" x="530" y="300">T2 基线与人工路径</text>
  <text class="body" x="530" y="335">T3 沙箱对时演练</text>
  <text class="body" x="530" y="370">T4 限时运行窗</text>
  <text class="body" x="530" y="405">T5 续期 / 降级 / 退役</text>
  <text class="small" x="530" y="445">每张卡：观测 · 验证 · 停止 · 产物</text>
  <path class="line" d="M850 310 H950"/>
  <rect class="box gate" x="970" y="145" width="300" height="330"/>
  <text class="head" x="1010" y="190">四道复核门</text>
  <text class="body" x="1010" y="240">G1 数据与安全</text>
  <text class="body" x="1010" y="285">G2 人工服务与可达</text>
  <text class="body" x="1010" y="330">G3 受影响群体</text>
  <text class="body" x="1010" y="375">G4 慢变量年度健康</text>
  <text class="small" x="1010" y="440">任一门不通过：缩小、暂停或退役</text>
  <path class="line" d="M1120 475 V545 H250 V475"/>
  <rect class="box artifact" x="250" y="515" width="900" height="75"/>
  <text class="head" x="300" y="560">公共产物：基线记录 · 人工复核 · 异议与回应 · 版本差异 · 退出清单</text>
</svg>
