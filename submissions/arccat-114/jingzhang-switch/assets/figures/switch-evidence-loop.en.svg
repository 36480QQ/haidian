<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">THE SWITCH evidence loop</title>
  <desc id="desc">Five slow variables, twelve scenario cards, and four review gates form a pauseable, reviewable, and decommissionable urban-experiment loop through public evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a5878"/></marker>
    <style>
      .bg{fill:#f7fafc}.title{font:700 30px Arial,sans-serif;fill:#18324b}.sub{font:16px Arial,sans-serif;fill:#4b6475}.head{font:700 20px Arial,sans-serif;fill:#18324b}.body{font:15px Arial,sans-serif;fill:#294657}.small{font:13px Arial,sans-serif;fill:#4b6475}.box{stroke:#2a5878;stroke-width:2;rx:18}.slow{fill:#e8f3ea}.fast{fill:#eaf2fb}.gate{fill:#fff3d9}.artifact{fill:#f1eafa}.line{stroke:#2a5878;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="620"/>
  <text class="title" x="70" y="65">THE SWITCH: from fast scenarios to public evidence</text>
  <text class="sub" x="70" y="96">Scenarios may move fast; the urban base must move slowly. No evidence, no acceleration.</text>
  <rect class="box slow" x="70" y="145" width="300" height="330"/>
  <text class="head" x="105" y="190">Five slow variables</text>
  <text class="body" x="105" y="230">SV-01 Shade and thermal comfort</text>
  <text class="body" x="105" y="270">SV-02 Rain recovery</text>
  <text class="body" x="105" y="310">SV-03 Accessibility continuity</text>
  <text class="body" x="105" y="350">SV-04 Local business continuity</text>
  <text class="body" x="105" y="390">SV-05 Children and caregiver safety</text>
  <text class="small" x="105" y="440">Points · frequency · comparison · participants</text>
  <path class="line" d="M370 310 H470"/>
  <rect class="box fast" x="490" y="145" width="360" height="330"/>
  <text class="head" x="530" y="190">Twelve scenario cards</text>
  <text class="body" x="530" y="230">T0 Problem and site</text>
  <text class="body" x="530" y="265">T1 Data and permission</text>
  <text class="body" x="530" y="300">T2 Baseline and human path</text>
  <text class="body" x="530" y="335">T3 Sandbox time-check</text>
  <text class="body" x="530" y="370">T4 Time-limited window</text>
  <text class="body" x="530" y="405">T5 Renew / degrade / retire</text>
  <text class="small" x="530" y="445">Each card: observe · validate · stop · publish</text>
  <path class="line" d="M850 310 H950"/>
  <rect class="box gate" x="970" y="145" width="300" height="330"/>
  <text class="head" x="1010" y="190">Four review gates</text>
  <text class="body" x="1010" y="240">G1 Data and safety</text>
  <text class="body" x="1010" y="285">G2 Human service and access</text>
  <text class="body" x="1010" y="330">G3 Affected groups</text>
  <text class="body" x="1010" y="375">G4 Annual slow-variable health</text>
  <text class="small" x="1010" y="440">Fail one gate: reduce, pause, or retire</text>
  <path class="line" d="M1120 475 V545 H250 V475"/>
  <rect class="box artifact" x="250" y="515" width="900" height="75"/>
  <text class="head" x="300" y="560">Public artifacts: baseline · human review · objections · version diff · exit list</text>
</svg>
